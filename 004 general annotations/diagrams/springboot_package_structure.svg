<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="pkgShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="460" fill="#0b0f19" rx="14"/>
  <rect x="2" y="2" width="856" height="456" fill="none" stroke="#1e293b" stroke-width="1.5" rx="13"/>

  <!-- Title -->
  <rect x="250" y="20" width="360" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="430" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">Recommended Package Structure</text>

  <!-- Root Package Container -->
  <g filter="url(#pkgShadow)">
    <rect x="50" y="80" width="760" height="350" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6,4"/>
  </g>

  <!-- Root Package Label -->
  <rect x="75" y="66" width="260" height="28" rx="6" fill="#0284c7"/>
  <text x="205" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Root Package: com.example.demo</text>

  <!-- Tree Lines -->
  <path d="M 120 120 L 120 380" stroke="#64748b" stroke-width="2"/>
  
  <!-- Branch 1: controller -->
  <path d="M 120 135 L 160 135" stroke="#64748b" stroke-width="2"/>
  <rect x="160" y="115" width="220" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <circle cx="180" cy="134" r="6" fill="#38bdf8"/>
  <text x="200" y="139" font-size="13" font-weight="600" fill="#f1f5f9">controller</text>
  <text x="280" y="139" font-size="11" fill="#94a3b8">(@RestController)</text>

  <!-- Branch 2: service -->
  <path d="M 120 185 L 160 185" stroke="#64748b" stroke-width="2"/>
  <rect x="160" y="165" width="220" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <circle cx="180" cy="184" r="6" fill="#4ade80"/>
  <text x="200" y="189" font-size="13" font-weight="600" fill="#f1f5f9">service</text>
  <text x="280" y="189" font-size="11" fill="#94a3b8">(@Service)</text>

  <!-- Branch 3: repository -->
  <path d="M 120 235 L 160 235" stroke="#64748b" stroke-width="2"/>
  <rect x="160" y="215" width="220" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <circle cx="180" cy="234" r="6" fill="#fbbf24"/>
  <text x="200" y="239" font-size="13" font-weight="600" fill="#f1f5f9">repository</text>
  <text x="280" y="239" font-size="11" fill="#94a3b8">(@Repository)</text>

  <!-- Branch 4: entity -->
  <path d="M 120 285 L 160 285" stroke="#64748b" stroke-width="2"/>
  <rect x="160" y="265" width="220" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <circle cx="180" cy="284" r="6" fill="#f43f5e"/>
  <text x="200" y="289" font-size="13" font-weight="600" fill="#f1f5f9">entity</text>
  <text x="280" y="289" font-size="11" fill="#94a3b8">(@Entity / Models)</text>

  <!-- Branch 5: exception -->
  <path d="M 120 335 L 160 335" stroke="#64748b" stroke-width="2"/>
  <rect x="160" y="315" width="220" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <circle cx="180" cy="334" r="6" fill="#a855f7"/>
  <text x="200" y="339" font-size="13" font-weight="600" fill="#f1f5f9">exception</text>
  <text x="280" y="339" font-size="11" fill="#94a3b8">(@ControllerAdvice)</text>

  <!-- Branch 6: DemoApplication.java (MAIN CLASS) -->
  <path d="M 120 385 L 160 385" stroke="#64748b" stroke-width="2"/>
  <rect x="160" y="365" width="280" height="42" rx="8" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.8"/>
  <circle cx="180" cy="386" r="6" fill="#a7f3d0"/>
  <text x="200" y="390" font-size="13.5" font-weight="700" fill="#ffffff">DemoApplication.java</text>
  <text x="350" y="390" font-size="11" font-weight="600" fill="#ccfbf1">(Main Class)</text>

  <!-- Callout / Explanation Card on Right -->
  <rect x="470" y="115" width="315" height="292" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="495" y="145" font-size="14" font-weight="700" fill="#38bdf8">Why put @SpringBootApplication</text>
  <text x="495" y="165" font-size="14" font-weight="700" fill="#38bdf8">in the Root Package?</text>

  <line x1="495" y1="180" x2="760" y2="180" stroke="#334155" stroke-width="1"/>

  <text x="495" y="210" font-size="12" fill="#cbd5e1">&#x2022; <tspan font-weight="700" fill="#f8fafc">Automatic Component Scan:</tspan></text>
  <text x="510" y="230" font-size="11.5" fill="#94a3b8">Spring scans the package containing the</text>
  <text x="510" y="248" font-size="11.5" fill="#94a3b8">main class and all its sub-packages.</text>

  <text x="495" y="280" font-size="12" fill="#cbd5e1">&#x2022; <tspan font-weight="700" fill="#f8fafc">Zero-Config Setup:</tspan></text>
  <text x="510" y="300" font-size="11.5" fill="#94a3b8">Controllers, Services, Repositories</text>
  <text x="510" y="318" font-size="11.5" fill="#94a3b8">are auto-detected without extra paths.</text>

  <rect x="490" y="340" width="275" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="502" y="360" font-size="11" font-weight="600" fill="#fde68a">&#x26A0; If outside root package:</text>
  <text x="502" y="377" font-size="10.5" fill="#cbd5e1">Must explicitly use scanBasePackages</text>
</svg>
