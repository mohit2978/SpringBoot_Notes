<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f87171"/>
    </marker>
    <marker id="arrGreen10" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/>
    </marker>
    <filter id="shadow10" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1060" height="480" fill="#0b0f19" rx="14"/>
  <rect x="2" y="2" width="1056" height="476" fill="none" stroke="#1e293b" stroke-width="1.5" rx="13"/>

  <!-- Title Header -->
  <rect x="280" y="18" width="500" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="530" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">Jackson Annotations — JSON Serialization / Deserialization</text>

  <!-- Left Side: Incoming Deserialization (JSON -> Java) -->
  <g filter="url(#shadow10)">
    <rect x="40" y="75" width="460" height="335" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/>
  </g>
  <rect x="60" y="90" width="240" height="26" rx="5" fill="#0284c7"/>
  <text x="180" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Deserialization (HTTP Request Body &#x2192; Java)</text>

  <!-- Flow Rows Deserialization -->
  <!-- 1. WRITE_ONLY -->
  <rect x="60" y="130" width="420" height="52" rx="6" fill="#14281e" stroke="#4ade80" stroke-width="1.2"/>
  <text x="75" y="152" font-family="monospace" font-size="11.5" font-weight="700" fill="#4ade80">@JsonProperty(access = WRITE_ONLY)</text>
  <text x="75" y="172" font-size="11" fill="#cbd5e1">e.g. password &#x2192; <tspan fill="#4ade80" font-weight="700">&#x2714; ACCEPTED</tspan> into Java object</text>

  <!-- 2. READ_ONLY -->
  <rect x="60" y="195" width="420" height="52" rx="6" fill="#281414" stroke="#f87171" stroke-width="1.2"/>
  <text x="75" y="217" font-family="monospace" font-size="11.5" font-weight="700" fill="#f87171">@JsonProperty(access = READ_ONLY)</text>
  <text x="75" y="237" font-size="11" fill="#cbd5e1">e.g. id, createdAt &#x2192; <tspan fill="#f87171" font-weight="700">&#x2718; IGNORED</tspan> on input</text>

  <!-- 3. @JsonIgnore -->
  <rect x="60" y="260" width="420" height="52" rx="6" fill="#281414" stroke="#f87171" stroke-width="1.2"/>
  <text x="75" y="282" font-family="monospace" font-size="11.5" font-weight="700" fill="#f87171">@JsonIgnore</text>
  <text x="75" y="302" font-size="11" fill="#cbd5e1">Any marked field &#x2192; <tspan fill="#f87171" font-weight="700">&#x2718; IGNORED</tspan> completely</text>

  <!-- 4. @JsonIgnoreProperties -->
  <rect x="60" y="325" width="420" height="52" rx="6" fill="#281414" stroke="#f87171" stroke-width="1.2"/>
  <text x="75" y="347" font-family="monospace" font-size="11.5" font-weight="700" fill="#f87171">@JsonIgnoreProperties({&quot;internalNotes&quot;})</text>
  <text x="75" y="367" font-size="11" fill="#cbd5e1">Class-level ignore &#x2192; <tspan fill="#f87171" font-weight="700">&#x2718; IGNORED</tspan> on input</text>


  <!-- Right Side: Outgoing Serialization (Java -> JSON) -->
  <g filter="url(#shadow10)">
    <rect x="560" y="75" width="460" height="335" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.6"/>
  </g>
  <rect x="580" y="90" width="230" height="26" rx="5" fill="#6b21a8"/>
  <text x="695" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Serialization (Java &#x2192; HTTP Response JSON)</text>

  <!-- Flow Rows Serialization -->
  <!-- 1. WRITE_ONLY -->
  <rect x="580" y="130" width="420" height="52" rx="6" fill="#281414" stroke="#f87171" stroke-width="1.2"/>
  <text x="595" y="152" font-family="monospace" font-size="11.5" font-weight="700" fill="#f87171">@JsonProperty(access = WRITE_ONLY)</text>
  <text x="595" y="172" font-size="11" fill="#cbd5e1">e.g. password &#x2192; <tspan fill="#f87171" font-weight="700">&#x2718; HIDDEN</tspan> from JSON output</text>

  <!-- 2. READ_ONLY -->
  <rect x="580" y="195" width="420" height="52" rx="6" fill="#14281e" stroke="#4ade80" stroke-width="1.2"/>
  <text x="595" y="217" font-family="monospace" font-size="11.5" font-weight="700" fill="#4ade80">@JsonProperty(access = READ_ONLY)</text>
  <text x="595" y="237" font-size="11" fill="#cbd5e1">e.g. id, createdAt &#x2192; <tspan fill="#4ade80" font-weight="700">&#x2714; INCLUDED</tspan> in JSON output</text>

  <!-- 3. @JsonIgnore -->
  <rect x="580" y="260" width="420" height="52" rx="6" fill="#281414" stroke="#f87171" stroke-width="1.2"/>
  <text x="595" y="282" font-family="monospace" font-size="11.5" font-weight="700" fill="#f87171">@JsonIgnore</text>
  <text x="595" y="302" font-size="11" fill="#cbd5e1">Any marked field &#x2192; <tspan fill="#f87171" font-weight="700">&#x2718; EXCLUDED</tspan> from JSON output</text>

  <!-- 4. @JsonIgnoreProperties -->
  <rect x="580" y="325" width="420" height="52" rx="6" fill="#281414" stroke="#f87171" stroke-width="1.2"/>
  <text x="595" y="347" font-family="monospace" font-size="11.5" font-weight="700" fill="#f87171">@JsonIgnoreProperties({&quot;internalNotes&quot;})</text>
  <text x="595" y="367" font-size="11" fill="#cbd5e1">Class-level ignore &#x2192; <tspan fill="#f87171" font-weight="700">&#x2718; EXCLUDED</tspan> from JSON output</text>

  <!-- Bottom Takeaway -->
  <rect x="150" y="425" width="760" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="530" y="449" text-anchor="middle" font-size="12" fill="#f1f5f9">
    <tspan fill="#facc15" font-weight="700">Security Rule:</tspan> Always use <tspan fill="#4ade80" font-family="monospace">WRITE_ONLY</tspan> on password fields so incoming credentials bind, but never leak in output JSON!
  </text>
</svg>
