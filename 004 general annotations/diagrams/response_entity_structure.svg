<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="reShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="980" height="440" fill="#0b0f19" rx="14"/>
  <rect x="2" y="2" width="976" height="436" fill="none" stroke="#1e293b" stroke-width="1.5" rx="13"/>

  <!-- Title -->
  <rect x="280" y="18" width="420" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="490" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">ResponseEntity vs @ResponseBody Structure</text>

  <!-- Left: Tree of HTTP Response -->
  <!-- Root node: HTTP Response -->
  <rect x="40" y="195" width="160" height="50" rx="10" fill="#0284c7" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="120" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">HTTP Response</text>

  <!-- Branch lines -->
  <path d="M 200 220 L 250 220 L 250 115 L 300 115" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 200 220 L 300 220" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 200 220 L 250 220 L 250 325 L 300 325" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- 1. Header Box -->
  <g filter="url(#reShadow)">
    <rect x="300" y="80" width="230" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="415" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#38bdf8">1. Headers</text>
    <text x="415" y="132" text-anchor="middle" font-size="11" fill="#94a3b8">Content-Type, Custom, Cache</text>
  </g>

  <!-- 2. Status Box -->
  <g filter="url(#reShadow)">
    <rect x="300" y="185" width="230" height="70" rx="8" fill="#1e293b" stroke="#facc15" stroke-width="1.5"/>
    <text x="415" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#facc15">2. HTTP Status</text>
    <text x="415" y="237" text-anchor="middle" font-size="11" fill="#94a3b8">200 OK, 201 Created, 404, 500</text>
  </g>

  <!-- 3. Body Box -->
  <g filter="url(#reShadow)">
    <rect x="300" y="290" width="230" height="70" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <text x="415" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#4ade80">3. Response Body</text>
    <text x="415" y="342" text-anchor="middle" font-size="11" fill="#94a3b8">Payload / Serialized JSON data</text>
  </g>

  <!-- Big Bracket grouping all 3 for ResponseEntity -->
  <path d="M 545 80 L 565 80 L 565 220 L 585 220 L 565 220 L 565 360 L 545 360" fill="none" stroke="#f43f5e" stroke-width="2.5"/>

  <!-- Right Callout 1: ResponseEntity represents ALL 3 -->
  <g filter="url(#reShadow)">
    <rect x="600" y="100" width="345" height="110" rx="10" fill="#1e1e38" stroke="#f43f5e" stroke-width="1.8"/>
    <text x="772" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#f43f5e">ResponseEntity is ALL 3</text>
    <text x="772" y="155" text-anchor="middle" font-size="12" fill="#cbd5e1">&#x2714; Headers + Status Code + Body</text>
    <text x="772" y="177" text-anchor="middle" font-size="11" fill="#94a3b8">Complete programmatic control over response</text>
    <text x="772" y="195" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#facc15">ResponseEntity.status(200).header(...).body(...)</text>
  </g>

  <!-- Right Callout 2: @ResponseBody only represents Body -->
  <path d="M 535 325 L 590 325" fill="none" stroke="#4ade80" stroke-width="2"/>
  <g filter="url(#reShadow)">
    <rect x="600" y="270" width="345" height="110" rx="10" fill="#14281e" stroke="#4ade80" stroke-width="1.8"/>
    <text x="772" y="300" text-anchor="middle" font-size="14.5" font-weight="700" fill="#4ade80">@ResponseBody / @RestController</text>
    <text x="772" y="325" text-anchor="middle" font-size="12" fill="#cbd5e1">&#x2714; Manages ONLY the Body (Payload)</text>
    <text x="772" y="347" text-anchor="middle" font-size="11" fill="#94a3b8">Status defaults to 200 OK</text>
    <text x="772" y="365" text-anchor="middle" font-size="11" fill="#94a3b8">Headers use default HttpMessageConverter headers</text>
  </g>

  <!-- Bottom note -->
  <text x="490" y="415" text-anchor="middle" font-size="12" fill="#94a3b8">
    <tspan fill="#38bdf8" font-weight="600">Note:</tspan> In @RestController, returning a String wraps in ResponseEntity automatically. In @Controller, String is resolved as View name!
  </text>
</svg>
