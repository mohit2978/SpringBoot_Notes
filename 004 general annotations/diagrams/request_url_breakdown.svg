<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="urlShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="980" height="340" fill="#0b0f19" rx="14"/>
  <rect x="2" y="2" width="976" height="336" fill="none" stroke="#1e293b" stroke-width="1.5" rx="13"/>

  <!-- Title -->
  <rect x="290" y="18" width="400" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="490" y="42" text-anchor="middle" font-size="14.5" font-weight="700" fill="#f8fafc">Anatomy of an HTTP Request URL</text>

  <!-- Full URL Card -->
  <g filter="url(#urlShadow)">
    <rect x="40" y="75" width="900" height="70" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- URL Segments with color coding -->
  <text x="60" y="117" font-family="'Consolas', 'Courier New', monospace" font-size="16" font-weight="600">
    <tspan fill="#38bdf8">http://localhost:8080</tspan>
    <tspan fill="#a855f7">/api/fetchUser</tspan>
    <tspan fill="#64748b">?</tspan>
    <tspan fill="#4ade80">firstName=SHRAYANSH</tspan>
    <tspan fill="#64748b">&amp;</tspan>
    <tspan fill="#4ade80">lastName=JAIN</tspan>
    <tspan fill="#64748b">&amp;</tspan>
    <tspan fill="#f59e0b">age=32</tspan>
  </text>

  <!-- Brackets & Callouts -->
  <!-- 1. Host Segment -->
  <path d="M 60 155 L 60 170 L 160 170 L 160 185 L 160 170 L 260 170 L 260 155" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
  <rect x="90" y="195" width="140" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="160" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#38bdf8">Host / Domain</text>
  <text x="160" y="242" text-anchor="middle" font-size="11" fill="#94a3b8">Server &amp; Port</text>

  <!-- 2. Path Segment -->
  <path d="M 275 155 L 275 170 L 330 170 L 330 185 L 330 170 L 390 170 L 390 155" fill="none" stroke="#a855f7" stroke-width="1.8"/>
  <rect x="260" y="195" width="145" height="85" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
  <text x="332" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#c084fc">Path (URI)</text>
  <text x="332" y="240" text-anchor="middle" font-size="11" fill="#94a3b8">Endpoint Route</text>
  <text x="332" y="258" text-anchor="middle" font-size="10.5" fill="#facc15">@PathVariable</text>
  <text x="332" y="272" text-anchor="middle" font-size="10" fill="#cbd5e1">(Identifies resource)</text>

  <!-- Question mark pointer -->
  <path d="M 405 155 L 405 185" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="405" y="205" text-anchor="middle" font-size="10" fill="#94a3b8">Separator (?)</text>

  <!-- 3. Request Parameters Segment -->
  <path d="M 420 155 L 420 170 L 660 170 L 660 185 L 660 170 L 920 170 L 920 155" fill="none" stroke="#4ade80" stroke-width="1.8"/>
  <rect x="440" y="195" width="460" height="115" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.2"/>
  <text x="670" y="220" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4ade80">Request Parameters (Query String)</text>
  <text x="670" y="240" text-anchor="middle" font-size="11.5" fill="#e2e8f0">Captured by <tspan font-family="monospace" font-weight="700" fill="#38bdf8">@RequestParam</tspan></text>
  <line x1="460" y1="250" x2="880" y2="250" stroke="#334155" stroke-width="1"/>
  <text x="670" y="270" text-anchor="middle" font-size="11" fill="#cbd5e1">&#x2714; Used for filtering, sorting, pagination, search</text>
  <text x="670" y="292" text-anchor="middle" font-size="11" fill="#facc15">&#x26A1; Automatic type conversion (String &quot;32&quot; &#x2192; int age = 32)</text>
</svg>
