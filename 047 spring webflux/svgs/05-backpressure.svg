  <text x="860.0" y="433.0" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">keep only the newest</text>
  <text x="500.0" y="495.0" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal" xml:space="preserve">Over HTTP the demand rides on TCP flow control: a slow client reads slowly → Netty stops pulling from the Flux.</text>
