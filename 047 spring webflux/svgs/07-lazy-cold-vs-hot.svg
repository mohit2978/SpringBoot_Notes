<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="500.0" y="44.0" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="26" fill="#1e1e1e" text-anchor="middle" font-weight="bold" xml:space="preserve">Nothing happens until you subscribe</text>
  <rect x="30" y="85" width="440" height="150" rx="10" fill="#e9ecef"/>
  <path d="M39.6,84.3 Q250.5,83.7 460.1,84.7 Q469.1,85.0 469.1,94.9 Q468.7,158.8 469.8,225.7 Q469.2,234.4 460.3,235.9 Q250.2,234.7 41.0,234.1 Q30.7,234.6 29.3,224.2 Q29.4,160.9 29.4,95.2 Q30.3,84.7 43.1,84.1" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
