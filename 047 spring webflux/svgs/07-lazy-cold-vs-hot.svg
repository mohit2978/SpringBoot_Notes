  <text x="45.0" y="110.0" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#868e96" text-anchor="start" font-weight="bold" xml:space="preserve">ASSEMBLY time (writing the recipe)</text>
  <text x="45.0" y="140.0" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="13" fill="#1e1e1e" text-anchor="start" font-weight="normal" xml:space="preserve">Mono&lt;User&gt; m = repo.findById(1L)</text>
  <text x="45.0" y="164.0" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="13" fill="#1e1e1e" text-anchor="start" font-weight="normal" xml:space="preserve">        .map(this::enrich)</text>
  <text x="45.0" y="188.0" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="13" fill="#1e1e1e" text-anchor="start" font-weight="normal" xml:space="preserve">        .doOnNext(u -&gt; log.info(...));</text>
  <text x="45.0" y="212.0" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="13" fill="#868e96" text-anchor="start" font-weight="normal" xml:space="preserve">// no query, no map, no log yet</text>
  <path d="M472.0,160.2 Q508.9,160.5 548.2,160.6" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M472.8,159.5 Q509.5,160.8 546.9,159.9" fill="none" stroke="#1e1e1e" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
