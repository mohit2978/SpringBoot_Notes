  <text x="257.5" y="330.3" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">COLD (the default)</text>
  <text x="257.5" y="348.5" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve"></text>
  <text x="257.5" y="366.7" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">starts from scratch for each subscriber,</text>
  <text x="257.5" y="384.9" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">like a movie on demand: every viewer</text>
  <text x="257.5" y="403.1" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">starts at minute 0</text>
  <text x="257.5" y="421.3" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve"></text>
  <text x="257.5" y="439.5" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">repository calls, WebClient, Flux.range</text>
  <rect x="515" y="275" width="455" height="210" rx="10" fill="#ffd8a8"/>
  <path d="M524.3,274.3 Q743.7,275.9 959.3,275.7 Q971.0,275.3 969.7,285.1 Q968.9,378.5 970.9,475.3 Q970.1,485.9 959.9,485.7 Q743.5,484.1 524.5,484.6 Q514.5,485.2 514.5,474.8 Q513.9,381.2 514.7,284.9 Q515.2,275.8 527.8,275.8" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
