  <path d="M535.4,166.1 L548.0,160.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="510.0" y="152.0" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" xml:space="preserve">subscribe()</text>
  <rect x="550" y="85" width="420" height="150" rx="10" fill="#b2f2bb"/>
  <path d="M559.3,84.2 Q758.7,85.8 959.3,84.5 Q969.8,85.7 969.2,94.9 Q970.1,161.2 970.6,225.7 Q969.6,234.8 959.7,235.8 Q761.4,234.0 559.4,234.5 Q549.5,235.0 550.2,224.5 Q548.5,159.8 549.7,95.1 Q550.9,85.4 563.0,85.2" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M560.6,83.6 Q761.9,86.3 961.2,86.0 Q969.7,84.7 968.7,95.4 Q967.9,157.9 969.1,223.9 Q969.5,233.6 958.4,233.9 Q758.1,234.3 558.5,236.2 Q550.4,233.9 549.2,224.5 Q549.3,158.2 551.1,96.6 Q549.9,84.9 561.7,83.7" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="760.0" y="128.5" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">SUBSCRIPTION time (cooking)</text>
  <text x="760.0" y="146.7" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve"></text>
  <text x="760.0" y="164.9" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">m.subscribe() or return m from a controller</text>
  <text x="760.0" y="183.1" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">→ query runs → map runs → log prints</text>
  <text x="760.0" y="201.3" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">(every new subscribe runs it all AGAIN)</text>
  <rect x="30" y="275" width="455" height="210" rx="10" fill="#a5d8ff"/>
  <path d="M39.7,274.5 Q258.5,274.0 474.0,275.9 Q485.1,274.3 485.1,284.1 Q485.1,381.4 485.7,475.4 Q484.5,484.7 474.3,485.5 Q257.6,485.8 39.7,484.4 Q30.6,486.0 30.7,475.6 Q31.0,380.7 29.5,285.0 Q29.7,274.1 42.1,274.6" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
