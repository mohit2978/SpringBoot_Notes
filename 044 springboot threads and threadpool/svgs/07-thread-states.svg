<svg viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" font-size="13">
<rect width="1040" height="560" fill="#1e1e1e" rx="8"/>
<defs><marker id="th" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9aa3a4"/></marker></defs>

<text x="520" y="32" fill="#d4a017" font-size="18" font-weight="bold" text-anchor="middle">Thread states — what you are looking at in a thread dump</text>

<rect x="40" y="64" width="150" height="56" rx="8" fill="#2a2a2a" stroke="#888"/>
<text x="115" y="88" fill="#e0e0e0" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace">NEW</text>
<text x="115" y="108" fill="#aaa" text-anchor="middle" font-size="11">created, not started</text>

<line x1="190" y1="92" x2="228" y2="92" stroke="#9aa3a4" stroke-width="2" marker-end="url(#th)"/>
<text x="209" y="84" fill="#aaa" font-size="10" text-anchor="middle">start()</text>

<rect x="232" y="64" width="170" height="56" rx="8" fill="#234a3e" stroke="#4ec9b0" stroke-width="2"/>
<text x="317" y="88" fill="#9ae6d0" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace">RUNNABLE</text>
<text x="317" y="108" fill="#aaa" text-anchor="middle" font-size="11">running, or ready to run</text>

<line x1="402" y1="92" x2="440" y2="92" stroke="#9aa3a4" stroke-width="2" marker-end="url(#th)"/>
<rect x="444" y="64" width="160" height="56" rx="8" fill="#2a2a2a" stroke="#888"/>
<text x="524" y="88" fill="#e0e0e0" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace">TERMINATED</text>
<text x="524" y="108" fill="#aaa" text-anchor="middle" font-size="11">run() finished</text>

<!-- blocked / waiting -->
<line x1="280" y1="120" x2="220" y2="176" stroke="#9aa3a4" stroke-width="2" marker-end="url(#th)"/>
<rect x="60" y="180" width="300" height="86" rx="8" fill="#3a2a2a" stroke="#f14c4c" stroke-width="2"/>
<text x="210" y="204" fill="#ffb3b3" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace">BLOCKED</text>
<text x="210" y="226" fill="#e0e0e0" text-anchor="middle" font-size="12">waiting to enter a <tspan font-family="Consolas, monospace">synchronized</tspan> block</text>
<text x="210" y="248" fill="#f14c4c" text-anchor="middle" font-size="11.5">many threads BLOCKED on one lock = contention</text>

<line x1="340" y1="120" x2="400" y2="176" stroke="#9aa3a4" stroke-width="2" marker-end="url(#th)"/>
<rect x="390" y="180" width="300" height="86" rx="8" fill="#4a3a1a" stroke="#d4a017" stroke-width="2"/>
<text x="540" y="204" fill="#f0d68a" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace">WAITING</text>
<text x="540" y="226" fill="#e0e0e0" text-anchor="middle" font-size="12"><tspan font-family="Consolas, monospace">wait()</tspan>, <tspan font-family="Consolas, monospace">join()</tspan>, <tspan font-family="Consolas, monospace">park()</tspan> — no timeout</text>
<text x="540" y="248" fill="#d4a017" text-anchor="middle" font-size="11.5">waits forever until someone signals it</text>

<rect x="720" y="180" width="280" height="86" rx="8" fill="#2a3a4a" stroke="#569cd6" stroke-width="2"/>
<text x="860" y="204" fill="#9cdcfe" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace">TIMED_WAITING</text>
<text x="860" y="226" fill="#e0e0e0" text-anchor="middle" font-size="12"><tspan font-family="Consolas, monospace">sleep(n)</tspan>, <tspan font-family="Consolas, monospace">wait(n)</tspan>, <tspan font-family="Consolas, monospace">poll(timeout)</tspan></text>
<text x="860" y="248" fill="#569cd6" text-anchor="middle" font-size="11.5">normal for idle pool threads</text>

<line x1="40" y1="290" x2="1000" y2="290" stroke="#444"/>

<text x="520" y="320" fill="#e0e0e0" font-size="15" font-weight="bold" text-anchor="middle">Reading a real dump — what each pattern means</text>

<rect x="40" y="338" width="960" height="132" rx="8" fill="#1a1a1a" stroke="#555"/>
<g font-family="Consolas, monospace" font-size="11.5">
<text x="58" y="362" fill="#9ae6d0">"http-nio-8080-exec-7" #34 daemon prio=5 <tspan fill="#4ec9b0">RUNNABLE</tspan></text>
<text x="76" y="380" fill="#aaa">at java.net.SocketInputStream.socketRead0(Native Method)   <tspan fill="#d4a017">← waiting on the DB, counted as RUNNABLE</tspan></text>

<text x="58" y="408" fill="#ffb3b3">"http-nio-8080-exec-12" #39 daemon prio=5 <tspan fill="#f14c4c">BLOCKED</tspan> on 0x000000076ab2</text>
<text x="76" y="426" fill="#aaa">at com.acme.OrderService.process(OrderService.java:42)     <tspan fill="#f14c4c">← lock contention, your bug</tspan></text>

<text x="58" y="454" fill="#9cdcfe">"http-nio-8080-exec-3" #28 daemon prio=5 <tspan fill="#569cd6">TIMED_WAITING</tspan> (parking)</text>
<text x="76" y="466" fill="#aaa">at com.zaxxer.hikari.pool.HikariPool.getConnection(...)    <tspan fill="#d4a017">← starved of DB connections</tspan></text>
</g>

<rect x="40" y="486" width="470" height="62" rx="8" fill="#252525"/>
<text x="58" y="510" fill="#e0e0e0" font-weight="bold" font-size="13">Taking a dump</text>
<text x="58" y="532" fill="#d4a017" font-family="Consolas, monospace" font-size="12">jcmd &lt;pid&gt; Thread.print    |    jstack &lt;pid&gt;</text>

<rect x="530" y="486" width="470" height="62" rx="8" fill="#252525"/>
<text x="548" y="510" fill="#e0e0e0" font-weight="bold" font-size="13">Or from the running app</text>
<text x="548" y="532" fill="#d4a017" font-family="Consolas, monospace" font-size="12">GET /actuator/threaddump</text>
</svg>
