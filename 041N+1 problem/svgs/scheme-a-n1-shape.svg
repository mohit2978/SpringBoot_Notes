<svg viewBox="0 0 920 860" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="920" height="860" rx="16" fill="url(#bgGrad2)"/>

  <!-- Subtle grid -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="90" x2="920" y2="90"/>
    <line x1="0" y1="280" x2="920" y2="280"/>
    <line x1="0" y1="580" x2="920" y2="580"/>
    <line x1="0" y1="760" x2="920" y2="760"/>
  </g>

  <!-- HTTP Request Header Banner -->
  <g transform="translate(40, 30)">
    <rect width="840" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#boxShadow)"/>
    
    <!-- Method Badge -->
    <rect x="20" y="15" width="60" height="30" rx="6" fill="#10b981"/>
    <text x="50" y="35" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle" font-family="Consolas, monospace">GET</text>
    
    <!-- Endpoint URL -->
    <text x="95" y="36" fill="#f8fafc" font-size="17" font-weight="600" font-family="Consolas, monospace">/api/orders?limit=100</text>
    
    <!-- Callout on right -->
    <rect x="610" y="15" width="210" height="30" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="715" y="34" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">Single Client HTTP Call</text>
  </g>

  <!-- Arrow down to Step 1 -->
  <line x1="460" y1="90" x2="460" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= STEP 1: Root Orders Query ================= -->
  <g transform="translate(40, 125)" filter="url(#boxShadow)">
    <rect width="840" height="120" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    
    <!-- Step Badge -->
    <rect x="20" y="18" width="36" height="36" rx="8" fill="url(#stepGrad1)"/>
    <text x="38" y="42" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle">1</text>
    
    <!-- Title & Description -->
    <text x="70" y="34" fill="#38bdf8" font-size="15" font-weight="700">QUERY 1: ROOT ORDERS FETCH</text>
    <text x="70" y="52" fill="#94a3b8" font-size="12">Executed by ordersRepository.findAll() or JPQL query "SELECT o FROM Order o"</text>
    
    <!-- SQL Box -->
    <g transform="translate(20, 68)">
      <rect width="570" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="16" y="23" fill="#38bdf8" font-family="Consolas, monospace" font-size="13">SELECT o1_0.id, o1_0.created_at, o1_0.customer_id FROM orders o1_0 LIMIT 100;</text>
    </g>

    <!-- Result DB Indicator -->
    <g transform="translate(615, 68)">
      <rect width="205" height="36" rx="6" fill="#0369a1" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
      <text x="102" y="23" fill="#e0f2fe" font-size="12" font-weight="600" text-anchor="middle">✓ Returns 100 Order entities</text>
    </g>
  </g>

  <!-- Loop transition line -->
  <g transform="translate(40, 245)">
    <line x1="420" y1="0" x2="420" y2="35" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowAmber)"/>
    <rect x="290" y="12" width="260" height="24" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="420" y="28" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">LOOP: for each Order → order.getLines()</text>
  </g>

  <!-- ================= STEP 2: The +100 Queries for Order Lines ================= -->
  <g transform="translate(40, 285)" filter="url(#boxShadow)">
    <rect width="840" height="250" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    
    <!-- Step Badge -->
    <rect x="20" y="18" width="56" height="36" rx="8" fill="url(#stepGrad2)"/>
    <text x="48" y="42" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">+100</text>

    <!-- Title & Description -->
    <text x="90" y="34" fill="#fbbf24" font-size="15" font-weight="700">QUERIES 2..101: LAZY COLLECTION INITIALIZATION (PersistentBag)</text>
    <text x="90" y="52" fill="#94a3b8" font-size="12">Each order has an uninitialized PersistentBag; accessing it triggers a separate round-trip to the DB</text>

    <!-- Multiple queries listed -->
    <g transform="translate(20, 68)" font-family="Consolas, monospace" font-size="12">
      <!-- Query 2 -->
      <rect x="0" y="0" width="570" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="21" fill="#fcd34d">Query 2:   SELECT * FROM order_line WHERE order_id = 1;</text>

      <!-- Query 3 -->
      <rect x="0" y="38" width="570" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="59" fill="#fcd34d">Query 3:   SELECT * FROM order_line WHERE order_id = 2;</text>

      <!-- Ellipsis -->
      <rect x="0" y="76" width="570" height="24" rx="4" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="285" y="93" fill="#64748b" text-anchor="middle" font-weight="700">• • • 97 More Identical Statements Fired Sequentially • • •</text>

      <!-- Query 101 -->
      <rect x="0" y="106" width="570" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="127" fill="#fcd34d">Query 101: SELECT * FROM order_line WHERE order_id = 100;</text>
    </g>

    <!-- Right Side Diagnostic Card -->
    <g transform="translate(615, 68)">
      <rect width="205" height="138" rx="8" fill="#78350f" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
      <text x="20" y="28" fill="#fef3c7" font-size="13" font-weight="700">100 ROUND-TRIPS</text>
      <text x="20" y="50" fill="#fde68a" font-size="11">Average order: 10 lines</text>
      <text x="20" y="70" fill="#fde68a" font-size="11">Total lines: ~1,000 rows</text>
      <line x1="20" y1="84" x2="185" y2="84" stroke="#f59e0b" stroke-opacity="0.3"/>
      <text x="20" y="104" fill="#fbbf24" font-size="11" font-weight="600">Network Latency:</text>
      <text x="20" y="122" fill="#ffffff" font-size="12" font-weight="700">100 × 0.8ms = 80ms</text>
    </g>

    <!-- Warning Pill at bottom -->
    <rect x="20" y="215" width="800" height="24" rx="4" fill="#451a03" stroke="#b45309" stroke-width="1"/>
    <text x="420" y="231" fill="#fed7aa" font-size="11" font-weight="600" text-anchor="middle">
      ⚠️ HikariCP connection held for entire iteration loop duration, choking other threads!
    </text>
  </g>

  <!-- Second Loop transition line -->
  <g transform="translate(40, 535)">
    <line x1="420" y1="0" x2="420" y2="35" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>
    <rect x="270" y="12" width="300" height="24" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
    <text x="420" y="28" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">NESTED LOOP: for each Line → line.getProduct()</text>
  </g>

  <!-- ================= STEP 3: Up to 1,000 Queries for Products ================= -->
  <g transform="translate(40, 575)" filter="url(#boxShadow)">
    <rect width="840" height="155" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    
    <!-- Step Badge -->
    <rect x="20" y="18" width="70" height="36" rx="8" fill="url(#stepGrad3)"/>
    <text x="55" y="42" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">+1,000</text>

    <!-- Title & Description -->
    <text x="105" y="34" fill="#f87171" font-size="15" font-weight="700">QUERIES 102..1101: NESTED N+1 PROXY RESOLUTION (ByteBuddy)</text>
    <text x="105" y="52" fill="#94a3b8" font-size="12">Each OrderLine points to a Product proxy; accessing product.getName() triggers an individual SELECT</text>

    <!-- Query Box -->
    <g transform="translate(20, 68)" font-family="Consolas, monospace" font-size="12">
      <rect width="570" height="42" rx="6" fill="#0f172a" stroke="#7f1d1d" stroke-width="1"/>
      <text x="14" y="26" fill="#fca5a5">SELECT id, name, sku FROM product WHERE id = ?;  [fired up to 1,000×]</text>
    </g>

    <!-- Right Side Diagnostic Card -->
    <g transform="translate(615, 68)">
      <rect width="205" height="42" rx="8" fill="#7f1d1d" fill-opacity="0.3" stroke="#ef4444" stroke-width="1"/>
      <text x="102" y="26" fill="#fca5a5" font-size="12" font-weight="700" text-anchor="middle">💥 N+1 INSIDE N+1</text>
    </g>

    <!-- Critical alert banner -->
    <rect x="20" y="120" width="800" height="24" rx="4" fill="#7f1d1d" fill-opacity="0.4" stroke="#dc2626" stroke-width="1"/>
    <text x="420" y="136" fill="#fecaca" font-size="11" font-weight="700" text-anchor="middle">
      🚨 Cascading Query Storm: 1 + 100 + 1,000 = 1,101 round-trips for a single web page!
    </text>
  </g>

  <!-- ================= TOTAL SUMMARY FOOTER ================= -->
  <g transform="translate(40, 755)" filter="url(#boxShadow)">
    <rect width="840" height="75" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    
    <g transform="translate(30, 22)">
      <text x="0" y="20" fill="#f8fafc" font-size="16" font-weight="700">Total Damage for 1 Request:</text>
      <text x="0" y="42" fill="#94a3b8" font-size="13">1 Initial Query + 100 Collection Queries + 1,000 Entity Proxies</text>
    </g>

    <!-- Big Stat Badges -->
    <g transform="translate(560, 16)">
      <rect x="0" y="0" width="125" height="44" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
      <text x="62" y="20" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">TOTAL QUERIES</text>
      <text x="62" y="38" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">1,101 SQL</text>

      <rect x="140" y="0" width="125" height="44" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
      <text x="202" y="20" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">LATENCY</text>
      <text x="202" y="38" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">2.4+ SEC</text>
    </g>
  </g>
</svg>
