<svg viewBox="0 0 790 780" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<rect width="790" height="780" fill="#f7f6ee"/>
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#4a5c5e"/></marker>
  <g id="db">
    <ellipse cx="42" cy="12" rx="42" ry="12" fill="#a8ab63"/>
    <path d="M0,12 L0,62 A42,12 0 0,0 84,62 L84,12 A42,12 0 0,1 0,12 Z" fill="#3d4f52"/>
    <ellipse cx="42" cy="33" rx="42" ry="11" fill="none" stroke="#f7f6ee" stroke-width="3"/>
    <ellipse cx="42" cy="52" rx="42" ry="11" fill="none" stroke="#f7f6ee" stroke-width="3"/>
  </g>
  <g id="tbl">
    <rect x="0" y="0" width="34" height="34" rx="4" fill="none" stroke="#3d4f52" stroke-width="2.5"/>
    <line x1="0" y1="11" x2="34" y2="11" stroke="#3d4f52" stroke-width="2.5"/>
    <line x1="12" y1="11" x2="12" y2="34" stroke="#3d4f52" stroke-width="2.5"/>
  </g>
</defs>

<rect x="28" y="22" width="400" height="52" rx="14" fill="#eef0e2"/>
<rect x="44" y="34" width="72" height="30" rx="8" fill="#8f9350"/>
<text x="80" y="55" fill="#fff" font-size="17" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">GET</text>
<text x="132" y="57" fill="#3d4f52" font-size="20" font-family="Consolas, monospace">/orders?limit=100</text>

<circle cx="50" cy="146" r="21" fill="#8f9350"/>
<text x="50" y="153" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle">1</text>
<rect x="90" y="118" width="336" height="58" rx="9" fill="#3d4f52"/>
<text x="110" y="142" fill="#eef0e2" font-size="15" font-family="Consolas, monospace">SELECT * FROM orders</text>
<text x="110" y="164" fill="#eef0e2" font-size="15" font-family="Consolas, monospace">LIMIT 100</text>
<line x1="440" y1="146" x2="486" y2="146" stroke="#4a5c5e" stroke-width="2" marker-end="url(#a)"/>
<use href="#db" x="500" y="105"/>
<use href="#tbl" x="622" y="118"/>
<text x="639" y="170" fill="#3d4f52" font-size="17" font-weight="600">orders</text>

<line x1="55" y1="196" x2="55" y2="228" stroke="#9aa3a4" stroke-width="3" marker-end="url(#a)"/>
<text x="90" y="226" fill="#4a5c5e" font-size="17">for each order → order.getLines()</text>

<rect x="28" y="248" width="722" height="272" rx="14" fill="#f2f2e6"/>
<circle cx="68" cy="290" r="19" fill="#8f9350"/><text x="68" y="296" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle">2</text>
<rect x="105" y="264" width="390" height="54" rx="8" fill="#46585a"/>
<text x="128" y="286" fill="#eef0e2" font-size="14" font-family="Consolas, monospace">SELECT * FROM order_line</text>
<text x="128" y="306" fill="#eef0e2" font-size="14" font-family="Consolas, monospace">WHERE order_id = 1</text>

<circle cx="68" cy="365" r="19" fill="#8f9350"/><text x="68" y="371" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle">3</text>
<rect x="105" y="339" width="390" height="54" rx="8" fill="#46585a"/>
<text x="128" y="361" fill="#eef0e2" font-size="14" font-family="Consolas, monospace">SELECT * FROM order_line</text>
<text x="128" y="381" fill="#eef0e2" font-size="14" font-family="Consolas, monospace">WHERE order_id = 2</text>

<text x="112" y="430" fill="#4a5c5e" font-size="22" font-weight="bold">...</text>

<circle cx="68" cy="475" r="21" fill="#8f9350"/><text x="68" y="481" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">101</text>
<rect x="105" y="449" width="390" height="54" rx="8" fill="#46585a"/>
<text x="128" y="471" fill="#eef0e2" font-size="14" font-family="Consolas, monospace">SELECT * FROM order_line</text>
<text x="128" y="491" fill="#eef0e2" font-size="14" font-family="Consolas, monospace">WHERE order_id = 100</text>

<path d="M512,268 q14,0 14,16 L526,368 q0,12 14,12 q-14,0 -14,12 L526,488 q0,16 -14,16" stroke="#9aa3a4" stroke-width="2" fill="none"/>
<line x1="542" y1="380" x2="566" y2="380" stroke="#4a5c5e" stroke-width="2" marker-end="url(#a)"/>
<use href="#db" x="576" y="338"/>
<use href="#tbl" x="688" y="358"/>
<text x="660" y="422" fill="#3d4f52" font-size="15" font-weight="600">order_line</text>

<line x1="55" y1="540" x2="55" y2="572" stroke="#9aa3a4" stroke-width="3" marker-end="url(#a)"/>
<text x="90" y="570" fill="#4a5c5e" font-size="17">for each line → line.getProduct()</text>

<rect x="28" y="592" width="722" height="162" rx="14" fill="#f2f2e6"/>
<rect x="80" y="608" width="176" height="32" rx="8" fill="#e3e6cf"/>
<text x="96" y="630" fill="#3d4f52" font-size="15">up to 1,000 more:</text>
<rect x="80" y="652" width="366" height="56" rx="8" fill="#46585a"/>
<text x="102" y="675" fill="#eef0e2" font-size="14" font-family="Consolas, monospace">SELECT * FROM product</text>
<text x="102" y="695" fill="#eef0e2" font-size="14" font-family="Consolas, monospace">WHERE id = ?</text>
<path d="M466,652 q14,0 14,14 L480,680 q0,14 -14,14 q14,0 14,14 L480,708 q0,0 -14,0" stroke="#9aa3a4" stroke-width="2" fill="none"/>
<use href="#db" x="540" y="640"/>
<use href="#tbl" x="654" y="650"/>
<text x="640" y="720" fill="#3d4f52" font-size="15" font-weight="600">product</text>
</svg>
