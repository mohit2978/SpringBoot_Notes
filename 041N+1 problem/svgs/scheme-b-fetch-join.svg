<g font-family="Consolas, monospace" font-size="15.5" fill="#eef0e2">
<text x="160" y="156">SELECT o.*, l.*, p.*</text>
<text x="160" y="178">FROM orders o</text>
<text x="160" y="200">LEFT JOIN order_line l ON l.order_id = o.id</text>
<text x="160" y="222">LEFT JOIN product    p ON p.id = l.product_id</text>
</g>

