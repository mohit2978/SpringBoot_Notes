<svg viewBox="0 0 1100 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#060c1c"/>
    </linearGradient>

    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="cardShadow3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1100" height="640" rx="16" fill="url(#bgGrad3)"/>

  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="120" x2="1100" y2="120"/>
    <line x1="0" y1="280" x2="1100" y2="280"/>
    <line x1="0" y1="520" x2="1100" y2="520"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(50, 32)">
    <rect x="0" y="0" width="160" height="24" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
    <text x="80" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">FIX 1: JOIN FETCH</text>
    
    <text x="0" y="52" fill="#f8fafc" font-size="26" font-weight="800">
      The Single Round-Trip Solution: <tspan fill="#38bdf8">SQL JOIN Mechanics</tspan>
    </text>
    <text x="0" y="74" fill="#94a3b8" font-size="13">
      Tells Hibernate to fetch the root entity and its associations together in one query using SQL joins.
    </text>
  </g>

  <!-- TOP CARD: The JPQL & Emitted SQL -->
  <g transform="translate(50, 125)" filter="url(#cardShadow3)">
    <rect width="1000" height="135" rx="12" fill="url(#blueCard)" stroke="#1e3a8a" stroke-width="1.5"/>
    
    <!-- Code Box Header -->
    <g transform="translate(20, 16)">
      <circle cx="6" cy="6" r="4" fill="#ef4444"/>
      <circle cx="20" cy="6" r="4" fill="#f59e0b"/>
      <circle cx="34" cy="6" r="4" fill="#10b981"/>
      <text x="50" y="10" fill="#94a3b8" font-size="11" font-weight="600" font-family="Consolas, monospace">JPQL QUERY → EMITTED SQL (HIBERNATE 7.4 / 6.x)</text>
    </g>

    <!-- Code Line -->
    <g transform="translate(20, 42)" font-family="Consolas, Monaco, monospace">
      <rect width="960" height="75" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
      <text x="18" y="24" font-size="13">
        <tspan fill="#ec4899">SELECT</tspan> <tspan fill="#e2e8f0">o </tspan>
        <tspan fill="#ec4899">FROM</tspan> <tspan fill="#e2e8f0">Order o </tspan>
        <tspan fill="#38bdf8">JOIN FETCH</tspan> <tspan fill="#e2e8f0">o.customer </tspan>
        <tspan fill="#38bdf8">LEFT JOIN FETCH</tspan> <tspan fill="#e2e8f0">o.lines l </tspan>
        <tspan fill="#38bdf8">LEFT JOIN FETCH</tspan> <tspan fill="#e2e8f0">l.product </tspan>
        <tspan fill="#ec4899">WHERE</tspan> <tspan fill="#e2e8f0">o.createdAt &gt;= :since</tspan>
      </text>
      <line x1="18" y1="36" x2="940" y2="36" stroke="#1e293b" stroke-width="1"/>
      <text x="18" y="58" font-size="12" fill="#64748b">
        Emits: <tspan fill="#94a3b8">SELECT o1_0.id, c1_0.name, l1_0.id, p1_0.name FROM orders o1_0 JOIN customer c1_0 ... LEFT JOIN order_line l1_0 ...</tspan>
      </text>
    </g>
  </g>

  <!-- MIDDLE SECTION: Tables joined into Single Cartesian Result Set -->
  <g transform="translate(50, 285)">
    <!-- Source Entity Tables (Left) -->
    <g transform="translate(0, 0)">
      <!-- DB icon & label -->
      <text x="0" y="20" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="0.5">SOURCE RELATIONS</text>
      
      <!-- Table 1: orders -->
      <g transform="translate(0, 32)">
        <rect width="180" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="14" y="22" fill="#e2e8f0" font-size="13" font-weight="700">orders (o)</text>
        <text x="14" y="36" fill="#38bdf8" font-size="10">100 rows</text>
      </g>

      <!-- Plus sign -->
      <text x="85" y="98" fill="#64748b" font-size="20" font-weight="700" text-anchor="middle">+</text>

      <!-- Table 2: customer -->
      <g transform="translate(0, 110)">
        <rect width="180" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="14" y="22" fill="#e2e8f0" font-size="13" font-weight="700">customer (c)</text>
        <text x="14" y="36" fill="#38bdf8" font-size="10">Many-to-One (inner join)</text>
      </g>

      <!-- Plus sign -->
      <text x="85" y="176" fill="#64748b" font-size="20" font-weight="700" text-anchor="middle">+</text>

      <!-- Table 3: order_line & product -->
      <g transform="translate(0, 188)">
        <rect width="180" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="14" y="22" fill="#e2e8f0" font-size="13" font-weight="700">order_line + product</text>
        <text x="14" y="36" fill="#38bdf8" font-size="10">~1,000 rows (left joins)</text>
      </g>
    </g>

    <!-- Arrow joining to result table -->
    <g transform="translate(200, 115)">
      <line x1="0" y1="0" x2="45" y2="0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
      <text x="22" y="-10" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">SQL JOIN</text>
    </g>

    <!-- Unified Cartesian Result Set (Center) -->
    <g transform="translate(265, 0)" filter="url(#cardShadow3)">
      <rect width="460" height="230" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
      <text x="18" y="24" fill="#f8fafc" font-size="13" font-weight="700">UNIFIED RESULT SET (~1,000 FLAT ROWS)</text>
      <text x="440" y="24" fill="#10b981" font-size="11" font-weight="700" text-anchor="end">1 DATABASE ROUND-TRIP</text>

      <!-- Table Header -->
      <g transform="translate(15, 38)" font-family="Consolas, monospace" font-size="11">
        <rect width="430" height="26" rx="4" fill="#1e293b"/>
        <text x="15" y="17" fill="#38bdf8" font-weight="700">o.id (Order)</text>
        <text x="110" y="17" fill="#818cf8" font-weight="700">c.name</text>
        <text x="210" y="17" fill="#34d399" font-weight="700">l.id (Line)</text>
        <text x="310" y="17" fill="#fbbf24" font-weight="700">p.name (Product)</text>

        <!-- Rows -->
        <!-- Row 1 -->
        <rect x="0" y="30" width="430" height="22" rx="2" fill="#0f172a"/>
        <text x="15" y="45" fill="#f1f5f9">Order #1</text>
        <text x="110" y="45" fill="#94a3b8">Acme Corp</text>
        <text x="210" y="45" fill="#f1f5f9">Line #101</text>
        <text x="310" y="45" fill="#94a3b8">MacBook Pro</text>

        <!-- Row 2 -->
        <rect x="0" y="54" width="430" height="22" rx="2" fill="#172033"/>
        <text x="15" y="69" fill="#f1f5f9">Order #1</text>
        <text x="110" y="69" fill="#94a3b8">Acme Corp</text>
        <text x="210" y="69" fill="#f1f5f9">Line #102</text>
        <text x="310" y="69" fill="#94a3b8">USB-C Cable</text>

        <!-- Row 3 -->
        <rect x="0" y="78" width="430" height="22" rx="2" fill="#0f172a"/>
        <text x="15" y="93" fill="#f1f5f9">Order #1</text>
        <text x="110" y="93" fill="#94a3b8">Acme Corp</text>
        <text x="210" y="93" fill="#f1f5f9">Line #103</text>
        <text x="310" y="93" fill="#94a3b8">Wireless Mouse</text>

        <!-- Dots -->
        <rect x="0" y="102" width="430" height="20" rx="2" fill="#111827"/>
        <text x="215" y="116" fill="#64748b" text-anchor="middle">• • • Rows 4 to 1,000 (Order columns repeated 10× per order) • • •</text>

        <!-- Row 1000 -->
        <rect x="0" y="124" width="430" height="22" rx="2" fill="#0f172a"/>
        <text x="15" y="139" fill="#f1f5f9">Order #100</text>
        <text x="110" y="139" fill="#94a3b8">Global Inc</text>
        <text x="210" y="139" fill="#f1f5f9">Line #999</text>
        <text x="310" y="139" fill="#94a3b8">4K Monitor</text>
      </g>

      <!-- Repeating columns note -->
      <rect x="15" y="196" width="430" height="22" rx="4" fill="#334155" fill-opacity="0.3"/>
      <text x="230" y="211" fill="#cbd5e1" font-size="10" text-anchor="middle">
        💡 Order &amp; Customer data is repeated for each line item over JDBC
      </text>
    </g>

    <!-- Arrow to Hibernate Hydration -->
    <g transform="translate(740, 115)">
      <line x1="0" y1="0" x2="45" y2="0" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
      <text x="22" y="-10" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">HYDRATE</text>
    </g>

    <!-- Hibernate In-Memory Assembly (Right) -->
    <g transform="translate(800, 0)" filter="url(#cardShadow3)">
      <rect width="200" height="230" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="16" y="24" fill="#6ee7b7" font-size="13" font-weight="700">HIBERNATE 6/7</text>
      <text x="16" y="40" fill="#94a3b8" font-size="11">Deduplicates Root Entities</text>

      <g transform="translate(16, 55)">
        <rect width="168" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="12" y="21" fill="#f1f5f9" font-size="12" font-weight="600">Order #1 (Unique)</text>
        <text x="12" y="32" fill="#34d399" font-size="9">└── 3 lines populated</text>
      </g>

      <g transform="translate(16, 96)">
        <rect width="168" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="12" y="21" fill="#f1f5f9" font-size="12" font-weight="600">Order #2 (Unique)</text>
        <text x="12" y="32" fill="#34d399" font-size="9">└── 10 lines populated</text>
      </g>

      <text x="100" y="150" fill="#64748b" font-size="16" text-anchor="middle">• • •</text>

      <g transform="translate(16, 165)">
        <rect width="168" height="34" rx="6" fill="#064e3b" stroke="#10b981"/>
        <text x="84" y="16" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle">RESULT LIST</text>
        <text x="84" y="28" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">100 Order Objects</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM METRICS BAR -->
  <g transform="translate(50, 535)" filter="url(#cardShadow3)">
    <rect width="1000" height="75" rx="12" fill="#0f172a" stroke="#1e3a8a" stroke-width="1.5"/>
    
    <g transform="translate(30, 24)">
      <text x="0" y="18" fill="#f8fafc" font-size="15" font-weight="700">Fetch Join Efficiency Profile:</text>
      <text x="0" y="36" fill="#94a3b8" font-size="12">Reduced from 1,101 round-trips to exactly 1 query. Latency drops from 2,400ms to 28ms.</text>
    </g>

    <!-- Key Insights / Warnings -->
    <g transform="translate(580, 16)">
      <rect x="0" y="0" width="190" height="44" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="95" y="18" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">DISTINCT IN JPQL</text>
      <text x="95" y="34" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">No longer needed in 6+</text>

      <rect x="205" y="0" width="185" height="44" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="297" y="18" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">BAG RESTRICTION</text>
      <text x="297" y="34" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Max 1 List collection!</text>
    </g>
  </g>
</svg>
