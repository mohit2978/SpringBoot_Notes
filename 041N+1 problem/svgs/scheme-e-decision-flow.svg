<svg viewBox="0 0 1100 624" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<rect width="1100" height="624" fill="#f7f6ee"/>
<polygon points="960,0 1100,0 1100,140" fill="#e9e8d6"/>
<polygon points="1040,150 1100,210 1100,90" fill="#eeeddd"/>
<polygon points="0,556 60,624 0,624" fill="#e9e8d6"/>
<defs>
  <marker id="e" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#4a5c5e"/></marker>
  <g id="q"><rect x="0" y="0" width="42" height="42" rx="9" fill="#8f9350"/>
    <text x="21" y="30" fill="#fff" font-size="22" font-weight="bold" text-anchor="middle">?</text></g>
  <g id="link"><rect x="0" y="0" width="46" height="42" rx="9" fill="#8f9350"/>
    <path d="M15,21 a7,7 0 0,1 7,-7 l3,0" stroke="#eef0e2" stroke-width="3" fill="none"/>
    <path d="M31,21 a7,7 0 0,1 -7,7 l-3,0" stroke="#eef0e2" stroke-width="3" fill="none"/>
    <line x1="17" y1="21" x2="29" y2="21" stroke="#eef0e2" stroke-width="3"/></g>
</defs>

<g transform="translate(45,34)">
  <polygon points="0,13 13,0 28,7 28,28 13,37 0,30" fill="#3d4f52"/>
  <polygon points="13,0 28,7 28,28 13,21" fill="#8f9350"/>
  <text x="44" y="31" font-size="33" font-weight="bold" fill="#3d4f52">HIBER<tspan fill="#8f9350">NATE</tspan></text>
</g>

<rect x="46" y="100" width="386" height="66" rx="12" fill="#f1f1e5" stroke="#e0e0cd"/>
<use href="#q" x="64" y="112"/>
<text x="122" y="126" fill="#3d4f52" font-size="16" font-family="Consolas, monospace">Do you need entities at all —</text>
<text x="122" y="150" fill="#3d4f52" font-size="16" font-family="Consolas, monospace">will you modify them?</text>
<rect x="458" y="110" width="62" height="32" rx="9" fill="#8f9350"/>
<text x="489" y="132" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">No</text>
<line x1="432" y1="126" x2="456" y2="126" stroke="#4a5c5e" stroke-width="2"/>
<line x1="522" y1="126" x2="572" y2="126" stroke="#4a5c5e" stroke-width="2" marker-end="url(#e)"/>

<rect x="580" y="86" width="440" height="80" rx="12" fill="#eeeee2"/>
<g transform="translate(602,104)">
  <ellipse cx="20" cy="6" rx="20" ry="6" fill="#a8ab63"/>
  <path d="M0,6 L0,32 A20,6 0 0,0 40,32 L40,6 A20,6 0 0,1 0,6 Z" fill="#3d4f52"/>
  <ellipse cx="20" cy="17" rx="20" ry="5" fill="none" stroke="#eeeee2" stroke-width="2"/>
  <ellipse cx="20" cy="27" rx="20" ry="5" fill="none" stroke="#eeeee2" stroke-width="2"/>
</g>
<text x="658" y="115" fill="#3d4f52" font-size="17" font-weight="bold" font-family="Consolas, monospace">DTO projection</text>
<text x="658" y="138" fill="#4a5c5e" font-size="15" font-family="Consolas, monospace">(record / interface projection).</text>
<text x="658" y="158" fill="#3d4f52" font-size="15" font-weight="bold" font-family="Consolas, monospace">Done.</text>
<circle cx="982" cy="121" r="17" fill="#8f9350"/>
<path d="M974,121 l6,6 l11,-12" stroke="#fff" stroke-width="3" fill="none"/>

<rect x="222" y="178" width="70" height="32" rx="9" fill="#8f9350"/>
<text x="257" y="200" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">Yes</text>
<line x1="240" y1="166" x2="240" y2="176" stroke="#4a5c5e" stroke-width="2"/>
<line x1="257" y1="210" x2="257" y2="222" stroke="#4a5c5e" stroke-width="2" marker-end="url(#e)"/>

<rect x="96" y="222" width="322" height="60" rx="12" fill="#f1f1e5" stroke="#e0e0cd"/>
<use href="#q" x="112" y="231"/>
<text x="176" y="258" fill="#3d4f52" font-size="16" font-family="Consolas, monospace">Is the result paginated?</text>
<rect x="458" y="226" width="66" height="32" rx="9" fill="#8f9350"/>
<text x="491" y="248" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">Yes</text>
<line x1="418" y1="243" x2="456" y2="243" stroke="#4a5c5e" stroke-width="2"/>
<line x1="526" y1="243" x2="572" y2="243" stroke="#4a5c5e" stroke-width="2" marker-end="url(#e)"/>

<rect x="580" y="188" width="440" height="130" rx="12" fill="#f1f1e5"/>
<use href="#link" x="598" y="202"/>
<text x="658" y="218" fill="#3d4f52" font-size="16" font-family="Consolas, monospace">to-one:</text>
<text x="658" y="240" fill="#3d4f52" font-size="16" font-family="Consolas, monospace">fetch join / EntityGraph</text>
<g transform="translate(598,258)"><rect x="0" y="0" width="46" height="42" rx="9" fill="#8f9350"/>
  <rect x="10" y="10" width="26" height="6" rx="3" fill="#eef0e2"/>
  <rect x="10" y="19" width="26" height="6" rx="3" fill="#eef0e2"/>
  <rect x="10" y="28" width="26" height="6" rx="3" fill="#eef0e2"/></g>
<text x="658" y="272" fill="#3d4f52" font-size="16" font-family="Consolas, monospace">collections:</text>
<text x="658" y="292" fill="#3d4f52" font-size="16" font-family="Consolas, monospace">@BatchSize / default_batch_fetch_size</text>
<text x="658" y="311" fill="#4a5c5e" font-size="15" font-family="Consolas, monospace">(or fetch join, if you're on Hibernate 7.4+)</text>

<rect x="226" y="298" width="66" height="32" rx="9" fill="#36474a"/>
<text x="259" y="320" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">No</text>
<line x1="257" y1="282" x2="257" y2="296" stroke="#4a5c5e" stroke-width="2"/>
<line x1="259" y1="330" x2="259" y2="346" stroke="#4a5c5e" stroke-width="2" marker-end="url(#e)"/>

<rect x="96" y="350" width="308" height="76" rx="12" fill="#f1f1e5" stroke="#e0e0cd"/>
<use href="#q" x="112" y="367"/>
<text x="176" y="382" fill="#3d4f52" font-size="16" font-family="Consolas, monospace">How many collections</text>
<text x="176" y="404" fill="#3d4f52" font-size="16" font-family="Consolas, monospace">do you need?</text>

<path d="M404,376 L430,368" stroke="#4a5c5e" stroke-width="2"/>
<rect x="434" y="350" width="78" height="32" rx="9" fill="#8f9350"/>
<text x="473" y="372" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">0–1</text>
<line x1="514" y1="366" x2="572" y2="366" stroke="#4a5c5e" stroke-width="2" marker-end="url(#e)"/>
<rect x="580" y="340" width="440" height="60" rx="12" fill="#f1f1e5"/>
<use href="#link" x="598" y="348"/>
<text x="658" y="364" fill="#3d4f52" font-size="16" font-family="Consolas, monospace">join fetch or EntityGraph —</text>
<text x="658" y="384" fill="#3d4f52" font-size="16" font-family="Consolas, monospace">one SQL statement.</text>

<path d="M404,400 q22,0 26,18" stroke="#4a5c5e" stroke-width="2" fill="none"/>
<rect x="434" y="415" width="78" height="32" rx="9" fill="#36474a"/>
<text x="473" y="437" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">2+</text>
<line x1="514" y1="431" x2="572" y2="431" stroke="#4a5c5e" stroke-width="2" marker-end="url(#e)"/>
<rect x="580" y="408" width="440" height="88" rx="12" fill="#f1f1e5"/>
<use href="#link" x="598" y="418"/>
<text x="658" y="434" fill="#3d4f52" font-size="16" font-family="Consolas, monospace">fetch join the <tspan font-weight="bold">biggest</tspan>,</text>
<text x="658" y="454" fill="#3d4f52" font-size="16" font-family="Consolas, monospace">batch the rest.</text>
<text x="658" y="475" fill="#4a5c5e" font-size="15" font-family="Consolas, monospace">(never two List fetch joins →</text>
<text x="658" y="493" fill="#4a5c5e" font-size="15" font-family="Consolas, monospace">MultipleBagFetchException)</text>

<rect x="96" y="516" width="924" height="76" rx="12" fill="#eeeee2"/>
<g transform="translate(140,538)" fill="#8f9350">
<polygon points="18,0 36,9 18,18 0,9"/><polygon points="18,12 36,21 18,30 0,21" opacity="0.8"/>
</g>
<line x1="208" y1="528" x2="208" y2="578" stroke="#c4c8b4" stroke-width="2"/>
<text x="238" y="548" fill="#3d4f52" font-size="18" font-weight="bold">Always:</text>
<text x="340" y="548" fill="#3d4f52" font-size="17" font-family="Consolas, monospace">default_batch_fetch_size=50 as the safety net</text>
<text x="340" y="572" fill="#3d4f52" font-size="17" font-family="Consolas, monospace">+ one query-count assertion per list endpoint in CI.</text>
</svg>
