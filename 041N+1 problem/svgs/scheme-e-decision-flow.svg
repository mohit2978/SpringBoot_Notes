<svg viewBox="0 0 1100 680" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>

    <filter id="cardShadow6" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="flowArrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1100" height="680" rx="16" fill="url(#bgGrad6)"/>

  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="90" x2="1100" y2="90"/>
    <line x1="0" y1="210" x2="1100" y2="210"/>
    <line x1="0" y1="360" x2="1100" y2="360"/>
    <line x1="0" y1="585" x2="1100" y2="585"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(50, 25)">
    <rect x="0" y="0" width="185" height="24" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
    <text x="92" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">THE ARCHITECTURAL MATRIX</text>
    
    <text x="0" y="50" fill="#f8fafc" font-size="24" font-weight="800">
      Production Decision Flow: <tspan fill="#38bdf8">Choosing the Exact Right Strategy</tspan>
    </text>
  </g>

  <!-- ================= LEVEL 1: NEED ENTITIES OR READ-ONLY? ================= -->
  <g transform="translate(50, 95)">
    <!-- Decision Diamond / Card -->
    <g filter="url(#cardShadow6)">
      <rect width="380" height="75" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="16" y="14" width="26" height="26" rx="6" fill="#0284c7"/>
      <text x="29" y="32" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">Q1</text>
      <text x="52" y="26" fill="#f8fafc" font-size="13" font-weight="700">Are you modifying entities?</text>
      <text x="52" y="44" fill="#94a3b8" font-size="11">Read-only API vs Transactional write workflow</text>
    </g>

    <!-- Branch: NO -> DTO Projection (Right) -->
    <g transform="translate(380, 37)">
      <line x1="0" y1="0" x2="80" y2="0" stroke="#10b981" stroke-width="2.5" marker-end="url(#flowArrowGreen)"/>
      <rect x="18" y="-12" width="44" height="22" rx="4" fill="#065f46"/>
      <text x="40" y="3" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle">NO</text>
    </g>

    <!-- Destination Box 1: DTO Projection -->
    <g transform="translate(470, 0)" filter="url(#cardShadow6)">
      <rect width="580" height="75" rx="10" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1.5"/>
      <rect x="16" y="14" width="28" height="28" rx="6" fill="#059669"/>
      <text x="30" y="33" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">✓</text>
      
      <text x="54" y="28" fill="#34d399" font-size="14" font-weight="700">USE DTO CONSTRUCTOR PROJECTIONS (Java Records)</text>
      <text x="54" y="46" fill="#cbd5e1" font-size="11">
        <tspan fill="#f1f5f9" font-family="Consolas, monospace">SELECT new com.acme.OrderSummary(o.id, c.name, count(l)) ...</tspan>
      </text>
      <text x="54" y="62" fill="#a7f3d0" font-size="10" font-weight="600">
        ⚡ Zero entity overhead • No dirty checking • Instant single-query execution
      </text>
    </g>
  </g>

  <!-- Flow Line down from Q1 to Q2 (YES) -->
  <g transform="translate(240, 170)">
    <line x1="0" y1="0" x2="0" y2="48" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flowArrow)"/>
    <rect x="-18" y="12" width="36" height="22" rx="4" fill="#0369a1"/>
    <text x="0" y="27" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">YES</text>
  </g>

  <!-- ================= LEVEL 2: PAGINATED OR NOT? ================= -->
  <g transform="translate(50, 225)">
    <!-- Decision Card Q2 -->
    <g filter="url(#cardShadow6)">
      <rect width="380" height="75" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="16" y="14" width="26" height="26" rx="6" fill="#0284c7"/>
      <text x="29" y="32" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">Q2</text>
      <text x="52" y="26" fill="#f8fafc" font-size="13" font-weight="700">Is the result set paginated?</text>
      <text x="52" y="44" fill="#94a3b8" font-size="11">Pageable / setFirstResult / setMaxResults involved</text>
    </g>

    <!-- Branch: YES -> Paginated Strategy (Right) -->
    <g transform="translate(380, 37)">
      <line x1="0" y1="0" x2="80" y2="0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flowArrow)"/>
      <rect x="18" y="-12" width="44" height="22" rx="4" fill="#0369a1"/>
      <text x="40" y="3" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">YES</text>
    </g>

    <!-- Destination Box 2: Pagination Rules -->
    <g transform="translate(470, 0)" filter="url(#cardShadow6)">
      <rect width="580" height="90" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="18" y="22" fill="#38bdf8" font-size="13" font-weight="700">PAGINATION STRATEGY</text>
      
      <!-- To-one -->
      <text x="18" y="42" fill="#cbd5e1" font-size="11">
        • <tspan font-weight="700" fill="#f8fafc">To-One Associations:</tspan> Always safe to use <tspan fill="#38bdf8">JOIN FETCH</tspan> or <tspan fill="#c084fc">EntityGraph</tspan>.
      </text>

      <!-- Collections -->
      <text x="18" y="60" fill="#cbd5e1" font-size="11">
        • <tspan font-weight="700" fill="#f8fafc">Collections (Hibernate 7.4+):</tspan> <tspan fill="#34d399">JOIN FETCH is safe</tspan> (uses subquery limit in SQL).
      </text>
      <text x="18" y="78" fill="#f59e0b" font-size="11">
        • <tspan font-weight="700">Collections (Hibernate ≤ 7.3):</tspan> Use <tspan font-weight="700">@BatchSize(50)</tspan> (avoids in-memory pagination warning HHH90003004).
      </text>
    </g>
  </g>

  <!-- Flow Line down from Q2 to Q3 (NO) -->
  <g transform="translate(240, 300)">
    <line x1="0" y1="0" x2="0" y2="48" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flowArrow)"/>
    <rect x="-18" y="12" width="36" height="22" rx="4" fill="#0369a1"/>
    <text x="0" y="27" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">NO</text>
  </g>

  <!-- ================= LEVEL 3: HOW MANY COLLECTIONS? ================= -->
  <g transform="translate(50, 355)">
    <!-- Decision Card Q3 -->
    <g filter="url(#cardShadow6)">
      <rect width="380" height="75" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="16" y="14" width="26" height="26" rx="6" fill="#0284c7"/>
      <text x="29" y="32" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">Q3</text>
      <text x="52" y="26" fill="#f8fafc" font-size="13" font-weight="700">How many collections to fetch?</text>
      <text x="52" y="44" fill="#94a3b8" font-size="11">Counting @OneToMany or @ManyToMany associations</text>
    </g>

    <!-- Branch: 0 to 1 Collection (Right Top) -->
    <g transform="translate(380, 20)">
      <line x1="0" y1="0" x2="80" y2="0" stroke="#38bdf8" stroke-width="2" marker-end="url(#flowArrow)"/>
      <rect x="12" y="-12" width="55" height="22" rx="4" fill="#0f766e"/>
      <text x="39" y="3" fill="#a7f3d0" font-size="10" font-weight="700" text-anchor="middle">0 OR 1</text>
    </g>

    <g transform="translate(470, -5)" filter="url(#cardShadow6)">
      <rect width="580" height="60" rx="8" fill="#111827" stroke="#059669" stroke-width="1.5"/>
      <text x="18" y="24" fill="#34d399" font-size="13" font-weight="700">USE JOIN FETCH OR ENTITYGRAPH</text>
      <text x="18" y="44" fill="#cbd5e1" font-size="11">
        Fetches everything in 1 clean SQL statement with zero Cartesian complications.
      </text>
    </g>

    <!-- Branch: 2+ Collections (Right Bottom) -->
    <g transform="translate(380, 75)">
      <line x1="0" y1="0" x2="80" y2="0" stroke="#f59e0b" stroke-width="2" marker-end="url(#flowArrow)"/>
      <rect x="12" y="-12" width="55" height="22" rx="4" fill="#78350f"/>
      <text x="39" y="3" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">2 OR MORE</text>
    </g>

    <g transform="translate(470, 68)" filter="url(#cardShadow6)">
      <rect width="580" height="75" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="18" y="24" fill="#fbbf24" font-size="13" font-weight="700">HYBRID: JOIN FETCH BIGGEST + BATCH THE REST</text>
      <text x="18" y="44" fill="#cbd5e1" font-size="11">
        Join fetch the primary collection; use <tspan font-family="Consolas, monospace" fill="#fbbf24">@BatchSize(50)</tspan> for secondary collections.
      </text>
      <text x="18" y="62" fill="#ef4444" font-size="10" font-weight="600">
        ⚠️ Never join fetch 2 List collections in one query → MultipleBagFetchException!
      </text>
    </g>
  </g>

  <!-- ================= UNIVERSAL SAFETY NET FOOTER ================= -->
  <g transform="translate(50, 575)" filter="url(#cardShadow6)">
    <rect width="1000" height="75" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#0284c7"/>
    <text x="34" y="40" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle">★</text>
    
    <g transform="translate(64, 20)">
      <text x="0" y="16" fill="#f8fafc" font-size="15" font-weight="800">
        THE 2 NON-NEGOTIABLE PRODUCTION SAFEGUARDS:
      </text>
      <text x="0" y="36" fill="#94a3b8" font-size="12">
        1. Set <tspan fill="#38bdf8" font-family="Consolas, monospace">spring.jpa.properties.hibernate.default_batch_fetch_size: 50</tspan> globally in application.yml.
      </text>
      <text x="560" y="36" fill="#94a3b8" font-size="12">
        2. Assert query counts in CI using <tspan fill="#34d399">Hibernate Statistics</tspan> or <tspan fill="#34d399">QuickPerf</tspan>.
      </text>
    </g>
  </g>
</svg>
