<svg viewBox="0 0 1100 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1021"/>
      <stop offset="50%" stop-color="#171e38"/>
      <stop offset="100%" stop-color="#070914"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <filter id="cardShadow4" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1100" height="640" rx="16" fill="url(#bgGrad4)"/>

  <!-- Subtle grid -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="120" x2="1100" y2="120"/>
    <line x1="0" y1="210" x2="1100" y2="210"/>
    <line x1="0" y1="535" x2="1100" y2="535"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(50, 32)">
    <rect x="0" y="0" width="175" height="24" rx="6" fill="#6b21a8" fill-opacity="0.3" stroke="#9333ea" stroke-width="1"/>
    <text x="87" y="16" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">FIX 2: ENTITYGRAPH</text>
    
    <text x="0" y="52" fill="#f8fafc" font-size="26" font-weight="800">
      Declarative Fetch Plans: <tspan fill="#c084fc">Decoupling Queries from Associations</tspan>
    </text>
    <text x="0" y="74" fill="#94a3b8" font-size="13">
      Write the query once in your repository. Attach dynamic EntityGraphs to control exactly what associations to join per endpoint.
    </text>
  </g>

  <!-- Central Root Query Card -->
  <g transform="translate(300, 115)" filter="url(#cardShadow4)">
    <rect width="500" height="64" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    
    <!-- Code Icon -->
    <rect x="18" y="16" width="32" height="32" rx="6" fill="#312e81"/>
    <text x="34" y="36" fill="#818cf8" font-size="15" font-family="Consolas, monospace" font-weight="800" text-anchor="middle">&lt;/&gt;</text>

    <!-- Query Info -->
    <text x="64" y="30" fill="#94a3b8" font-size="11" font-weight="700">SINGLE CORE REPOSITORY METHOD</text>
    <text x="64" y="48" fill="#f1f5f9" font-size="14" font-family="Consolas, monospace" font-weight="700">
      List&lt;Order&gt; findByCreatedAtAfter(Instant since)
    </text>
  </g>

  <!-- Connector Lines Branching Out -->
  <g stroke="#9333ea" stroke-width="2" fill="none">
    <!-- Left Branch -->
    <path d="M400,179 L400,205 L200,205 L200,225" marker-end="url(#arrowPurple)"/>
    <!-- Center Branch -->
    <path d="M550,179 L550,225" marker-end="url(#arrowPurple)"/>
    <!-- Right Branch -->
    <path d="M700,179 L700,205 L900,205 L900,225" marker-end="url(#arrowPurple)"/>
  </g>

  <!-- 3 DISTINCT FETCH PLAN PANELS -->
  <g transform="translate(50, 235)">
    <!-- ================= PANEL 1: Summary ================= -->
    <g transform="translate(0, 0)" filter="url(#cardShadow4)">
      <rect width="310" height="280" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
      
      <!-- Panel Header -->
      <rect x="16" y="16" width="90" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="61" y="31" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">GRAPH 1</text>
      <text x="115" y="32" fill="#f8fafc" font-size="15" font-weight="700">"summary"</text>

      <!-- Attribute Path Box -->
      <g transform="translate(16, 48)">
        <rect width="278" height="34" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="12" y="22" fill="#38bdf8" font-family="Consolas, monospace" font-size="12">
          attributePaths = {"customer"}
        </text>
      </g>

      <!-- Visual Hierarchy Diagram -->
      <g transform="translate(16, 95)">
        <!-- Root: Order -->
        <rect x="10" y="10" width="105" height="32" rx="6" fill="#1e293b" stroke="#0284c7"/>
        <text x="62" y="31" fill="#e0f2fe" font-size="12" font-weight="700" text-anchor="middle">Order</text>

        <!-- Line -->
        <line x1="115" y1="26" x2="160" y2="26" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>

        <!-- Target: Customer -->
        <rect x="160" y="10" width="105" height="32" rx="6" fill="#0c4a6e" stroke="#38bdf8"/>
        <text x="212" y="31" fill="#e0f2fe" font-size="12" font-weight="700" text-anchor="middle">Customer</text>

        <!-- Lazy lines indicator -->
        <text x="62" y="65" fill="#64748b" font-size="11" text-anchor="middle">lines: [Lazy Proxy]</text>
      </g>

      <!-- SQL Execution Outcome -->
      <g transform="translate(16, 185)">
        <rect width="278" height="75" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
        <text x="14" y="24" fill="#38bdf8" font-size="13" font-weight="700">1 SQL Query • 1 JOIN</text>
        <text x="14" y="44" fill="#cbd5e1" font-size="11">FROM orders o LEFT JOIN customer c</text>
        <text x="14" y="62" fill="#94a3b8" font-size="10">Use Case: Minimal customer order lists</text>
      </g>
    </g>

    <!-- ================= PANEL 2: With Lines ================= -->
    <g transform="translate(345, 0)" filter="url(#cardShadow4)">
      <rect width="310" height="280" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
      
      <!-- Panel Header -->
      <rect x="16" y="16" width="90" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="61" y="31" fill="#a78bfa" font-size="10" font-weight="700" text-anchor="middle">GRAPH 2</text>
      <text x="115" y="32" fill="#f8fafc" font-size="15" font-weight="700">"with-lines"</text>

      <!-- Attribute Path Box -->
      <g transform="translate(16, 48)">
        <rect width="278" height="34" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="12" y="22" fill="#a78bfa" font-family="Consolas, monospace" font-size="11">
          paths = {"customer", "lines"}
        </text>
      </g>

      <!-- Visual Hierarchy Diagram -->
      <g transform="translate(16, 95)">
        <rect x="10" y="10" width="80" height="32" rx="6" fill="#1e293b" stroke="#6366f1"/>
        <text x="50" y="31" fill="#e0e7ff" font-size="11" font-weight="700" text-anchor="middle">Order</text>

        <line x1="90" y1="20" x2="130" y2="12" stroke="#6366f1" stroke-width="1.5"/>
        <rect x="130" y="0" width="75" height="24" rx="4" fill="#312e81" stroke="#818cf8"/>
        <text x="167" y="16" fill="#c7d2fe" font-size="10" font-weight="600" text-anchor="middle">Customer</text>

        <line x1="90" y1="30" x2="130" y2="40" stroke="#6366f1" stroke-width="1.5"/>
        <rect x="130" y="28" width="75" height="24" rx="4" fill="#312e81" stroke="#818cf8"/>
        <text x="167" y="44" fill="#c7d2fe" font-size="10" font-weight="600" text-anchor="middle">Lines</text>

        <text x="167" y="70" fill="#64748b" font-size="10" text-anchor="middle">products: [Lazy]</text>
      </g>

      <!-- SQL Execution Outcome -->
      <g transform="translate(16, 185)">
        <rect width="278" height="75" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
        <text x="14" y="24" fill="#a78bfa" font-size="13" font-weight="700">1 SQL Query • 2 JOINS</text>
        <text x="14" y="44" fill="#cbd5e1" font-size="11">JOINS customer + order_line</text>
        <text x="14" y="62" fill="#94a3b8" font-size="10">Use Case: Order calculations &amp; totals</text>
      </g>
    </g>

    <!-- ================= PANEL 3: Full Nested Graph ================= -->
    <g transform="translate(690, 0)" filter="url(#cardShadow4)">
      <rect width="310" height="280" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
      
      <!-- Panel Header -->
      <rect x="16" y="16" width="90" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="61" y="31" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">GRAPH 3</text>
      <text x="115" y="32" fill="#f8fafc" font-size="15" font-weight="700">"full-audit"</text>

      <!-- Attribute Path Box -->
      <g transform="translate(16, 48)">
        <rect width="278" height="34" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="12" y="22" fill="#34d399" font-family="Consolas, monospace" font-size="10">
          paths = {"customer", "lines.product"}
        </text>
      </g>

      <!-- Visual Hierarchy Diagram -->
      <g transform="translate(16, 95)">
        <rect x="5" y="16" width="70" height="28" rx="5" fill="#1e293b" stroke="#059669"/>
        <text x="40" y="34" fill="#d1fae5" font-size="10" font-weight="700" text-anchor="middle">Order</text>

        <line x1="75" y1="22" x2="105" y2="12" stroke="#10b981" stroke-width="1.5"/>
        <rect x="105" y="2" width="75" height="20" rx="4" fill="#064e3b" stroke="#34d399"/>
        <text x="142" y="16" fill="#a7f3d0" font-size="9" text-anchor="middle">Customer</text>

        <line x1="75" y1="36" x2="105" y2="44" stroke="#10b981" stroke-width="1.5"/>
        <rect x="105" y="34" width="75" height="20" rx="4" fill="#064e3b" stroke="#34d399"/>
        <text x="142" y="48" fill="#a7f3d0" font-size="9" text-anchor="middle">Lines</text>

        <line x1="180" y1="44" x2="205" y2="44" stroke="#10b981" stroke-width="1.5"/>
        <rect x="205" y="34" width="70" height="20" rx="4" fill="#065f46" stroke="#6ee7b7"/>
        <text x="240" y="48" fill="#ecfdf5" font-size="9" font-weight="700" text-anchor="middle">Product</text>
      </g>

      <!-- SQL Execution Outcome -->
      <g transform="translate(16, 185)">
        <rect width="278" height="75" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1"/>
        <text x="14" y="24" fill="#34d399" font-size="13" font-weight="700">1 SQL Query • 3+ JOINS</text>
        <text x="14" y="44" fill="#cbd5e1" font-size="11">JOINS customer + lines + product</text>
        <text x="14" y="62" fill="#94a3b8" font-size="10">Use Case: Invoice generation &amp; exports</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM TAKEAWAY BANNER -->
  <g transform="translate(50, 545)" filter="url(#cardShadow4)">
    <rect width="1000" height="65" rx="12" fill="#1e1e2e" stroke="#a855f7" stroke-width="1.5"/>
    <g transform="translate(30, 20)">
      <text x="0" y="16" fill="#f8fafc" font-size="15" font-weight="700">Architectural Advantage:</text>
      <text x="0" y="34" fill="#c084fc" font-size="12">
        One repository query definition serves multiple endpoints. Hibernate internally executes SQL joins for every path in the graph.
      </text>
    </g>
    <g transform="translate(730, 16)">
      <rect width="240" height="34" rx="6" fill="#3b0764" stroke="#c084fc" stroke-width="1"/>
      <text x="120" y="22" fill="#e9d5ff" font-size="12" font-weight="700" text-anchor="middle">
        ZERO DUPLICATED JPQL
      </text>
    </g>
  </g>
</svg>
