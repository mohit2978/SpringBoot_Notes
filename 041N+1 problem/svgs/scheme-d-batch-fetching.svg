<svg viewBox="0 0 1100 650" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d141e"/>
      <stop offset="50%" stop-color="#111c2e"/>
      <stop offset="100%" stop-color="#06090f"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="cardShadow5" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1100" height="650" rx="16" fill="url(#bgGrad5)"/>

  <!-- Subtle grid -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="120" x2="1100" y2="120"/>
    <line x1="0" y1="230" x2="1100" y2="230"/>
    <line x1="0" y1="360" x2="1100" y2="360"/>
    <line x1="0" y1="490" x2="1100" y2="490"/>
    <line x1="0" y1="560" x2="1100" y2="560"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(50, 32)">
    <rect x="0" y="0" width="230" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#059669" stroke-width="1"/>
    <text x="115" y="16" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">FIX 3: BATCH FETCHING (SIZE 50)</text>
    
    <text x="0" y="52" fill="#f8fafc" font-size="26" font-weight="800">
      The Global Safety Net: <tspan fill="#34d399">Collapsing 401 Queries into Just 9</tspan>
    </text>
    <text x="0" y="74" fill="#94a3b8" font-size="13">
      Keep associations lazy. When one proxy is accessed, Hibernate gathers up to 50 uninitialized IDs in the Session and fetches them together.
    </text>
  </g>

  <!-- CONFIG CALLOUT PILL (Top Right) -->
  <g transform="translate(680, 42)">
    <rect width="370" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="18" fill="#94a3b8" font-size="10" font-weight="700">GLOBAL APPLICATION.YML CONFIGURATION</text>
    <text x="14" y="34" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">
      spring.jpa.properties.hibernate.default_batch_fetch_size: 50
    </text>
  </g>

  <!-- ================= TIMELINE OF 9 BATCHED STATEMENTS ================= -->
  <g transform="translate(50, 120)">
    
    <!-- STEP 1: Root Orders (1 Query) -->
    <g transform="translate(0, 0)" filter="url(#cardShadow5)">
      <rect width="1000" height="85" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="18" y="14" width="28" height="28" rx="6" fill="#0284c7"/>
      <text x="32" y="33" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">1</text>
      
      <text x="56" y="26" fill="#38bdf8" font-size="13" font-weight="700">ROOT QUERY: 100 ORDERS</text>
      <text x="56" y="40" fill="#94a3b8" font-size="11">Initial find query executed by service or controller</text>

      <rect x="56" y="48" width="680" height="26" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="70" y="66" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">
        SELECT o1_0.id, o1_0.created_at, o1_0.customer_id FROM orders o1_0 LIMIT 100;
      </text>

      <!-- Right Result Badge -->
      <g transform="translate(760, 20)">
        <rect width="220" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
        <text x="110" y="20" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1 Statement Executed</text>
        <text x="110" y="36" fill="#94a3b8" font-size="10" text-anchor="middle">100 Orders loaded into Session</text>
      </g>
    </g>

    <!-- STEP 2: Batched Collections (2 Queries) -->
    <g transform="translate(0, 100)" filter="url(#cardShadow5)">
      <rect width="1000" height="110" rx="10" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
      <rect x="18" y="16" width="38" height="28" rx="6" fill="#059669"/>
      <text x="37" y="35" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">2-3</text>

      <text x="66" y="26" fill="#34d399" font-size="13" font-weight="700">BATCHED COLLECTION FETCH: ORDER LINES (PersistentBag)</text>
      <text x="66" y="40" fill="#94a3b8" font-size="11">First order.getLines() triggers batch lookup for all 100 order IDs split into chunks of 50</text>

      <!-- Query 2 -->
      <rect x="66" y="48" width="670" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="80" y="65" fill="#a7f3d0" font-family="Consolas, monospace" font-size="11">
        Q2: SELECT * FROM order_line WHERE order_id IN (1, 2, 3 ... 50);
      </text>

      <!-- Query 3 -->
      <rect x="66" y="76" width="670" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="80" y="93" fill="#a7f3d0" font-family="Consolas, monospace" font-size="11">
        Q3: SELECT * FROM order_line WHERE order_id IN (51, 52, 53 ... 100);
      </text>

      <!-- Right Result Badge -->
      <g transform="translate(760, 30)">
        <rect width="220" height="52" rx="6" fill="#064e3b" stroke="#10b981"/>
        <text x="110" y="22" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle">2 Statements (was 100!)</text>
        <text x="110" y="38" fill="#ffffff" font-size="10" text-anchor="middle">All 1,000 order lines loaded</text>
      </g>
    </g>

    <!-- STEP 3: Batched Entity Proxies (4 Queries for Products + 2 for Customers) -->
    <g transform="translate(0, 225)" filter="url(#cardShadow5)">
      <rect width="1000" height="125" rx="10" fill="#111827" stroke="#a78bfa" stroke-width="1.5"/>
      <rect x="18" y="16" width="38" height="28" rx="6" fill="#7c3aed"/>
      <text x="37" y="35" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">4-9</text>

      <text x="66" y="26" fill="#c084fc" font-size="13" font-weight="700">BATCHED ENTITY PROXIES: PRODUCTS (4 QUERIES) &amp; CUSTOMERS (2 QUERIES)</text>
      <text x="66" y="40" fill="#94a3b8" font-size="11">Hibernate identifies ~200 distinct product proxy IDs and 100 customer IDs, querying each in batches of 50</text>

      <!-- Product Queries -->
      <rect x="66" y="48" width="670" height="30" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="80" y="68" fill="#e9d5ff" font-family="Consolas, monospace" font-size="11">
        Q4..Q7: SELECT * FROM product WHERE id IN (...50 product IDs...);  [4 queries for 200 IDs]
      </text>

      <!-- Customer Queries -->
      <rect x="66" y="82" width="670" height="30" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="80" y="102" fill="#e9d5ff" font-family="Consolas, monospace" font-size="11">
        Q8..Q9: SELECT * FROM customer WHERE id IN (...50 customer IDs...); [2 queries for 100 IDs]
      </text>

      <!-- Right Result Badge -->
      <g transform="translate(760, 36)">
        <rect width="220" height="52" rx="6" fill="#3b0764" stroke="#a855f7"/>
        <text x="110" y="22" fill="#e9d5ff" font-size="11" font-weight="700" text-anchor="middle">6 Statements (was 300!)</text>
        <text x="110" y="38" fill="#ffffff" font-size="10" text-anchor="middle">All to-one proxies resolved</text>
      </g>
    </g>

    <!-- POSTGRESQL DIALECT OPTIMIZATION CALLOUT -->
    <g transform="translate(0, 365)" filter="url(#cardShadow5)">
      <rect width="1000" height="60" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>
      <text x="24" y="25" fill="#38bdf8" font-size="12" font-weight="700">💡 POSTGRESQL DIALECT ARRAY OPTIMIZATION (= ANY (?)):</text>
      <text x="24" y="44" fill="#94a3b8" font-size="11">
        Postgres sends the entire ID batch as a single array parameter: <tspan fill="#f1f5f9" font-family="Consolas, monospace">WHERE id = ANY(?)</tspan>. Keeps JDBC prepared statement cache hot and eliminates query plan recompilation!
      </text>
    </g>
  </g>

  <!-- ================= BOTTOM SCOREBOARD BANNER ================= -->
  <g transform="translate(50, 565)" filter="url(#cardShadow5)">
    <rect width="1000" height="60" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <g transform="translate(25, 20)">
      <text x="0" y="14" fill="#ffffff" font-size="15" font-weight="800">
        FINAL STATEMENT SCOREBOARD:
      </text>
      <text x="250" y="14" fill="#a7f3d0" font-size="13" font-weight="600">
        1 (orders) + 2 (lines) + 4 (products) + 2 (customers) = <tspan fill="#ffffff" font-weight="800">EXACTLY 9 QUERIES</tspan> (vs 401 unbatched)
      </text>
    </g>
    <g transform="translate(850, 14)">
      <rect width="130" height="32" rx="6" fill="#047857" stroke="#34d399" stroke-width="1"/>
      <text x="65" y="21" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">
        97.8% QUERY DROP
      </text>
    </g>
  </g>
</svg>
