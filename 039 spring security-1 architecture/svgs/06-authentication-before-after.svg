  <text x="610.0" y="150.0" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" font-weight="bold" xml:space="preserve">UsernamePasswordAuthenticationToken</text>
  <text x="610.0" y="182.0" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14" fill="#1e1e1e" text-anchor="start" font-weight="normal" xml:space="preserve">principal     = UserDetails(mohit)</text>
