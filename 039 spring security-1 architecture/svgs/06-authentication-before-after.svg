  <text x="500.0" y="386.7" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">principal = WHO you are · credentials = HOW you prove it · authorities = WHAT you can do</text>
  <text x="500.0" y="404.9" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">authenticated = HAVE you been verified? · details = EXTRA info (IP, session id)</text>
  <text x="500.0" y="423.1" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">Usually a NEW, richer object is returned, not the same instance with a flag flipped.</text>
</svg>
