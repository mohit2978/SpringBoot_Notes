  <text x="500.0" y="497.4" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">Version conflict? &quot;nearest declaration wins&quot;. Fix it with &lt;dependencyManagement&gt; or &lt;exclusions&gt;.</text>
