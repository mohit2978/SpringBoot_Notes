<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#1e1e2e" rx="12"/>

  <!-- Title -->
  <text x="20" y="30" font-family="sans-serif" font-size="15" fill="#cdd6f4" font-weight="bold">2. Get: During Get, JPA will check if data is present in cache?</text>
  <text x="20" y="50" font-family="sans-serif" font-size="14" fill="#cdd6f4">If Yes, cache hit and return, else cache miss → fetch from DB and put into Cache.</text>

  <!-- First GET - cache miss -->
  <rect x="20" y="65" width="380" height="140" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <rect x="32" y="78" width="45" height="22" rx="4" fill="#d0e8ff"/>
  <text x="55" y="93" text-anchor="middle" font-family="monospace" font-size="12" fill="#0066cc" font-weight="bold">GET</text>
  <text x="85" y="93" font-family="monospace" font-size="11" fill="#333"> localhost:8080/api/user/1</text>
  <text x="32" y="120" font-family="sans-serif" font-size="11" fill="#f38ba8" font-style="italic" font-weight="bold">This is first Get call,</text>
  <text x="32" y="138" font-family="sans-serif" font-size="11" fill="#f38ba8" font-style="italic" font-weight="bold">so cache Miss will happen and</text>
  <text x="32" y="156" font-family="sans-serif" font-size="11" fill="#f38ba8" font-style="italic" font-weight="bold">DB call will be made</text>
  <text x="32" y="190" font-family="monospace" font-size="11" fill="#333">{ "id": 1, "name": "sj", "email": "xyz@conceptandcoding.com" }</text>

  <!-- Second GET - cache hit -->
  <rect x="430" y="65" width="380" height="140" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <rect x="442" y="78" width="45" height="22" rx="4" fill="#d0e8ff"/>
  <text x="465" y="93" text-anchor="middle" font-family="monospace" font-size="12" fill="#0066cc" font-weight="bold">GET</text>
  <text x="495" y="93" font-family="monospace" font-size="11" fill="#333"> localhost:8080/api/user/1</text>
  <text x="442" y="120" font-family="sans-serif" font-size="11" fill="#a6e3a1" font-style="italic" font-weight="bold">This is Second Get call,</text>
  <text x="442" y="138" font-family="sans-serif" font-size="11" fill="#a6e3a1" font-style="italic" font-weight="bold">so cache hit will happen and</text>
  <text x="442" y="156" font-family="sans-serif" font-size="11" fill="#a6e3a1" font-style="italic" font-weight="bold">No DB call will be made</text>
  <text x="442" y="190" font-family="monospace" font-size="11" fill="#333">{ "id": 1, "name": "sj", "email": "xyz@conceptandcoding.com" }</text>

  <!-- Console log section -->
  <rect x="20" y="220" width="860" height="150" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="35" y="242" font-family="monospace" font-size="10" fill="#8b949e">Hibernate: insert into user_details (email, name, id) values (?, ?, default)</text>
  <text x="35" y="260" font-family="monospace" font-size="10" fill="#8b949e">DEBUG ... AbstractReadWriteAccess : Getting cached data from region ['userDetailsCache']</text>
  <text x="35" y="278" font-family="monospace" font-size="10" fill="#e3b341">DEBUG ... AbstractReadWriteAccess : Cache miss : region = 'userDetailsCache'</text>
  <text x="35" y="296" font-family="monospace" font-size="10" fill="#8b949e">Hibernate: select ud1_0.id, ud1_0.email, ud1_0.name from user_details ud1_0 where ud1_0.id=?</text>
  <text x="35" y="314" font-family="monospace" font-size="10" fill="#8b949e">DEBUG ... AbstractReadWriteAccess : Caching data from load [region='userDetailsCache']</text>
  <text x="35" y="332" font-family="monospace" font-size="10" fill="#8b949e">DEBUG ... AbstractReadWriteAccess : Getting cached data from region ['userDetailsCache']</text>
  <text x="35" y="350" font-family="monospace" font-size="10" fill="#a6e3a1">DEBUG ... AbstractReadWriteAccess : Cache hit : region = 'userDetailsCache'</text>

  <text x="20" y="393" font-family="sans-serif" font-size="13" fill="#cdd6f4">See 2nd get Call → new entity manager → new L1 cache but L2 cache hit → no DB call is made!!</text>
</svg>
