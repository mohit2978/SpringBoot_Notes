<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="570" viewBox="0 0 1050 570">
  <defs>
    <marker id="arr19-white" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#cdd6f4"/>
    </marker>
    <marker id="arr19-green" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#a6e3a1"/>
    </marker>
    <marker id="arr19-blue" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#89b4fa"/>
    </marker>
    <marker id="arr19-yellow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#f9e2af"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1050" height="570" fill="#1e1e2e" rx="14"/>

  <!-- ==================== HEADER: LOCKING PRINCIPLES ==================== -->
  <rect x="30" y="20" width="990" height="126" rx="10" fill="#181825" stroke="#313244" stroke-width="1.5"/>

  <!-- Title Pill -->
  <rect x="48" y="30" width="165" height="22" rx="4" fill="#1c2d25"/>
  <text x="130" y="45" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#a6e3a1">STRATEGY 2 OF 4</text>
  <text x="225" y="47" font-family="sans-serif" font-size="16" font-weight="bold" fill="#cdd6f4">2. READ_WRITE Strategy (Strict Locking)</text>

  <!-- Card 1: Read Locking -->
  <rect x="48" y="62" width="465" height="70" rx="6" fill="#11111b" stroke="#89b4fa" stroke-width="1.2"/>
  <rect x="58" y="70" width="180" height="18" rx="3" fill="#1e2238"/>
  <text x="148" y="83" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#89b4fa">DURING READ: SHARED LOCK</text>
  <text x="58" y="105" font-family="sans-serif" font-size="11" fill="#cdd6f4">• Puts a Shared Lock on the cache item.</text>
  <text x="58" y="122" font-family="sans-serif" font-size="11" fill="#a6adc8">• Other parallel reads can acquire shared locks. Write operations blocked.</text>

  <!-- Card 2: Update Locking -->
  <rect x="537" y="62" width="465" height="70" rx="6" fill="#11111b" stroke="#f38ba8" stroke-width="1.2"/>
  <rect x="547" y="70" width="200" height="18" rx="3" fill="#31202e"/>
  <text x="647" y="83" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f38ba8">DURING UPDATE: EXCLUSIVE LOCK</text>
  <text x="547" y="105" font-family="sans-serif" font-size="11" fill="#cdd6f4">• Puts an Exclusive Soft-Lock on the cache item.</text>
  <text x="547" y="122" font-family="sans-serif" font-size="11" fill="#a6adc8">• Both concurrent reads and writes are blocked until commit completes.</text>


  <!-- ==================== FLOW DIAGRAM ==================== -->
  <rect x="30" y="158" width="990" height="235" rx="10" fill="#181825" stroke="#313244" stroke-width="1.5"/>

  <!-- Diagram Window Bar -->
  <path d="M 30 166 A 8 8 0 0 1 38 158 L 1012 158 A 8 8 0 0 1 1020 166 L 1020 188 L 30 188 Z" fill="#11111b"/>
  <circle cx="48" cy="173" r="4.5" fill="#f38ba8"/>
  <circle cx="62" cy="173" r="4.5" fill="#f9e2af"/>
  <circle cx="76" cy="173" r="4.5" fill="#a6e3a1"/>
  <text x="94" y="177" font-family="monospace" font-size="11" fill="#cdd6f4">Data Flow: Insert vs Get (L2 Cache Interaction)</text>

  <!-- 1. INSERT FLOW -->
  <!-- Client Box -->
  <rect x="50" y="202" width="160" height="42" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="130" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">Client: Insert</text>
  <text x="130" y="236" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6e3a1">POST /api/user</text>

  <!-- Arrow Insert to DB -->
  <line x1="210" y1="223" x2="815" y2="223" stroke="#cdd6f4" stroke-width="2" marker-end="url(#arr19-white)"/>
  <rect x="420" y="210" width="280" height="24" rx="4" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="560" y="226" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#bac2de">Directly written to DB (L2 Cache bypassed)</text>

  <!-- DB Box (Top) -->
  <rect x="825" y="202" width="165" height="42" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="907" y="222" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#cdd6f4">Database (DB)</text>
  <text x="907" y="236" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#a6e3a1">Record Inserted</text>


  <!-- 2. GET FLOW -->
  <!-- Client Box (Get) -->
  <rect x="50" y="278" width="160" height="88" rx="6" fill="#11111b" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="130" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">Client: Read</text>
  <text x="130" y="324" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#89b4fa">GET /api/user/1</text>
  <text x="130" y="352" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#a6adc8">Checks L2 first</text>

  <!-- Upper line: Get -> Cache -->
  <line x1="210" y1="305" x2="385" y2="305" stroke="#89b4fa" stroke-width="1.8" marker-end="url(#arr19-blue)"/>
  <text x="295" y="297" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#89b4fa">Check Cache</text>

  <!-- Lower line: Cache -> Get (Cache Hit) -->
  <line x1="395" y1="340" x2="220" y2="340" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arr19-green)"/>
  <text x="305" y="356" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#a6e3a1">◀ Cache Hit (Return)</text>

  <!-- Cache Box -->
  <rect x="395" y="274" width="220" height="96" rx="8" fill="#1e2238" stroke="#89b4fa" stroke-width="2"/>
  <rect x="445" y="282" width="120" height="18" rx="3" fill="#313244"/>
  <text x="505" y="295" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#89b4fa">L2 CACHE</text>
  <text x="505" y="326" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#cdd6f4">Cache Region</text>
  <text x="505" y="344" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">"userDetailsCache"</text>
  <text x="505" y="360" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#fab387">Shared Lock on Read</text>

  <!-- Upper line: Cache -> DB (Cache Miss) -->
  <line x1="615" y1="305" x2="815" y2="305" stroke="#f9e2af" stroke-width="1.8" marker-end="url(#arr19-yellow)"/>
  <text x="715" y="297" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#f9e2af">If Cache Miss ──▶</text>

  <!-- Lower line: DB -> Cache (Populate Cache) -->
  <line x1="825" y1="340" x2="625" y2="340" stroke="#89b4fa" stroke-width="1.8" marker-end="url(#arr19-blue)"/>
  <text x="725" y="356" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#89b4fa">◀ Put into Cache</text>

  <!-- DB Box (Bottom) -->
  <rect x="825" y="278" width="165" height="88" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="907" y="312" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#cdd6f4">Database (DB)</text>
  <text x="907" y="332" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">Source of Truth</text>
  <text x="907" y="350" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#fab387">Query Executed</text>


  <!-- ==================== BOTTOM RULES SUMMARY ==================== -->
  <rect x="30" y="405" width="990" height="145" rx="10" fill="#181825" stroke="#313244" stroke-width="1.5"/>

  <!-- 3 Pillar Cards -->
  <!-- Pillar 1: Use Cases -->
  <rect x="48" y="418" width="305" height="88" rx="6" fill="#11111b" stroke="#89b4fa" stroke-width="1"/>
  <text x="60" y="438" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#89b4fa">Ideal Use Cases</text>
  <text x="60" y="458" font-family="sans-serif" font-size="11" fill="#cdd6f4">• Frequent reads with occasional updates.</text>
  <text x="60" y="476" font-family="sans-serif" font-size="11" fill="#a6adc8">• Applications requiring zero stale data.</text>
  <text x="60" y="494" font-family="sans-serif" font-size="10.5" fill="#6c7086">• E.g., user profiles, account preferences.</text>

  <!-- Pillar 2: Concurrency Matrix -->
  <rect x="372" y="418" width="305" height="88" rx="6" fill="#11111b" stroke="#fab387" stroke-width="1"/>
  <text x="384" y="438" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#fab387">Concurrency Matrix</text>
  <text x="384" y="458" font-family="sans-serif" font-size="11" fill="#a6e3a1">✔ Multiple concurrent READs allowed.</text>
  <text x="384" y="476" font-family="sans-serif" font-size="11" fill="#f38ba8">❌ No WRITE allowed while reading.</text>
  <text x="384" y="494" font-family="sans-serif" font-size="11" fill="#f38ba8">❌ No READ or WRITE while updating.</text>

  <!-- Pillar 3: Stale Data Prevention -->
  <rect x="696" y="418" width="306" height="88" rx="6" fill="#11111b" stroke="#a6e3a1" stroke-width="1"/>
  <text x="708" y="438" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#a6e3a1">Stale Data Prevention</text>
  <text x="708" y="458" font-family="sans-serif" font-size="11" fill="#cdd6f4">• Exclusive soft-lock taken on cache.</text>
  <text x="708" y="476" font-family="sans-serif" font-size="11" fill="#cdd6f4">• Old cache data is invalidated on lock.</text>
  <text x="708" y="494" font-family="sans-serif" font-size="10.5" fill="#a6adc8">• Readers fetch fresh DB data or wait.</text>

  <!-- Bottom Takeaway Text -->
  <text x="525" y="534" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6adc8">
    <tspan fill="#f9e2af" font-weight="bold">Summary: </tspan>
    Insert writes directly to DB. 1st GET populates L2 cache. 2nd GET serves from cache. Updates soft-lock and invalidate old entries.
  </text>
</svg>
