<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="550" viewBox="0 0 1050 550">
  <!-- Dark background container -->
  <rect width="1050" height="550" fill="#1e1e2e" rx="12"/>

  <!-- ==================== LEFT SECTION: INSERT ==================== -->
  <!-- Left Header Card -->
  <rect x="30" y="20" width="465" height="92" rx="8" fill="#181825" stroke="#313244" stroke-width="1.5"/>
  <rect x="44" y="30" width="62" height="20" rx="4" fill="#a6e3a1"/>
  <text x="75" y="44" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#11111b">PHASE 1</text>
  <text x="116" y="45" font-family="sans-serif" font-size="15" font-weight="bold" fill="#cdd6f4">1. During Insert (POST)</text>
  <text x="44" y="72" font-family="sans-serif" font-size="12" fill="#bac2de">Data is directly inserted into Database.</text>
  <text x="44" y="92" font-family="sans-serif" font-size="12" fill="#a6adc8">No cache insertion or cache validation happens during insert.</text>

  <!-- Left Main Card (Postman Mockup) -->
  <rect x="30" y="125" width="465" height="335" rx="8" fill="#181825" stroke="#313244" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <path d="M 30 133 A 8 8 0 0 1 38 125 L 487 125 A 8 8 0 0 1 495 133 L 495 159 L 30 159 Z" fill="#11111b"/>
  <circle cx="48" cy="142" r="5" fill="#f38ba8"/>
  <circle cx="64" cy="142" r="5" fill="#f9e2af"/>
  <circle cx="80" cy="142" r="5" fill="#a6e3a1"/>
  <text x="100" y="146" font-family="sans-serif" font-size="11" fill="#a6adc8">Postman • POST Request</text>

  <!-- URL Bar -->
  <rect x="42" y="170" width="441" height="32" rx="6" fill="#11111b" stroke="#313244" stroke-width="1"/>
  <rect x="48" y="175" width="50" height="22" rx="4" fill="#a6e3a1"/>
  <text x="73" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#11111b">POST</text>
  <text x="108" y="191" font-family="monospace" font-size="12" fill="#cdd6f4">http://localhost:8080/api/user</text>

  <!-- Request Body Box -->
  <rect x="42" y="212" width="441" height="96" rx="6" fill="#11111b" stroke="#313244" stroke-width="1"/>
  <text x="54" y="228" font-family="sans-serif" font-size="10" fill="#a6adc8" font-weight="bold">REQUEST BODY (raw JSON)</text>
  <text x="54" y="248" font-family="monospace" font-size="11" fill="#6c7086">1  {</text>
  <text x="54" y="266" font-family="monospace" font-size="11" fill="#cdd6f4">2    "name" : "sj",</text>
  <text x="54" y="284" font-family="monospace" font-size="11" fill="#cdd6f4">3    "email" : "xyz@conceptandcoding.com"</text>
  <text x="54" y="302" font-family="monospace" font-size="11" fill="#6c7086">4  }</text>

  <!-- Response Box -->
  <rect x="42" y="318" width="441" height="82" rx="6" fill="#11111b" stroke="#313244" stroke-width="1"/>
  <text x="54" y="334" font-family="sans-serif" font-size="10" fill="#a6e3a1" font-weight="bold">RESPONSE [200 OK]</text>
  <text x="54" y="354" font-family="monospace" font-size="11" fill="#6c7086">{</text>
  <text x="64" y="372" font-family="monospace" font-size="11" fill="#f9e2af">  "id": 1,  "name": "sj",  "email": "xyz@conceptandcoding.com"</text>
  <text x="54" y="390" font-family="monospace" font-size="11" fill="#6c7086">}</text>

  <!-- Left Bottom Callout Tag -->
  <rect x="42" y="412" width="441" height="28" rx="5" fill="#313244"/>
  <text x="262" y="430" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#f9e2af" font-weight="bold">✔ Direct DB insert — Cache is neither populated nor checked</text>


  <!-- ==================== RIGHT SECTION: GET ==================== -->
  <!-- Right Header Card -->
  <rect x="525" y="20" width="495" height="92" rx="8" fill="#181825" stroke="#313244" stroke-width="1.5"/>
  <rect x="539" y="30" width="62" height="20" rx="4" fill="#89b4fa"/>
  <text x="570" y="44" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#11111b">PHASE 2</text>
  <text x="611" y="45" font-family="sans-serif" font-size="15" font-weight="bold" fill="#cdd6f4">2. During Get (Cache Miss vs Cache Hit)</text>
  <text x="539" y="72" font-family="sans-serif" font-size="12" fill="#bac2de">JPA checks if data is present in cache before querying DB.</text>
  <text x="539" y="92" font-family="sans-serif" font-size="12" fill="#a6adc8">1st Call: Miss (DB query &amp; cache)  |  2nd Call: Hit (Fast return, No DB)</text>

  <!-- Right Subcard 1: 1st GET Call (Cache Miss) -->
  <rect x="525" y="125" width="235" height="335" rx="8" fill="#181825" stroke="#f38ba8" stroke-width="1.5"/>
  
  <!-- Window Bar 1 -->
  <path d="M 525 133 A 8 8 0 0 1 533 125 L 752 125 A 8 8 0 0 1 760 133 L 760 159 L 525 159 Z" fill="#11111b"/>
  <circle cx="541" cy="142" r="4" fill="#f38ba8"/>
  <circle cx="553" cy="142" r="4" fill="#f9e2af"/>
  <circle cx="565" cy="142" r="4" fill="#a6e3a1"/>
  <rect x="670" y="132" width="78" height="20" rx="4" fill="#f38ba8"/>
  <text x="709" y="146" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#11111b">CACHE MISS</text>

  <!-- URL Bar 1 -->
  <rect x="535" y="168" width="215" height="28" rx="5" fill="#11111b" stroke="#313244" stroke-width="1"/>
  <rect x="540" y="172" width="36" height="20" rx="3" fill="#89b4fa"/>
  <text x="558" y="186" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#11111b">GET</text>
  <text x="582" y="186" font-family="monospace" font-size="10.5" fill="#cdd6f4">.../api/user/1</text>

  <!-- Callout Annotation Box 1 (Miss) -->
  <rect x="535" y="204" width="215" height="96" rx="6" fill="#2d1c25" stroke="#f38ba8" stroke-width="1"/>
  <text x="545" y="224" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f38ba8">This is first Get call:</text>
  <text x="545" y="243" font-family="sans-serif" font-size="11" fill="#f38ba8">• Cache Miss will happen</text>
  <text x="545" y="262" font-family="sans-serif" font-size="11" fill="#f38ba8">• DB query will be made</text>
  <text x="545" y="281" font-family="sans-serif" font-size="11" fill="#f38ba8">• Result put into Cache</text>

  <!-- Response Preview Box 1 -->
  <rect x="535" y="308" width="215" height="88" rx="6" fill="#11111b" stroke="#313244" stroke-width="1"/>
  <text x="545" y="324" font-family="sans-serif" font-size="9" fill="#a6adc8" font-weight="bold">RESPONSE [200 OK]</text>
  <text x="545" y="342" font-family="monospace" font-size="10" fill="#6c7086">{</text>
  <text x="553" y="358" font-family="monospace" font-size="10" fill="#cdd6f4">  "id": 1, "name": "sj",</text>
  <text x="553" y="374" font-family="monospace" font-size="10" fill="#cdd6f4">  "email": "xyz@..."</text>
  <text x="545" y="388" font-family="monospace" font-size="10" fill="#6c7086">}</text>

  <!-- Tag 1 -->
  <rect x="535" y="412" width="215" height="28" rx="5" fill="#31202e"/>
  <text x="642" y="430" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#f38ba8" font-weight="bold">DB Query Executed (Slow)</text>


  <!-- Right Subcard 2: 2nd GET Call (Cache Hit) -->
  <rect x="785" y="125" width="235" height="335" rx="8" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
  
  <!-- Window Bar 2 -->
  <path d="M 785 133 A 8 8 0 0 1 793 125 L 1012 125 A 8 8 0 0 1 1020 133 L 1020 159 L 785 159 Z" fill="#11111b"/>
  <circle cx="801" cy="142" r="4" fill="#f38ba8"/>
  <circle cx="813" cy="142" r="4" fill="#f9e2af"/>
  <circle cx="825" cy="142" r="4" fill="#a6e3a1"/>
  <rect x="934" y="132" width="74" height="20" rx="4" fill="#a6e3a1"/>
  <text x="971" y="146" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#11111b">CACHE HIT</text>

  <!-- URL Bar 2 -->
  <rect x="795" y="168" width="215" height="28" rx="5" fill="#11111b" stroke="#313244" stroke-width="1"/>
  <rect x="800" y="172" width="36" height="20" rx="3" fill="#89b4fa"/>
  <text x="818" y="186" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#11111b">GET</text>
  <text x="842" y="186" font-family="monospace" font-size="10.5" fill="#cdd6f4">.../api/user/1</text>

  <!-- Callout Annotation Box 2 (Hit) -->
  <rect x="795" y="204" width="215" height="96" rx="6" fill="#1c2d25" stroke="#a6e3a1" stroke-width="1"/>
  <text x="805" y="224" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a6e3a1">This is Second Get call:</text>
  <text x="805" y="243" font-family="sans-serif" font-size="11" fill="#a6e3a1">• Cache Hit will happen</text>
  <text x="805" y="262" font-family="sans-serif" font-size="11" fill="#a6e3a1">• NO DB call will be made</text>
  <text x="805" y="281" font-family="sans-serif" font-size="11" fill="#a6e3a1">• Returned directly from Cache</text>

  <!-- Response Preview Box 2 -->
  <rect x="795" y="308" width="215" height="88" rx="6" fill="#11111b" stroke="#313244" stroke-width="1"/>
  <text x="805" y="324" font-family="sans-serif" font-size="9" fill="#a6adc8" font-weight="bold">RESPONSE [200 OK]</text>
  <text x="805" y="342" font-family="monospace" font-size="10" fill="#6c7086">{</text>
  <text x="813" y="358" font-family="monospace" font-size="10" fill="#cdd6f4">  "id": 1, "name": "sj",</text>
  <text x="813" y="374" font-family="monospace" font-size="10" fill="#cdd6f4">  "email": "xyz@..."</text>
  <text x="805" y="388" font-family="monospace" font-size="10" fill="#6c7086">}</text>

  <!-- Tag 2 -->
  <rect x="795" y="412" width="215" height="28" rx="5" fill="#1c2d25"/>
  <text x="902" y="430" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#a6e3a1" font-weight="bold">Served from L2 Cache (Fast)</text>


  <!-- ==================== BOTTOM SUMMARY FOOTER ==================== -->
  <rect x="30" y="480" width="990" height="46" rx="8" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="525" y="508" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cdd6f4">
    <tspan fill="#f9e2af" font-weight="bold">Key Takeaway: </tspan>
    Insert directly writes to DB. First GET causes a <tspan fill="#f38ba8" font-weight="bold">Cache Miss</tspan> (fetches from DB &amp; populates L2 Cache), subsequent GETs result in a <tspan fill="#a6e3a1" font-weight="bold">Cache Hit</tspan> (no DB call).
  </text>
</svg>
