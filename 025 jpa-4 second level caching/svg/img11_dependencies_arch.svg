<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="740" viewBox="0 0 1050 740">
  <defs>
    <marker id="arr11" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#89b4fa"/>
    </marker>
    <marker id="arr11-green" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#a6e3a1"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1050" height="740" fill="#1e1e2e" rx="14"/>

  <!-- ==================== TOP SECTION: 3 DEPENDENCIES ==================== -->
  <rect x="30" y="20" width="990" height="415" rx="10" fill="#181825" stroke="#313244" stroke-width="1.5"/>

  <!-- Top Section Title -->
  <rect x="48" y="32" width="170" height="22" rx="4" fill="#313244"/>
  <text x="133" y="47" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#89b4fa">POM.XML DEPENDENCIES</text>
  <text x="232" y="49" font-family="sans-serif" font-size="15" font-weight="bold" fill="#cdd6f4">1. Why are 3 dependencies required in pom.xml?</text>

  <!-- ROW 1: ehcache -->
  <rect x="48" y="68" width="954" height="106" rx="8" fill="#11111b" stroke="#313244" stroke-width="1"/>
  <!-- Code Block 1 -->
  <rect x="58" y="78" width="370" height="86" rx="6" fill="#181825"/>
  <text x="70" y="95" font-family="monospace" font-size="11" fill="#6c7086">&lt;dependency&gt;</text>
  <text x="84" y="111" font-family="monospace" font-size="11" fill="#cdd6f4">&lt;groupId&gt;<tspan fill="#a6e3a1" font-weight="bold">org.ehcache</tspan>&lt;/groupId&gt;</text>
  <text x="84" y="127" font-family="monospace" font-size="11" fill="#cdd6f4">&lt;artifactId&gt;<tspan fill="#a6e3a1" font-weight="bold">ehcache</tspan>&lt;/artifactId&gt;</text>
  <text x="84" y="143" font-family="monospace" font-size="11" fill="#cdd6f4">&lt;version&gt;<tspan fill="#f9e2af">3.10.8</tspan>&lt;/version&gt;</text>
  <text x="70" y="157" font-family="monospace" font-size="11" fill="#6c7086">&lt;/dependency&gt;</text>
  <!-- Arrow 1 -->
  <line x1="438" y1="121" x2="480" y2="121" stroke="#89b4fa" stroke-width="2" marker-end="url(#arr11)"/>
  <!-- Explanation 1 -->
  <rect x="495" y="80" width="180" height="20" rx="4" fill="#1c2d25"/>
  <text x="503" y="94" font-family="sans-serif" font-size="10" font-weight="bold" fill="#a6e3a1">CACHE IMPLEMENTATION</text>
  <text x="495" y="118" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">Provides the core implementation of Second Level Caching</text>
  <text x="495" y="137" font-family="sans-serif" font-size="11.5" fill="#a6adc8">• Manages actual in-memory and off-heap storage, eviction, and TTL policies.</text>
  <text x="495" y="154" font-family="sans-serif" font-size="11.5" fill="#a6adc8">• Alternatives: Caffeine, Hazelcast, etc. You can swap implementations freely.</text>

  <!-- ROW 2: hibernate-jcache -->
  <rect x="48" y="184" width="954" height="112" rx="8" fill="#11111b" stroke="#313244" stroke-width="1"/>
  <!-- Code Block 2 -->
  <rect x="58" y="194" width="370" height="92" rx="6" fill="#181825"/>
  <text x="70" y="211" font-family="monospace" font-size="11" fill="#6c7086">&lt;dependency&gt;</text>
  <text x="84" y="227" font-family="monospace" font-size="11" fill="#cdd6f4">&lt;groupId&gt;<tspan fill="#f9e2af" font-weight="bold">org.hibernate</tspan>&lt;/groupId&gt;</text>
  <text x="84" y="243" font-family="monospace" font-size="11" fill="#cdd6f4">&lt;artifactId&gt;<tspan fill="#f9e2af" font-weight="bold">hibernate-jcache</tspan>&lt;/artifactId&gt;</text>
  <text x="84" y="259" font-family="monospace" font-size="11" fill="#cdd6f4">&lt;version&gt;<tspan fill="#f9e2af">6.5.2.Final</tspan>&lt;/version&gt;</text>
  <text x="70" y="275" font-family="monospace" font-size="11" fill="#6c7086">&lt;/dependency&gt;</text>
  <!-- Arrow 2 -->
  <line x1="438" y1="240" x2="480" y2="240" stroke="#89b4fa" stroke-width="2" marker-end="url(#arr11)"/>
  <!-- Explanation 2 -->
  <rect x="495" y="196" width="180" height="20" rx="4" fill="#2d261e"/>
  <text x="503" y="210" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f9e2af">HIBERNATE INTEGRATION</text>
  <text x="495" y="234" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">Hibernate-specific Caching Logic &amp; Annotation Support</text>
  <text x="495" y="253" font-family="sans-serif" font-size="11.5" fill="#a6adc8">• Handles <tspan fill="#f9e2af">@Cache</tspan> annotations and <tspan fill="#f9e2af">CacheConcurrencyStrategy</tspan> behavior.</text>
  <text x="495" y="270" font-family="sans-serif" font-size="11.5" fill="#a6adc8">• Acts as mediator: translates Hibernate entity cache operations to JCache calls.</text>

  <!-- ROW 3: cache-api -->
  <rect x="48" y="306" width="954" height="114" rx="8" fill="#11111b" stroke="#313244" stroke-width="1"/>
  <!-- Code Block 3 -->
  <rect x="58" y="316" width="370" height="92" rx="6" fill="#181825"/>
  <text x="70" y="333" font-family="monospace" font-size="11" fill="#6c7086">&lt;dependency&gt;</text>
  <text x="84" y="349" font-family="monospace" font-size="11" fill="#cdd6f4">&lt;groupId&gt;<tspan fill="#89b4fa" font-weight="bold">javax.cache</tspan>&lt;/groupId&gt;</text>
  <text x="84" y="365" font-family="monospace" font-size="11" fill="#cdd6f4">&lt;artifactId&gt;<tspan fill="#89b4fa" font-weight="bold">cache-api</tspan>&lt;/artifactId&gt;</text>
  <text x="84" y="381" font-family="monospace" font-size="11" fill="#cdd6f4">&lt;version&gt;<tspan fill="#f9e2af">1.1.1</tspan>&lt;/version&gt;</text>
  <text x="70" y="397" font-family="monospace" font-size="11" fill="#6c7086">&lt;/dependency&gt;</text>
  <!-- Arrow 3 -->
  <line x1="438" y1="362" x2="480" y2="362" stroke="#89b4fa" stroke-width="2" marker-end="url(#arr11)"/>
  <!-- Explanation 3 -->
  <rect x="495" y="318" width="180" height="20" rx="4" fill="#1e2238"/>
  <text x="503" y="332" font-family="sans-serif" font-size="10" font-weight="bold" fill="#89b4fa">SPECIFICATION / INTERFACES</text>
  <text x="495" y="356" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">Standard JCache (JSR-107) Specification API</text>
  <text x="495" y="375" font-family="sans-serif" font-size="11.5" fill="#a6adc8">• Provides standard interfaces so Hibernate does not tightly couple to Ehcache.</text>
  <text x="495" y="392" font-family="sans-serif" font-size="11.5" fill="#a6adc8">• Enables switching caching providers without modifying any application code.</text>


  <!-- ==================== BOTTOM SECTION: ARCHITECTURE ==================== -->
  <rect x="30" y="447" width="990" height="273" rx="10" fill="#181825" stroke="#313244" stroke-width="1.5"/>

  <!-- Architecture Header -->
  <rect x="48" y="459" width="170" height="22" rx="4" fill="#313244"/>
  <text x="133" y="474" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#a6e3a1">SYSTEM ARCHITECTURE</text>
  <text x="232" y="476" font-family="sans-serif" font-size="15" font-weight="bold" fill="#cdd6f4">Interaction Flow: Hibernate ➔ Bridge ➔ JCache ➔ Provider</text>

  <!-- Box 1: Hibernate -->
  <rect x="48" y="525" width="130" height="70" rx="8" fill="#11111b" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="113" y="556" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#cdd6f4">Hibernate</text>
  <text x="113" y="574" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#a6adc8">ORM / JPA Provider</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="178" y1="560" x2="228" y2="560" stroke="#89b4fa" stroke-width="2" marker-end="url(#arr11)"/>
  <text x="203" y="550" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#6c7086">calls</text>

  <!-- Box 2: Hibernate-jcache -->
  <rect x="233" y="525" width="155" height="70" rx="8" fill="#11111b" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="310" y="556" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f9e2af">hibernate-jcache</text>
  <text x="310" y="574" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#a6adc8">Mediator &amp; Cache SPI</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="388" y1="560" x2="438" y2="560" stroke="#89b4fa" stroke-width="2" marker-end="url(#arr11)"/>
  <text x="413" y="550" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#6c7086">invokes</text>

  <!-- Box 3: JCache APIs (Interfaces) -->
  <rect x="443" y="512" width="165" height="96" rx="8" fill="#1e2238" stroke="#89b4fa" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="475" y="520" width="100" height="18" rx="3" fill="#313244"/>
  <text x="525" y="533" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#89b4fa">javax.cache.*</text>
  <text x="525" y="562" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#cdd6f4">JCache APIs</text>
  <text x="525" y="580" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#89b4fa">(Standard Interfaces)</text>
  <text x="525" y="596" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#a6adc8">Loose Coupling Layer</text>

  <!-- Label Box: Implementation -->
  <rect x="625" y="547" width="102" height="26" rx="4" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="676" y="564" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#f9e2af">Implementation</text>

  <!-- Path from JCache to Implementation label -->
  <line x1="608" y1="560" x2="625" y2="560" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- Fork lines to the 3 implementations -->
  <!-- Upper line to Ehcache -->
  <path d="M 727 560 L 755 560 L 755 512 L 780 512" fill="none" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arr11-green)"/>
  <!-- Middle line to Caffeine -->
  <path d="M 727 560 L 780 560" fill="none" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arr11)"/>
  <!-- Lower line to Hazelcast -->
  <path d="M 727 560 L 755 560 L 755 608 L 780 608" fill="none" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arr11)"/>

  <!-- Implementation Box 1: Ehcache (Active) -->
  <rect x="785" y="492" width="215" height="40" rx="6" fill="#1c2d25" stroke="#a6e3a1" stroke-width="1.8"/>
  <text x="797" y="514" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1">Ehcache</text>
  <rect x="857" y="502" width="135" height="20" rx="3" fill="#11111b"/>
  <text x="924" y="516" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a6e3a1">● Configured in this Demo</text>

  <!-- Implementation Box 2: Caffeine -->
  <rect x="785" y="540" width="215" height="40" rx="6" fill="#11111b" stroke="#45475a" stroke-width="1"/>
  <text x="797" y="562" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">Caffeine</text>
  <text x="797" y="575" font-family="sans-serif" font-size="9" fill="#6c7086">Alternative local cache provider</text>

  <!-- Implementation Box 3: Hazelcast -->
  <rect x="785" y="588" width="215" height="40" rx="6" fill="#11111b" stroke="#45475a" stroke-width="1"/>
  <text x="797" y="610" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">Hazelcast</text>
  <text x="797" y="623" font-family="sans-serif" font-size="9" fill="#6c7086">Alternative distributed cache provider</text>

  <!-- Architecture Note Footer -->
  <rect x="48" y="650" width="954" height="48" rx="6" fill="#11111b" stroke="#313244" stroke-width="1"/>
  <text x="525" y="672" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#cdd6f4">
    <tspan fill="#f9e2af" font-weight="bold">Design Principle: </tspan>
    Hibernate does not talk directly to Ehcache. It relies on <tspan fill="#f9e2af">hibernate-jcache</tspan> as a mediator to interact with <tspan fill="#89b4fa">JCache APIs</tspan>.
  </text>
  <text x="525" y="690" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6adc8">
    Because of this loose coupling, you can swap Ehcache with Caffeine or Hazelcast without modifying any entity code!
  </text>
</svg>
