<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340">
  <rect width="700" height="340" fill="#1e1e2e" rx="12"/>

  <!-- Title -->
  <text x="350" y="38" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#cdd6f4" font-weight="bold">1. During Insert, data is directly inserted into</text>
  <text x="350" y="60" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#cdd6f4" font-weight="bold">DB, no Cache insertion or validation happens</text>

  <!-- POST request box -->
  <rect x="60" y="80" width="580" height="220" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>

  <!-- Method bar -->
  <rect x="72" y="92" width="60" height="26" rx="4" fill="#d4edda"/>
  <text x="102" y="110" text-anchor="middle" font-family="monospace" font-size="12" fill="#155724" font-weight="bold">POST</text>
  <text x="145" y="110" font-family="monospace" font-size="12" fill="#333">  localhost:8080/api/user</text>

  <!-- Tabs -->
  <text x="72" y="138" font-family="sans-serif" font-size="11" fill="#666">Params •    Authorization    Headers (8)</text>
  <text x="320" y="138" font-family="sans-serif" font-size="11" fill="#333" font-weight="bold">Body •</text>
  <text x="360" y="138" font-family="sans-serif" font-size="11" fill="#666">Scripts    Settings</text>
  <text x="72" y="158" font-family="sans-serif" font-size="10" fill="#666">○ none   ○ form-data   ○ x-www-form-urlencoded   ● raw   ○ binary</text>

  <!-- Code content -->
  <rect x="72" y="170" width="556" height="80" fill="#f8f9fa"/>
  <text x="82" y="190" font-family="monospace" font-size="12" fill="#666">1   {</text>
  <text x="82" y="210" font-family="monospace" font-size="12" fill="#333">2       "name" : "sj",</text>
  <text x="82" y="228" font-family="monospace" font-size="12" fill="#333">3       "email" : "xyz@conceptandcoding.com"</text>
  <text x="82" y="246" font-family="monospace" font-size="12" fill="#666">4   }</text>

  <!-- Response section -->
  <text x="72" y="270" font-family="sans-serif" font-size="11" fill="#666">Body    Cookies    Headers (5)    Test Results</text>
  <text x="72" y="292" font-family="monospace" font-size="12" fill="#333">{ "id": 1, "name": "sj", "email": "xyz@conceptandcoding.com" }</text>

  <text x="350" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#cdd6f4">Post call data inserted!!</text>
</svg>
