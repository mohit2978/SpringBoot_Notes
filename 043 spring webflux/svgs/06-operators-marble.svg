<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" font-size="13">
<rect width="1000" height="620" fill="#1e1e1e" rx="8"/>
<defs><marker id="op" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#888"/></marker></defs>

<text x="500" y="32" fill="#d4a017" font-size="18" font-weight="bold" text-anchor="middle">The operators you will actually use</text>

<!-- map -->
<text x="40" y="76" fill="#4ec9b0" font-family="Consolas, monospace" font-size="15" font-weight="bold">map(x -&gt; x * 10)</text>
<text x="250" y="76" fill="#aaa" font-size="12">1 in → 1 out, synchronous transform</text>
<line x1="60" y1="106" x2="900" y2="106" stroke="#888" stroke-width="2" marker-end="url(#op)"/>
<g fill="#569cd6"><circle cx="150" cy="106" r="15"/><circle cx="260" cy="106" r="15"/><circle cx="370" cy="106" r="15"/></g>
<g fill="#1e1e1e" font-weight="bold" font-size="11" text-anchor="middle"><text x="150" y="111">1</text><text x="260" y="111">2</text><text x="370" y="111">3</text></g>
<line x1="60" y1="160" x2="900" y2="160" stroke="#888" stroke-width="2" marker-end="url(#op)"/>
<g fill="#4ec9b0"><circle cx="150" cy="160" r="15"/><circle cx="260" cy="160" r="15"/><circle cx="370" cy="160" r="15"/></g>
<g fill="#1e1e1e" font-weight="bold" font-size="11" text-anchor="middle"><text x="150" y="165">10</text><text x="260" y="165">20</text><text x="370" y="165">30</text></g>

<line x1="40" y1="188" x2="960" y2="188" stroke="#444"/>

<!-- filter -->
<text x="40" y="222" fill="#4ec9b0" font-family="Consolas, monospace" font-size="15" font-weight="bold">filter(x -&gt; x % 2 == 0)</text>
<text x="300" y="222" fill="#aaa" font-size="12">drops what does not match</text>
<line x1="60" y1="252" x2="900" y2="252" stroke="#888" stroke-width="2" marker-end="url(#op)"/>
<g fill="#569cd6"><circle cx="150" cy="252" r="15"/><circle cx="260" cy="252" r="15"/><circle cx="370" cy="252" r="15"/><circle cx="480" cy="252" r="15"/></g>
<g fill="#1e1e1e" font-weight="bold" font-size="11" text-anchor="middle"><text x="150" y="257">1</text><text x="260" y="257">2</text><text x="370" y="257">3</text><text x="480" y="257">4</text></g>
<line x1="60" y1="306" x2="900" y2="306" stroke="#888" stroke-width="2" marker-end="url(#op)"/>
<g fill="#4ec9b0"><circle cx="260" cy="306" r="15"/><circle cx="480" cy="306" r="15"/></g>
<g fill="#1e1e1e" font-weight="bold" font-size="11" text-anchor="middle"><text x="260" y="311">2</text><text x="480" y="311">4</text></g>

<line x1="40" y1="334" x2="960" y2="334" stroke="#444"/>

<!-- flatMap -->
<text x="40" y="368" fill="#c586c0" font-family="Consolas, monospace" font-size="15" font-weight="bold">flatMap(id -&gt; repo.findById(id))</text>
<text x="400" y="368" fill="#aaa" font-size="12">1 in → a whole Publisher out, then flattened — USE FOR ANY ASYNC CALL</text>
<line x1="60" y1="398" x2="900" y2="398" stroke="#888" stroke-width="2" marker-end="url(#op)"/>
<g fill="#569cd6"><circle cx="150" cy="398" r="15"/><circle cx="330" cy="398" r="15"/></g>
<g fill="#1e1e1e" font-weight="bold" font-size="11" text-anchor="middle"><text x="150" y="403">A</text><text x="330" y="403">B</text></g>

<g stroke="#c586c0" stroke-width="1.5" fill="none" stroke-dasharray="4,3">
<path d="M150,414 L180,444"/><path d="M330,414 L360,444"/>
</g>
<line x1="60" y1="462" x2="900" y2="462" stroke="#888" stroke-width="2" marker-end="url(#op)"/>
<g fill="#c586c0"><circle cx="190" cy="462" r="14"/><circle cx="250" cy="462" r="14"/><circle cx="370" cy="462" r="14"/><circle cx="430" cy="462" r="14"/></g>
<g fill="#1e1e1e" font-weight="bold" font-size="10" text-anchor="middle"><text x="190" y="466">A1</text><text x="250" y="466">A2</text><text x="370" y="466">B1</text><text x="430" y="466">B2</text></g>
<text x="560" y="432" fill="#f14c4c" font-size="11">interleaved — order NOT guaranteed (use concatMap to keep order)</text>

<line x1="40" y1="492" x2="960" y2="492" stroke="#444"/>

<!-- zip -->
<text x="40" y="524" fill="#4ec9b0" font-family="Consolas, monospace" font-size="15" font-weight="bold">zip(fluxA, fluxB)</text>
<text x="260" y="524" fill="#aaa" font-size="12">pairs items from two streams — runs both calls in PARALLEL</text>
<line x1="60" y1="552" x2="620" y2="552" stroke="#888" stroke-width="2"/>
<g fill="#569cd6"><circle cx="150" cy="552" r="13"/><circle cx="250" cy="552" r="13"/></g>
<g fill="#1e1e1e" font-weight="bold" font-size="10" text-anchor="middle"><text x="150" y="556">a1</text><text x="250" y="556">a2</text></g>
<line x1="60" y1="584" x2="620" y2="584" stroke="#888" stroke-width="2"/>
<g fill="#d4a017"><circle cx="150" cy="584" r="13"/><circle cx="250" cy="584" r="13"/></g>
<g fill="#1e1e1e" font-weight="bold" font-size="10" text-anchor="middle"><text x="150" y="588">b1</text><text x="250" y="588">b2</text></g>
<text x="650" y="562" fill="#4ec9b0" font-size="12" font-family="Consolas, monospace">→ (a1,b1)  (a2,b2)</text>
<text x="650" y="586" fill="#aaa" font-size="11">total time = slower of the two, not the sum</text>
</svg>
