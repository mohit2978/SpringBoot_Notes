<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" font-size="13">
<rect width="1000" height="580" fill="#1e1e1e" rx="8"/>
<defs>
  <marker id="r1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#569cd6"/></marker>
  <marker id="r2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#4ec9b0"/></marker>
  <marker id="r3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d4a017"/></marker>
</defs>

<text x="500" y="32" fill="#d4a017" font-size="18" font-weight="bold" text-anchor="middle">Reactive Streams — the 4 interfaces and the handshake</text>

<rect x="60" y="60" width="230" height="50" rx="8" fill="#2a3a4a" stroke="#569cd6" stroke-width="2"/>
<text x="175" y="82" fill="#9cdcfe" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace">Publisher&lt;T&gt;</text>
<text x="175" y="100" fill="#aaa" text-anchor="middle" font-size="11">Flux / Mono — the source</text>

<rect x="710" y="60" width="230" height="50" rx="8" fill="#234a3e" stroke="#4ec9b0" stroke-width="2"/>
<text x="825" y="82" fill="#9ae6d0" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace">Subscriber&lt;T&gt;</text>
<text x="825" y="100" fill="#aaa" text-anchor="middle" font-size="11">your .subscribe(...) / the server</text>

<line x1="175" y1="112" x2="175" y2="500" stroke="#569cd6" stroke-width="2" stroke-dasharray="5,5"/>
<line x1="825" y1="112" x2="825" y2="500" stroke="#4ec9b0" stroke-width="2" stroke-dasharray="5,5"/>

<g font-family="Consolas, monospace" font-size="13">
<line x1="820" y1="150" x2="180" y2="150" stroke="#4ec9b0" stroke-width="2" marker-end="url(#r2)"/>
<text x="500" y="142" fill="#9ae6d0" text-anchor="middle">1.  subscribe(subscriber)</text>
<text x="500" y="166" fill="#777" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11">nothing happens before this line — publishers are lazy</text>

<line x1="180" y1="210" x2="820" y2="210" stroke="#569cd6" stroke-width="2" marker-end="url(#r1)"/>
<text x="500" y="202" fill="#9cdcfe" text-anchor="middle">2.  onSubscribe(subscription)</text>
<text x="500" y="226" fill="#777" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11">hands over the control handle</text>

<line x1="820" y1="272" x2="180" y2="272" stroke="#d4a017" stroke-width="2.5" marker-end="url(#r3)"/>
<text x="500" y="264" fill="#d4a017" text-anchor="middle" font-weight="bold">3.  subscription.request(n)</text>
<text x="500" y="288" fill="#d4a017" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11">"I can handle n items" ← THIS IS BACKPRESSURE</text>

<line x1="180" y1="330" x2="820" y2="330" stroke="#569cd6" stroke-width="2" marker-end="url(#r1)"/>
<text x="500" y="322" fill="#9cdcfe" text-anchor="middle">4.  onNext(item 1)</text>
<line x1="180" y1="362" x2="820" y2="362" stroke="#569cd6" stroke-width="2" marker-end="url(#r1)"/>
<text x="500" y="354" fill="#9cdcfe" text-anchor="middle">onNext(item 2)   …  at most n times</text>

<line x1="820" y1="404" x2="180" y2="404" stroke="#d4a017" stroke-width="2" marker-end="url(#r3)"/>
<text x="500" y="396" fill="#d4a017" text-anchor="middle">5.  request(n) again  — asks for more</text>

<line x1="180" y1="452" x2="820" y2="452" stroke="#569cd6" stroke-width="2" marker-end="url(#r1)"/>
<text x="500" y="444" fill="#9cdcfe" text-anchor="middle">6.  onComplete()   or   onError(throwable)</text>
<text x="500" y="470" fill="#777" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11">terminal — exactly one of them, then the stream is finished</text>

<line x1="820" y1="500" x2="180" y2="500" stroke="#f14c4c" stroke-width="2" stroke-dasharray="5,4"/>
<text x="500" y="492" fill="#f14c4c" text-anchor="middle">(any time)  subscription.cancel()</text>
</g>

<rect x="60" y="522" width="880" height="44" rx="8" fill="#252525"/>
<text x="76" y="540" fill="#e0e0e0" font-size="12"><tspan font-family="Consolas, monospace" fill="#9cdcfe">Subscription</tspan> = the contract handle: it has only two methods, <tspan font-family="Consolas, monospace" fill="#d4a017">request(long n)</tspan> and <tspan font-family="Consolas, monospace" fill="#f14c4c">cancel()</tspan>.</text>
<text x="76" y="558" fill="#e0e0e0" font-size="12"><tspan font-family="Consolas, monospace" fill="#c586c0">Processor</tspan> = the 4th interface — it is both a Publisher and a Subscriber (used to build operators in the middle of a chain).</text>
</svg>
