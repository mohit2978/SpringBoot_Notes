<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" font-size="12">
<rect width="900" height="440" fill="#1e1e1e" rx="8"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e0e0e0"/></marker></defs>

<text x="30" y="60" fill="#9cdca8" text-decoration="underline">POST:</text>
<text x="30" y="76" fill="#9cdca8">/adduser</text>
<ellipse cx="130" cy="110" rx="62" ry="30" fill="none" stroke="#e0e0e0"/>
<text x="130" y="106" fill="#e0e0e0" text-anchor="middle">Unverified</text>
<text x="130" y="122" fill="#e0e0e0" text-anchor="middle">User Added</text>

<ellipse cx="300" cy="55" rx="48" ry="24" fill="none" stroke="#e0e0e0"/>
<text x="300" y="60" fill="#e0e0e0" text-anchor="middle">GET User</text>
<text x="370" y="30" fill="#9cdca8" text-decoration="underline">GET:</text>
<text x="370" y="46" fill="#9cdca8">/getuser</text>

<ellipse cx="330" cy="140" rx="58" ry="24" fill="none" stroke="#e0e0e0"/>
<text x="330" y="145" fill="#e0e0e0" text-anchor="middle">DELETE User</text>
<text x="400" y="118" fill="#9cdca8" text-decoration="underline">DELETE:</text>
<text x="400" y="134" fill="#9cdca8">/removeuser</text>

<ellipse cx="130" cy="300" rx="58" ry="24" fill="none" stroke="#e0e0e0"/>
<text x="130" y="305" fill="#e0e0e0" text-anchor="middle">VERIFY User</text>

<ellipse cx="400" cy="250" rx="95" ry="24" fill="none" stroke="#e0e0e0"/>
<text x="400" y="255" fill="#e0e0e0" text-anchor="middle">SMS-VERIFY STARTED</text>
<text x="200" y="222" fill="#9cdca8" text-decoration="underline">POST:</text>
<text x="200" y="238" fill="#9cdca8">/sms-verify-start</text>

<ellipse cx="650" cy="250" rx="95" ry="24" fill="none" stroke="#e0e0e0"/>
<text x="650" y="255" fill="#e0e0e0" text-anchor="middle">SMS-VERIFY FINISHED</text>
<text x="755" y="222" fill="#9cdca8" text-decoration="underline">POST:</text>
<text x="755" y="238" fill="#9cdca8">/sms-verify-finish</text>

<ellipse cx="400" cy="360" rx="100" ry="24" fill="none" stroke="#e0e0e0"/>
<text x="400" y="365" fill="#e0e0e0" text-anchor="middle">EMAIL-VERIFY STARTED</text>
<text x="240" y="395" fill="#9cdca8" text-decoration="underline">POST:</text>
<text x="240" y="411" fill="#9cdca8">/email-verify-start</text>

<ellipse cx="660" cy="360" rx="100" ry="24" fill="none" stroke="#e0e0e0"/>
<text x="660" y="365" fill="#e0e0e0" text-anchor="middle">EMAIL-VERIFY FINISHED</text>
<text x="768" y="385" fill="#9cdca8" text-decoration="underline">POST:</text>
<text x="768" y="401" fill="#9cdca8">/email-verify-finish</text>

<g stroke="#e0e0e0" fill="none" marker-end="url(#ar)">
<line x1="170" y1="88" x2="252" y2="62"/>
<line x1="180" y1="128" x2="271" y2="140"/>
<line x1="130" y1="140" x2="130" y2="272"/>
<line x1="188" y1="300" x2="215" y2="300"/>
<line x1="305" y1="250" x2="215" y2="250"/>
<line x1="497" y1="250" x2="553" y2="250"/>
<line x1="297" y1="360" x2="215" y2="360"/>
<line x1="502" y1="360" x2="558" y2="360"/>
</g>
<path d="M215,300 L215,250" stroke="#e0e0e0" fill="none"/>
<path d="M215,300 L215,360" stroke="#e0e0e0" fill="none"/>
</svg>
