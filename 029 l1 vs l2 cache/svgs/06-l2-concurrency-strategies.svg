  <text x="50.0" y="428.2" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#1e1e1e" text-anchor="start" font-weight="normal" xml:space="preserve">@OneToMany(mappedBy = &quot;author&quot;)  @Cache(usage = CacheConcurrencyStrategy.READ_WRITE)  List&lt;Book&gt; books;</text>
  <text x="50.0" y="446.4" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="14" fill="#1e1e1e" text-anchor="start" font-weight="normal" xml:space="preserve">The collection cache stores only the child IDs → Book must be @Cacheable too, or each element hits the DB.</text>
