<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680">
  <defs>
    <style>
      @keyframes dashFlow {
        from { stroke-dashoffset: 48; }
        to { stroke-dashoffset: 0; }
      }
      .flow-path-fast {
        stroke-dasharray: 8 6;
        animation: dashFlow 1.2s linear infinite;
      }
      .flow-path-medium {
        stroke-dasharray: 8 6;
        animation: dashFlow 1.8s linear infinite;
      }
      .flow-path-slow {
        stroke-dasharray: 8 6;
        animation: dashFlow 2.4s linear infinite;
      }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #f8fafc; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #94a3b8; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
      .text-normal { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .text-code { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; }
    </style>

    <linearGradient id="bgDecision" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="mGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#34d399" />
    </marker>
    <marker id="mCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" />
    </marker>
    <marker id="mAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" />
    </marker>
    <marker id="mRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171" />
    </marker>
    <marker id="mIndigo" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#818cf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="680" rx="16" fill="url(#bgDecision)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <g transform="translate(40, 32)">
    <circle cx="12" cy="12" r="10" fill="#34d399" opacity="0.2"/>
    <circle cx="12" cy="12" r="5" fill="#34d399"/>
    <text x="32" y="18" class="text-title" font-size="20">Entity Lookup Decision Tree &amp; Execution Lifecycle</text>
    <text x="32" y="38" class="text-sub">Step-by-step priority order: L1 Cache → L2 Cache → Relational Database fallback</text>
  </g>

  <!-- ==================== FLOWCHART NODES ==================== -->

  <!-- 1. Start Node: Request -->
  <g transform="translate(390, 75)">
    <rect width="220" height="50" rx="25" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="110" y="25" text-anchor="middle" class="text-bold" font-size="13" fill="#ffffff">App calls session.get(id)</text>
    <text x="110" y="40" text-anchor="middle" class="text-code" font-size="11" fill="#e0f2fe">findById(101) initiated</text>
  </g>

  <!-- Down arrow to L1 -->
  <path d="M 500 125 L 500 160" stroke="#38bdf8" stroke-width="2" marker-end="url(#mCyan)" class="flow-path-fast">
    <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.2s" repeatCount="indefinite" />
  </path>

  <!-- 2. Decision Box: Check L1 Cache -->
  <g transform="translate(340, 162)">
    <rect width="320" height="75" rx="12" fill="#0f2b38" stroke="#0284c7" stroke-width="2"/>
    <text x="160" y="28" text-anchor="middle" class="text-bold" font-size="14" fill="#38bdf8">STEP 1: Is entity in L1 Cache?</text>
    <text x="160" y="48" text-anchor="middle" class="text-normal" fill="#bae6fd">(Session-scoped persistence context)</text>
    <text x="160" y="65" text-anchor="middle" class="text-code" fill="#7dd3fc">entitiesByKey.get(EntityKey)</text>
  </g>

  <!-- L1 HIT Branch (Right -> Success) -->
  <path d="M 660 200 L 790 200" stroke="#34d399" stroke-width="2.5" marker-end="url(#mGreen)" class="flow-path-fast">
    <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.2s" repeatCount="indefinite" />
  </path>
  <rect x="685" y="182" width="75" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="702" y="195" class="text-bold" font-size="11" fill="#34d399">YES [HIT]</text>

  <g transform="translate(795, 165)">
    <rect width="170" height="70" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="85" y="24" text-anchor="middle" class="text-bold" font-size="13" fill="#34d399">⚡ RETURN ENTITY</text>
    <text x="85" y="42" text-anchor="middle" class="text-normal" font-size="11" fill="#d1fae5">Same object reference</text>
    <text x="85" y="58" text-anchor="middle" class="text-code" font-size="10" fill="#a7f3d0">Latency &lt; 0.01 ms (Heap)</text>
  </g>

  <!-- L1 MISS Branch (Down) -->
  <path d="M 500 237 L 500 280" stroke="#f87171" stroke-width="2" marker-end="url(#mRed)" class="flow-path-medium">
    <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.8s" repeatCount="indefinite" />
  </path>
  <rect x="508" y="248" width="85" height="18" rx="4" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="516" y="261" class="text-bold" font-size="11" fill="#fca5a5">NO [MISS]</text>

  <!-- 3. Decision: Is L2 Cache Enabled? -->
  <g transform="translate(340, 282)">
    <rect width="320" height="72" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <text x="160" y="26" text-anchor="middle" class="text-bold" font-size="14" fill="#a5b4fc">STEP 2: Is L2 Cache Configured?</text>
    <text x="160" y="46" text-anchor="middle" class="text-normal" fill="#c7d2fe">use_second_level_cache=true ?</text>
    <text x="160" y="62" text-anchor="middle" class="text-code" font-size="10" fill="#818cf8">&amp; Entity marked with @Cacheable</text>
  </g>

  <!-- L2 NOT ENABLED (Left -> Straight to DB) -->
  <path d="M 340 318 L 195 318 L 195 490" stroke="#f87171" stroke-width="2" marker-end="url(#mRed)" class="flow-path-slow">
    <animate attributeName="stroke-dashoffset" from="48" to="0" dur="2.4s" repeatCount="indefinite" />
  </path>
  <rect x="235" y="300" width="75" height="18" rx="4" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="248" y="313" class="text-bold" font-size="11" fill="#fca5a5">NO / OFF</text>

  <!-- L2 ENABLED (Down) -->
  <path d="M 500 354 L 500 395" stroke="#818cf8" stroke-width="2" marker-end="url(#mIndigo)" class="flow-path-medium">
    <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.8s" repeatCount="indefinite" />
  </path>
  <rect x="508" y="364" width="75" height="18" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="520" y="377" class="text-bold" font-size="11" fill="#a5b4fc">YES [ON]</text>

  <!-- 4. Decision: Check L2 Cache Region -->
  <g transform="translate(340, 397)">
    <rect width="320" height="72" rx="12" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
    <text x="160" y="26" text-anchor="middle" class="text-bold" font-size="14" fill="#e9d5ff">STEP 3: Is entity in L2 Cache?</text>
    <text x="160" y="46" text-anchor="middle" class="text-normal" fill="#f3e8ff">(SessionFactory shared region cache)</text>
    <text x="160" y="62" text-anchor="middle" class="text-code" font-size="10" fill="#c084fc">Look up in Ehcache / Redis region</text>
  </g>

  <!-- L2 HIT (Right -> Hydrate & Return) -->
  <path d="M 660 433 L 790 433" stroke="#34d399" stroke-width="2.5" marker-end="url(#mGreen)" class="flow-path-medium">
    <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.8s" repeatCount="indefinite" />
  </path>
  <rect x="685" y="415" width="75" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="702" y="428" class="text-bold" font-size="11" fill="#34d399">YES [HIT]</text>

  <g transform="translate(795, 398)">
    <rect width="170" height="70" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="85" y="24" text-anchor="middle" class="text-bold" font-size="12" fill="#34d399">🎉 L2 HIT → HYDRATE</text>
    <text x="85" y="42" text-anchor="middle" class="text-normal" font-size="10" fill="#d1fae5">1. Assemble into new entity</text>
    <text x="85" y="56" text-anchor="middle" class="text-normal" font-size="10" fill="#a7f3d0">2. Put in current L1 &amp; return</text>
  </g>

  <!-- L2 MISS (Down to DB) -->
  <path d="M 500 469 L 500 505" stroke="#f87171" stroke-width="2" marker-end="url(#mRed)" class="flow-path-slow">
    <animate attributeName="stroke-dashoffset" from="48" to="0" dur="2.4s" repeatCount="indefinite" />
  </path>
  <rect x="508" y="475" width="85" height="18" rx="4" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="516" y="488" class="text-bold" font-size="11" fill="#fca5a5">NO [MISS]</text>

  <!-- 5. Fallback: Database Query -->
  <g transform="translate(100, 508)">
    <rect width="800" height="140" rx="14" fill="#18181b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="800" height="30" rx="14" fill="#450a0a" opacity="0.4"/>
    <text x="20" y="21" class="text-bold" font-size="13" fill="#fca5a5">STEP 4: DATABASE ACCESS (Expensive I/O Fallback)</text>

    <!-- Sub-steps inside DB fallback -->
    <g transform="translate(20, 42)">
      <rect width="230" height="78" rx="8" fill="#27272a" stroke="#52525b" stroke-width="1"/>
      <text x="12" y="22" class="text-bold" font-size="12" fill="#f87171">A. Query Database</text>
      <text x="12" y="42" class="text-code" font-size="10" fill="#cbd5e1">SELECT * FROM users</text>
      <text x="12" y="58" class="text-code" font-size="10" fill="#cbd5e1">WHERE id = 101;</text>
      <text x="12" y="72" class="text-normal" font-size="10" fill="#94a3b8">Disk I/O + network latency</text>
    </g>

    <path d="M 260 80 L 290 80" stroke="#94a3b8" stroke-width="2" marker-end="url(#mCyan)"/>

    <g transform="translate(300, 42)">
      <rect width="220" height="78" rx="8" fill="#27272a" stroke="#52525b" stroke-width="1"/>
      <text x="12" y="22" class="text-bold" font-size="12" fill="#c084fc">B. Populate L2 Cache</text>
      <text x="12" y="42" class="text-normal" font-size="11" fill="#cbd5e1">If L2 enabled for entity:</text>
      <text x="12" y="58" class="text-code" font-size="10" fill="#e9d5ff">Store tuple in Region</text>
      <text x="12" y="72" class="text-normal" font-size="10" fill="#a1a1aa">(Ready for next session!)</text>
    </g>

    <path d="M 530 80 L 560 80" stroke="#94a3b8" stroke-width="2" marker-end="url(#mCyan)"/>

    <g transform="translate(570, 42)">
      <rect width="210" height="78" rx="8" fill="#27272a" stroke="#52525b" stroke-width="1"/>
      <text x="12" y="22" class="text-bold" font-size="12" fill="#34d399">C. Populate L1 &amp; Return</text>
      <text x="12" y="42" class="text-normal" font-size="11" fill="#cbd5e1">Bind managed entity to</text>
      <text x="12" y="58" class="text-code" font-size="10" fill="#6ee7b7">Session Persistence Context</text>
      <text x="12" y="72" class="text-bold" font-size="10" fill="#34d399">Return object to caller</text>
    </g>
  </g>
</svg>
