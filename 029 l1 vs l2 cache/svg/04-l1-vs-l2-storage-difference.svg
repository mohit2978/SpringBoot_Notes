<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="580" viewBox="0 0 1020 580">
  <defs>
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .pulse-indicator {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #f8fafc; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #94a3b8; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
      .text-normal { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .text-code { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; }
    </style>

    <linearGradient id="bgGradStorage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="l1StorageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="l2StorageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1020" height="580" rx="16" fill="url(#bgGradStorage)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <g transform="translate(40, 32)">
    <circle cx="12" cy="12" r="10" fill="#a78bfa" opacity="0.2"/>
    <circle cx="12" cy="12" r="5" fill="#a78bfa"/>
    <text x="32" y="18" class="text-title" font-size="20">Under the Hood: How Data Is Stored in L1 vs L2 Cache</text>
    <text x="32" y="38" class="text-sub">Live Managed Object References (L1) vs Disassembled Tuples &amp; Hydration (L2)</text>
  </g>

  <!-- ==================== LEFT COLUMN: L1 STORAGE ==================== -->
  <g transform="translate(40, 85)">
    <rect width="450" height="460" rx="14" fill="url(#l1StorageGrad)" stroke="#10b981" stroke-width="2"/>
    <rect width="450" height="460" rx="14" fill="none" stroke="#34d399" stroke-width="2" class="pulse-indicator"/>
    <rect x="0" y="0" width="450" height="34" rx="14" fill="#047857" opacity="0.3"/>
    <text x="18" y="23" class="text-bold" font-size="14" fill="#6ee7b7">LEVEL 1: Live Managed Entity Reference</text>
    <rect x="330" y="8" width="105" height="18" rx="9" fill="#059669" opacity="0.4"/>
    <text x="340" y="21" class="text-code" font-size="10" fill="#a7f3d0">Single Session</text>

    <!-- Content L1 -->
    <g transform="translate(20, 50)">
      <!-- JVM Heap Object card -->
      <rect width="410" height="130" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.2"/>
      <text x="16" y="24" class="text-bold" font-size="13" fill="#34d399">JVM Heap Memory: Real Java Object</text>
      <line x1="16" y1="34" x2="394" y2="34" stroke="#134e4a" stroke-width="1"/>
      
      <text x="16" y="54" class="text-code" fill="#f1f5f9">UserDetails@0x7a39d8 (Actual Instance)</text>
      <text x="26" y="74" class="text-code" fill="#a7f3d0">├── id: 101L</text>
      <text x="26" y="90" class="text-code" fill="#a7f3d0">├── name: "Alice Johnson"</text>
      <text x="26" y="106" class="text-code" fill="#a7f3d0">└── email: "alice@company.com"</text>
      <text x="26" y="122" class="text-code" font-size="10" fill="#6ee7b7">★ Dirty Checking Snapshot actively tracked</text>

      <!-- Referential Equality Block -->
      <g transform="translate(0, 145)">
        <rect width="410" height="80" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
        <text x="16" y="24" class="text-bold" font-size="12" fill="#a7f3d0">Identity Guarantee (Java Reference equality):</text>
        <text x="16" y="44" class="text-code" font-size="11" fill="#f8fafc">User u1 = session.get(User.class, 101);</text>
        <text x="16" y="60" class="text-code" font-size="11" fill="#f8fafc">User u2 = session.get(User.class, 101);</text>
        <text x="16" y="74" class="text-bold" font-size="11" fill="#34d399">assert u1 == u2; // ✅ TRUE (Exact Same Pointer!)</text>
      </g>

      <!-- Pros and Cons -->
      <g transform="translate(0, 240)">
        <text x="0" y="20" class="text-bold" font-size="12" fill="#34d399">Key Characteristics:</text>
        <text x="0" y="40" class="text-normal" fill="#e2e8f0">• Instant zero-copy memory access (nano-seconds)</text>
        <text x="0" y="58" class="text-normal" fill="#e2e8f0">• Entity state changes auto-flushed during commit</text>
        <text x="0" y="76" class="text-normal" fill="#fca5a5">• CANNOT be shared across threads (not thread-safe)</text>
        <text x="0" y="94" class="text-normal" fill="#fca5a5">• Excessive entities in session cause Memory Bloat</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: L2 STORAGE ==================== -->
  <g transform="translate(530, 85)">
    <rect width="450" height="460" rx="14" fill="url(#l2StorageGrad)" stroke="#a855f7" stroke-width="2"/>
    <rect width="450" height="460" rx="14" fill="none" stroke="#c084fc" stroke-width="2" class="pulse-indicator"/>
    <rect x="0" y="0" width="450" height="34" rx="14" fill="#6b21a8" opacity="0.3"/>
    <text x="18" y="23" class="text-bold" font-size="14" fill="#e9d5ff">LEVEL 2: Dehydrated (Disassembled) State</text>
    <rect x="315" y="8" width="120" height="18" rx="9" fill="#7e22ce" opacity="0.4"/>
    <text x="325" y="21" class="text-code" font-size="10" fill="#f3e8ff">Shared Region</text>

    <!-- Content L2 -->
    <g transform="translate(20, 50)">
      <!-- Dehydrated Tuple Card -->
      <rect width="410" height="130" rx="10" fill="#0f172a" stroke="#7e22ce" stroke-width="1.2"/>
      <text x="16" y="24" class="text-bold" font-size="13" fill="#c084fc">Cache Region Entry: Serializable Tuple</text>
      <line x1="16" y1="34" x2="394" y2="34" stroke="#3b0764" stroke-width="1"/>
      
      <text x="16" y="54" class="text-code" fill="#f1f5f9">CacheKey: "UserDetails#101"</text>
      <text x="16" y="74" class="text-code" fill="#e9d5ff">Raw Value: Object[] = [</text>
      <text x="26" y="90" class="text-code" fill="#fde047">  101L, "Alice Johnson", "alice@company.com", 1L</text>
      <text x="16" y="106" class="text-code" fill="#e9d5ff">]</text>
      <text x="16" y="122" class="text-code" font-size="10" fill="#c084fc">★ Disassembled primitive values, NOT Java object!</text>

      <!-- Referential Equality Block L2 -->
      <g transform="translate(0, 145)">
        <rect width="410" height="80" rx="8" fill="#2e1065" stroke="#9333ea" stroke-width="1"/>
        <text x="16" y="24" class="text-bold" font-size="12" fill="#e9d5ff">Hydration on Read (New Object Allocated):</text>
        <text x="16" y="44" class="text-code" font-size="11" fill="#f8fafc">User uA = sessionA.get(User.class, 101);</text>
        <text x="16" y="60" class="text-code" font-size="11" fill="#f8fafc">User uB = sessionB.get(User.class, 101); // From L2</text>
        <text x="16" y="74" class="text-bold" font-size="11" fill="#f87171">assert uA == uB; // ❌ FALSE (Different Instances!)</text>
      </g>

      <!-- Pros and Cons -->
      <g transform="translate(0, 240)">
        <text x="0" y="20" class="text-bold" font-size="12" fill="#c084fc">Why Hibernate Deconstructs Data for L2:</text>
        <text x="0" y="40" class="text-normal" fill="#e2e8f0">• Prevents race conditions &amp; dirty state leaking</text>
        <text x="0" y="58" class="text-normal" fill="#e2e8f0">• Allows multi-thread safety across concurrent sessions</text>
        <text x="0" y="76" class="text-normal" fill="#e2e8f0">• Can be serialized over network to Redis / Infinispan</text>
        <text x="0" y="94" class="text-normal" fill="#fde047">• Cost: Object allocation &amp; assembly overhead on read</text>
      </g>
    </g>
  </g>
</svg>
