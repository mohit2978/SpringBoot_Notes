<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow8" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="640" rx="16" fill="url(#bgGrad8)"/>

  <!-- Title Banner -->
  <rect x="35" y="20" width="930" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow8)"/>
  <text x="55" y="54" fill="#38bdf8" font-family="Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold">Three Practical Solutions to Circular Dependencies</text>
  <text x="730" y="54" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="13">Architectural Remedies</text>

  <!-- Solution 1: Refactoring (RECOMMENDED) -->
  <rect x="35" y="90" width="295" height="525" rx="12" fill="url(#cardGrad8)" stroke="#10b981" stroke-width="2" filter="url(#shadow8)"/>
  <rect x="45" y="102" width="275" height="32" rx="6" fill="#059669"/>
  <text x="55" y="123" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">Sol 1: Code Refactoring</text>
  <rect x="225" y="108" width="90" height="20" rx="4" fill="#10b981"/>
  <text x="270" y="122" fill="#064e3b" font-family="Segoe UI, Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">BEST PRACTICE</text>

  <rect x="45" y="145" width="275" height="155" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="55" y="168" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">Extract Shared Responsibilities:</text>
  <text x="55" y="190" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; Extract common logic that</text>
  <text x="55" y="208" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">both Order and Invoice need into</text>
  <text x="55" y="226" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">a 3rd class: <tspan font-family="Consolas, monospace" fill="#a7f3d0">CommonService</tspan>.</text>
  <text x="55" y="250" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; Both Order and Invoice now</text>
  <text x="55" y="268" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">inject CommonService.</text>
  <text x="55" y="288" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">&#x2714; Cycle is cleanly broken!</text>

  <!-- Diagram inside Sol 1 -->
  <rect x="45" y="315" width="275" height="175" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <rect x="105" y="325" width="155" height="35" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
  <text x="182" y="347" fill="#34d399" font-family="Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle">CommonService</text>

  <line x1="140" y1="365" x2="95" y2="420" stroke="#38bdf8" stroke-width="2"/>
  <line x1="225" y1="365" x2="270" y2="420" stroke="#38bdf8" stroke-width="2"/>

  <rect x="55" y="425" width="85" height="35" rx="6" fill="#1f2937" stroke="#38bdf8" stroke-width="1"/>
  <text x="97" y="447" fill="#38bdf8" font-family="Consolas, monospace" font-size="11" text-anchor="middle">Order</text>

  <rect x="225" y="425" width="85" height="35" rx="6" fill="#1f2937" stroke="#38bdf8" stroke-width="1"/>
  <text x="267" y="447" fill="#38bdf8" font-family="Consolas, monospace" font-size="11" text-anchor="middle">Invoice</text>

  <text x="182" y="480" fill="#94a3b8" font-family="Segoe UI, Roboto, sans-serif" font-size="10.5" text-anchor="middle">Clean DAG (Directed Acyclic Graph)</text>

  <rect x="45" y="500" width="275" height="100" rx="8" fill="#064e3b"/>
  <text x="55" y="525" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">&#x2714; Architectural Elegance:</text>
  <text x="55" y="545" fill="#d1fae5" font-family="Segoe UI, Roboto, sans-serif" font-size="11">Solves the root design flaw.</text>
  <text x="55" y="563" fill="#d1fae5" font-family="Segoe UI, Roboto, sans-serif" font-size="11">Follows Single Responsibility</text>
  <text x="55" y="581" fill="#d1fae5" font-family="Segoe UI, Roboto, sans-serif" font-size="11">and clean separation of concerns.</text>

  <!-- Solution 2: @Lazy Annotation (QUICK FIX) -->
  <rect x="350" y="90" width="300" height="525" rx="12" fill="url(#cardGrad8)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow8)"/>
  <rect x="360" y="102" width="280" height="32" rx="6" fill="#0284c7"/>
  <text x="370" y="123" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">Sol 2: Using @Lazy Annotation</text>

  <rect x="360" y="145" width="280" height="195" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="370" y="168" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">@Component</text>
  <text x="370" y="186" fill="#f43f5e" font-family="Consolas, monospace" font-size="11">public class Invoice {</text>
  <text x="385" y="210" fill="#fbbf24" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">  @Lazy // &lt;-- Spring injects Proxy!</text>
  <text x="385" y="228" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">  @Autowired</text>
  <text x="385" y="246" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">  public Order order;</text>
  <text x="385" y="272" fill="#94a3b8" font-family="Consolas, monospace" font-size="10.5">  public Invoice() {</text>
  <text x="395" y="290" fill="#94a3b8" font-family="Consolas, monospace" font-size="10.5">    System.out.println(&quot;Invoice init&quot;);</text>
  <text x="385" y="308" fill="#94a3b8" font-family="Consolas, monospace" font-size="10.5">  }</text>
  <text x="370" y="326" fill="#f43f5e" font-family="Consolas, monospace" font-size="11">}</text>

  <rect x="360" y="350" width="280" height="250" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="370" y="375" fill="#38bdf8" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">How @Lazy Resolves Cycle:</text>
  
  <text x="370" y="400" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; Spring creates a <tspan fill="#38bdf8" font-weight="bold">CGLIB Proxy</tspan> instead</text>
  <text x="370" y="418" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">of real Order bean at startup.</text>

  <text x="370" y="442" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; Invoice is initialized with this proxy.</text>
  <text x="370" y="460" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">Real Order bean is only constructed</text>
  <text x="370" y="478" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">when a method is actually invoked.</text>

  <rect x="370" y="495" width="260" height="42" rx="5" fill="#1e293b"/>
  <text x="380" y="512" fill="#a7f3d0" font-family="Consolas, monospace" font-size="10.5">Console: Invoice init &#x2192; Order init</text>
  <text x="380" y="528" fill="#a7f3d0" font-family="Segoe UI, Roboto, sans-serif" font-size="10.5">&#x2714; Application starts successfully!</text>

  <text x="370" y="555" fill="#fbbf24" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">&#x26A0; Note:</text>
  <text x="370" y="573" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="11">Only need @Lazy on ONE of the two</text>
  <text x="370" y="591" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="11">beans. Can be used on field or setter.</text>

  <!-- Solution 3: @PostConstruct (DISCOURAGED) -->
  <rect x="670" y="90" width="295" height="525" rx="12" fill="url(#cardGrad8)" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow8)"/>
  <rect x="680" y="102" width="275" height="32" rx="6" fill="#991b1b"/>
  <text x="690" y="123" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">Sol 3: @PostConstruct</text>
  <rect x="840" y="108" width="105" height="20" rx="4" fill="#ef4444"/>
  <text x="892" y="122" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">NOT RECOMMENDED</text>

  <rect x="680" y="145" width="275" height="195" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="690" y="168" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">@Component</text>
  <text x="690" y="186" fill="#f43f5e" font-family="Consolas, monospace" font-size="11">public class Order {</text>
  <text x="705" y="206" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">  @Autowired Invoice invoice;</text>
  <text x="705" y="228" fill="#fbbf24" font-family="Consolas, monospace" font-size="11">  @PostConstruct</text>
  <text x="705" y="246" fill="#fbbf24" font-family="Consolas, monospace" font-size="11">  public void init() {</text>
  <text x="715" y="266" fill="#f87171" font-family="Consolas, monospace" font-size="11">    invoice.setOrder(this);</text>
  <text x="705" y="286" fill="#fbbf24" font-family="Consolas, monospace" font-size="11">  }</text>
  <text x="690" y="306" fill="#f43f5e" font-family="Consolas, monospace" font-size="11">}</text>

  <rect x="680" y="350" width="275" height="250" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="690" y="375" fill="#fca5a5" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">Why this is an Antipattern:</text>
  
  <text x="690" y="400" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; Invoice has an unannotated setter</text>
  <text x="690" y="418" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5"><tspan font-family="Consolas, monospace" fill="#fed7aa">setOrder()</tspan> that is manually invoked.</text>

  <text x="690" y="445" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; Manually wiring dependencies</text>
  <text x="690" y="463" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">defeats the purpose of the IoC</text>
  <text x="690" y="481" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">Container managing lifecycles.</text>

  <text x="690" y="508" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; High risk of race conditions and</text>
  <text x="690" y="526" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">uninitialized states if Invoice is used</text>
  <text x="690" y="544" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">before Order's @PostConstruct fires.</text>

  <text x="690" y="575" fill="#f87171" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">&#x27A4; Avoid in production environments!</text>
</svg>