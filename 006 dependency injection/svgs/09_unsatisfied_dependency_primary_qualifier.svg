<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow9" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="640" rx="16" fill="url(#bgGrad9)"/>

  <!-- Title Banner -->
  <rect x="35" y="20" width="930" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow9)"/>
  <text x="55" y="54" fill="#fbbf24" font-family="Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold">Unsatisfied Dependency: Ambiguity Resolution</text>
  <text x="730" y="54" fill="#38bdf8" font-family="Segoe UI, Roboto, sans-serif" font-size="13">@Primary vs @Qualifier</text>

  <!-- Problem Statement Header -->
  <rect x="35" y="90" width="930" height="150" rx="10" fill="#111827" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow9)"/>
  <rect x="50" y="102" width="310" height="25" rx="5" fill="#7f1d1d"/>
  <text x="60" y="119" fill="#fca5a5" font-family="Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="bold">THE PROBLEM: Multiple Qualifying Beans Found</text>

  <text x="50" y="145" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12">Interface <tspan font-family="Consolas, monospace" fill="#38bdf8">Order</tspan> has two beans: <tspan font-family="Consolas, monospace" fill="#6ee7b7">OnlineOrder</tspan> and <tspan font-family="Consolas, monospace" fill="#6ee7b7">OfflineOrder</tspan>. When User requests <tspan font-family="Consolas, monospace" fill="#fbbf24">@Autowired Order order</tspan>, Spring is ambiguous.</text>

  <rect x="50" y="160" width="900" height="65" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="65" y="180" fill="#fca5a5" font-family="Consolas, monospace" font-size="11" font-weight="bold">APPLICATION FAILED TO START: UnsatisfiedDependencyException:</text>
  <text x="65" y="198" fill="#fed7aa" font-family="Consolas, monospace" font-size="10.5">Error creating bean with name 'user': Unsatisfied dependency expressed through field 'order';</text>
  <text x="65" y="214" fill="#fed7aa" font-family="Consolas, monospace" font-size="10.5">nested exception: expected single matching bean but found 2: onlineOrder, offlineOrder</text>

  <!-- Solution 1: @Primary -->
  <rect x="35" y="255" width="455" height="360" rx="12" fill="url(#cardGrad9)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow9)"/>
  <rect x="50" y="268" width="425" height="30" rx="6" fill="#059669"/>
  <text x="60" y="288" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">Solution 1: @Primary Annotation (Default Choice)</text>

  <rect x="50" y="310" width="425" height="155" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="65" y="332" fill="#34d399" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">@Primary // &lt;-- Gives precedence to this bean</text>
  <text x="65" y="352" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5">@Component</text>
  <text x="65" y="372" fill="#f43f5e" font-family="Consolas, monospace" font-size="11.5">public class OnlineOrder implements Order {</text>
  <text x="85" y="392" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">  public OnlineOrder() { System.out.println(&quot;Online init&quot;); }</text>
  <text x="65" y="412" fill="#f43f5e" font-family="Consolas, monospace" font-size="11.5">}</text>
  <text x="65" y="435" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">// User simply uses @Autowired Order order without qualifier</text>
  <text x="65" y="453" fill="#34d399" font-family="Consolas, monospace" font-size="11">&#x2714; Spring automatically selects OnlineOrder as primary!</text>

  <text x="50" y="488" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="12"><tspan font-weight="bold" fill="#34d399">When to use @Primary:</tspan></text>
  <text x="50" y="510" fill="#94a3b8" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; When one implementation is the standard / default choice across the app.</text>
  <text x="50" y="530" fill="#94a3b8" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; Consumers don't need to specify annotations on injection points.</text>
  <text x="50" y="555" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">&#x2714; Cleanest when a single default exists.</text>

  <!-- Solution 2: @Qualifier -->
  <rect x="510" y="255" width="455" height="360" rx="12" fill="url(#cardGrad9)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow9)"/>
  <rect x="525" y="268" width="425" height="30" rx="6" fill="#0284c7"/>
  <text x="535" y="288" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">Solution 2: @Qualifier Annotation (Explicit Choice)</text>

  <rect x="525" y="310" width="425" height="155" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="540" y="332" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">@Component public class User {</text>
  <text x="555" y="352" fill="#fbbf24" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">  @Qualifier(&quot;offlineOrderName&quot;) // Exact target</text>
  <text x="555" y="372" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5">  @Autowired private Order order;</text>
  <text x="540" y="392" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">}</text>
  <text x="540" y="415" fill="#fbbf24" font-family="Consolas, monospace" font-size="11">@Component @Qualifier(&quot;offlineOrderName&quot;)</text>
  <text x="540" y="435" fill="#f43f5e" font-family="Consolas, monospace" font-size="11">public class OfflineOrder implements Order { ... }</text>
  <text x="540" y="453" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">&#x2714; Precision match: Injects OfflineOrder exactly!</text>

  <text x="525" y="488" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="12"><tspan font-weight="bold" fill="#38bdf8">When to use @Qualifier:</tspan></text>
  <text x="525" y="510" fill="#94a3b8" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; When different consumer beans need different implementations.</text>
  <text x="525" y="530" fill="#94a3b8" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; Overrules @Primary if both are present in context.</text>
  <text x="525" y="555" fill="#38bdf8" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">&#x2714; Complete granular control over injection targets.</text>
</svg>