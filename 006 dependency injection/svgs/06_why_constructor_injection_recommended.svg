<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="warnRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow6" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="640" rx="16" fill="url(#bgGrad6)"/>

  <!-- Title Banner -->
  <rect x="35" y="20" width="930" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow6)"/>
  <text x="55" y="54" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold">Why Constructor Injection is the Industry Gold Standard</text>
  <text x="730" y="54" fill="#fbbf24" font-family="Segoe UI, Roboto, sans-serif" font-size="13">Best Practice Architecture</text>

  <!-- 4 Pillars Grid (2x2) -->
  <!-- Pillar 1: Guaranteed Initialization & No NPE -->
  <rect x="35" y="90" width="455" height="230" rx="10" fill="url(#cardGrad6)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow6)"/>
  <rect x="50" y="105" width="425" height="28" rx="5" fill="#065f46"/>
  <text x="60" y="124" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">1. Guaranteed 100% Complete Initialization</text>
  
  <text x="50" y="152" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; Object cannot be instantiated without passing its mandatory dependencies.</text>
  <text x="50" y="172" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; Completely prevents <tspan fill="#fca5a5" font-weight="bold">NullPointerException (NPE)</tspan> at runtime.</text>
  <text x="50" y="192" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; Eliminates the need for defensive, boilerplate <tspan font-family="Consolas, monospace" fill="#fed7aa">if (order == null)</tspan> checks.</text>
  
  <rect x="50" y="210" width="425" height="95" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="60" y="230" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">@Component public class User {</text>
  <text x="75" y="250" fill="#34d399" font-family="Consolas, monospace" font-size="11">  private final Order order; // 100% guaranteed non-null</text>
  <text x="75" y="270" fill="#6ee7b7" font-family="Consolas, monospace" font-size="11">  public User(Order order) { this.order = order; }</text>
  <text x="60" y="290" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">}</text>

  <!-- Pillar 2: True Immutability with final fields -->
  <rect x="510" y="90" width="455" height="230" rx="10" fill="url(#cardGrad6)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow6)"/>
  <rect x="525" y="105" width="425" height="28" rx="5" fill="#065f46"/>
  <text x="535" y="124" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">2. Enforces Thread-Safe Immutability</text>
  
  <text x="525" y="152" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; Allows dependency fields to be declared as <tspan fill="#34d399" font-family="Consolas, monospace" font-weight="bold">final</tspan>.</text>
  <text x="525" y="172" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; Thread-safe by design: state cannot be altered or re-injected after creation.</text>
  <text x="525" y="192" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; Field &amp; Setter injection cannot use <tspan font-family="Consolas, monospace" fill="#fca5a5">final</tspan> (reflection &amp; setters require mutability).</text>

  <rect x="525" y="210" width="425" height="95" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="535" y="230" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">// Thread-safe &amp; completely immutable</text>
  <text x="535" y="250" fill="#34d399" font-family="Consolas, monospace" font-size="11" font-weight="bold">public final Order order;</text>
  <text x="535" y="270" fill="#6ee7b7" font-family="Consolas, monospace" font-size="11">public final Invoice invoice;</text>
  <text x="535" y="290" fill="#a7f3d0" font-family="Consolas, monospace" font-size="11">&#x2714; Impossible to corrupt bean reference in concurrent traffic!</text>

  <!-- Pillar 3: Fail-Fast at Startup -->
  <rect x="35" y="335" width="455" height="175" rx="10" fill="url(#cardGrad6)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow6)"/>
  <rect x="50" y="348" width="425" height="28" rx="5" fill="#065f46"/>
  <text x="60" y="367" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">3. Fail-Fast at Application Startup</text>

  <text x="50" y="395" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; If a required dependency bean is missing, Spring refuses to start immediately.</text>
  <text x="50" y="415" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; Prevents delayed failures where missing beans crash servers hours into runtime.</text>

  <rect x="50" y="428" width="425" height="70" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="60" y="448" fill="#fca5a5" font-family="Consolas, monospace" font-size="10.5">APPLICATION FAILED TO START:</text>
  <text x="60" y="466" fill="#fed7aa" font-family="Consolas, monospace" font-size="10">Parameter 0 of constructor in User required a bean of type</text>
  <text x="60" y="484" fill="#fed7aa" font-family="Consolas, monospace" font-size="10">'Order' that could not be found. &#x27A4; Caught instantly!</text>

  <!-- Pillar 4: Frictionless Unit Testing -->
  <rect x="510" y="335" width="455" height="175" rx="10" fill="url(#cardGrad6)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow6)"/>
  <rect x="525" y="348" width="425" height="28" rx="5" fill="#065f46"/>
  <text x="535" y="367" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">4. Clean, Pure POJO Unit Testing</text>

  <text x="525" y="395" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; No Spring container, no Mockito reflection runners, no @InjectMocks magic.</text>
  <text x="525" y="415" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; Fast, isolated, standard unit tests run in milliseconds.</text>

  <rect x="525" y="428" width="425" height="70" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="535" y="448" fill="#38bdf8" font-family="Consolas, monospace" font-size="10.5">Order mockOrder = Mockito.mock(Order.class);</text>
  <text x="535" y="468" fill="#6ee7b7" font-family="Consolas, monospace" font-size="10.5" font-weight="bold">User user = new User(mockOrder); // Direct instantiation!</text>
  <text x="535" y="488" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">&#x2714; Zero framework magic or reflection overhead.</text>

  <!-- Bottom Banner: The Built-in Code Smell Warning -->
  <rect x="35" y="525" width="930" height="95" rx="10" fill="#18181b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow6)"/>
  <rect x="50" y="538" width="260" height="26" rx="5" fill="url(#goldGrad)"/>
  <text x="60" y="556" fill="#000000" font-family="Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="bold">&#x26A0; Built-in Code Smell Alarm (SRP)</text>

  <text x="50" y="582" fill="#fde68a" font-family="Segoe UI, Roboto, sans-serif" font-size="12.5"><tspan font-weight="bold">When Constructor has too many arguments (e.g. 7-10 dependencies):</tspan> It is an immediate, visible warning that</text>
  <text x="50" y="604" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12">your class is doing too much and violates the <tspan font-weight="bold" fill="#38bdf8">Single Responsibility Principle (SRP)</tspan>. Field injection hides this mess!</text>
</svg>