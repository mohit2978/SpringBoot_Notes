<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow10" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="600" rx="16" fill="url(#bgGrad10)"/>

  <!-- Title Banner -->
  <rect x="35" y="20" width="930" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow10)"/>
  <text x="55" y="54" fill="#38bdf8" font-family="Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold">Comprehensive Comparison Matrix: DI Approaches in Spring Boot</text>
  <text x="770" y="54" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="13">Executive Summary</text>

  <!-- Table Container -->
  <rect x="35" y="90" width="930" height="480" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" filter="url(#shadow10)"/>

  <!-- Table Header Row -->
  <rect x="35" y="90" width="930" height="50" rx="12" fill="#1f2937"/>
  <text x="60" y="122" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">Evaluation Criteria</text>
  <text x="280" y="122" fill="#f87171" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">Field Injection</text>
  <text x="510" y="122" fill="#fbbf24" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">Setter Injection</text>
  <text x="740" y="122" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">Constructor Injection</text>

  <!-- Row 1: Reflection Used? -->
  <rect x="35" y="140" width="930" height="55" fill="#1e293b"/>
  <text x="60" y="172" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="bold">Uses Reflection API?</text>
  <text x="280" y="172" fill="#f87171" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2718; Yes (setAccessible on fields)</text>
  <text x="510" y="172" fill="#fbbf24" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x26A0; Yes (invokes setter methods)</text>
  <text x="740" y="172" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">&#x2714; NO Reflection Used (Direct)</text>

  <!-- Row 2: Immutability (final fields) -->
  <rect x="35" y="195" width="930" height="55" fill="#111827"/>
  <text x="60" y="227" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="bold">Supports `final` (Immutable)?</text>
  <text x="280" y="227" fill="#f87171" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2718; NO (Compilation error)</text>
  <text x="510" y="227" fill="#f87171" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2718; NO (Fields must be mutable)</text>
  <text x="740" y="227" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">&#x2714; YES (Full final field support)</text>

  <!-- Row 3: NPE Risk outside Spring -->
  <rect x="35" y="250" width="930" height="55" fill="#1e293b"/>
  <text x="60" y="282" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="bold">Risk of Runtime NPE?</text>
  <text x="280" y="282" fill="#f87171" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2718; High (Null when called manually)</text>
  <text x="510" y="282" fill="#fbbf24" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x26A0; Medium (If setter not invoked)</text>
  <text x="740" y="282" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">&#x2714; ZERO (Mandatory on ctor)</text>

  <!-- Row 4: Unit Testing Ease -->
  <rect x="35" y="305" width="930" height="55" fill="#111827"/>
  <text x="60" y="337" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="bold">Unit Testing Experience</text>
  <text x="280" y="337" fill="#f87171" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2718; Hard (Requires @InjectMocks)</text>
  <text x="510" y="337" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2714; Easy (Pass mock into setter)</text>
  <text x="740" y="337" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">&#x2714; Easiest (Pure POJO new User(m))</text>

  <!-- Row 5: Fail-Fast Safety -->
  <rect x="35" y="360" width="930" height="55" fill="#1e293b"/>
  <text x="60" y="392" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="bold">Fail-Fast Reliability</text>
  <text x="280" y="392" fill="#f87171" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2718; Weak (Fails late during usage)</text>
  <text x="510" y="392" fill="#fbbf24" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x26A0; Partial (Fails after instantiation)</text>
  <text x="740" y="392" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">&#x2714; Instant (Fails at startup)</text>

  <!-- Row 6: Industry Adoption / Status -->
  <rect x="35" y="415" width="930" height="65" fill="#111827"/>
  <text x="60" y="452" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">Industry Status</text>
  
  <rect x="275" y="428" width="130" height="36" rx="6" fill="#7f1d1d"/>
  <text x="340" y="451" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">DISCOURAGED</text>

  <rect x="505" y="428" width="130" height="36" rx="6" fill="#78350f"/>
  <text x="570" y="451" fill="#fef3c7" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">OPTIONAL ONLY</text>

  <rect x="735" y="428" width="170" height="36" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
  <text x="820" y="451" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">&#x2B50; GOLD STANDARD</text>

  <!-- Bottom Final Takeaway -->
  <rect x="35" y="495" width="930" height="75" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="60" y="525" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">Official Spring Recommendation:</text>
  <text x="60" y="548" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="12">Always use <tspan font-weight="bold" fill="#ffffff">Constructor Injection</tspan> for mandatory dependencies and immutability. Use Setter Injection only for optional or reconfigurable dependencies. Avoid Field Injection.</text>
</svg>