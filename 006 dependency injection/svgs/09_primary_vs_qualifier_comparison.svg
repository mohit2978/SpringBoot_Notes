<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primaryCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f291e"/>
    </linearGradient>
    <linearGradient id="qualifierCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="goldBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadowP" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="680" rx="16" fill="url(#bgGradP)"/>

  <!-- Title Banner -->
  <rect x="35" y="18" width="930" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadowP)"/>
  <text x="55" y="52" fill="#38bdf8" font-family="Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold">@Primary vs @Qualifier: Resolving Bean Ambiguity</text>
  <text x="730" y="52" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="13">Spring Boot DI Strategy</text>

  <!-- Precedence Battle Banner -->
  <rect x="35" y="85" width="930" height="42" rx="8" fill="url(#goldBanner)" filter="url(#shadowP)"/>
  <text x="500" y="111" fill="#000000" font-family="Segoe UI, Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">&#x26A1; PRECEDENCE RULE: @Qualifier ALWAYS wins over @Primary when both are present!</text>

  <!-- LEFT CARD: @Primary -->
  <rect x="35" y="140" width="455" height="340" rx="12" fill="url(#primaryCardGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadowP)"/>
  <rect x="48" y="152" width="429" height="30" rx="6" fill="#059669"/>
  <text x="60" y="172" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="bold">@Primary (Default Fallback Bean)</text>

  <!-- Code snippet for @Primary -->
  <rect x="48" y="192" width="429" height="150" rx="8" fill="#090d16" stroke="#059669" stroke-width="1"/>
  <text x="60" y="214" fill="#34d399" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">@Primary // &lt;-- Applied on Bean Definition</text>
  <text x="60" y="232" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5">@Component</text>
  <text x="60" y="250" fill="#f43f5e" font-family="Consolas, monospace" font-size="11.5">public class OnlineOrder implements Order { ... }</text>
  
  <text x="60" y="278" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">// Caller does NOT need any qualifier annotation:</text>
  <text x="60" y="296" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5">@Autowired</text>
  <text x="60" y="314" fill="#6ee7b7" font-family="Consolas, monospace" font-size="11.5">private Order order; // Automatically gets OnlineOrder!</text>

  <text x="50" y="360" fill="#a7f3d0" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">&#x2714; How It Operates:</text>
  <text x="50" y="380" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; Designates the default implementation among candidates.</text>
  <text x="50" y="400" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; <tspan font-weight="bold" fill="#34d399">Decoupled Callers:</tspan> Consumer classes need no extra annotations.</text>
  <text x="50" y="420" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; <tspan font-weight="bold" fill="#fca5a5">Limitation:</tspan> Only ONE bean can be @Primary per interface.</text>
  <text x="50" y="440" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; <tspan font-weight="bold" fill="#a7f3d0">Best Use Case:</tspan> Standard default bean (used across 90% of app).</text>

  <!-- RIGHT CARD: @Qualifier -->
  <rect x="510" y="140" width="455" height="340" rx="12" fill="url(#qualifierCardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadowP)"/>
  <rect x="523" y="152" width="429" height="30" rx="6" fill="#0284c7"/>
  <text x="535" y="172" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="bold">@Qualifier (Explicit Specific Bean)</text>

  <!-- Code snippet for @Qualifier -->
  <rect x="523" y="192" width="429" height="150" rx="8" fill="#090d16" stroke="#0284c7" stroke-width="1"/>
  <text x="535" y="214" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5">@Component</text>
  <text x="535" y="232" fill="#fbbf24" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">@Qualifier(&quot;offlineOrderName&quot;)</text>
  <text x="535" y="250" fill="#f43f5e" font-family="Consolas, monospace" font-size="11.5">public class OfflineOrder implements Order { ... }</text>

  <text x="535" y="278" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">// Caller explicitly names desired bean:</text>
  <text x="535" y="296" fill="#fbbf24" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">@Qualifier(&quot;offlineOrderName&quot;)</text>
  <text x="535" y="314" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5">@Autowired private Order order; // Injects OfflineOrder!</text>

  <text x="525" y="360" fill="#bae6fd" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">&#x2714; How It Operates:</text>
  <text x="525" y="380" fill="#f0f9ff" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; Identifies exact bean target using a unique name or token.</text>
  <text x="525" y="400" fill="#f0f9ff" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; <tspan font-weight="bold" fill="#38bdf8">Explicit Selection:</tspan> Applied at BOTH bean and injection site.</text>
  <text x="525" y="420" fill="#f0f9ff" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; <tspan font-weight="bold" fill="#fbbf24">Highest Precedence:</tspan> Bypasses @Primary if both co-exist.</text>
  <text x="525" y="440" fill="#f0f9ff" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; <tspan font-weight="bold" fill="#bae6fd">Best Use Case:</tspan> Co-existing beans where callers need specific types.</text>

  <!-- BOTTOM COMPARISON TABLE -->
  <rect x="35" y="495" width="930" height="170" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5" filter="url(#shadowP)"/>
  
  <!-- Table Header -->
  <rect x="35" y="495" width="930" height="34" rx="10" fill="#1f2937"/>
  <text x="55" y="518" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">Feature</text>
  <text x="240" y="518" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">@Primary</text>
  <text x="540" y="518" fill="#38bdf8" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">@Qualifier</text>
  <text x="800" y="518" fill="#fbbf24" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">Conflict Resolution</text>

  <!-- Row 1 -->
  <line x1="35" y1="530" x2="965" y2="530" stroke="#374151" stroke-width="1"/>
  <text x="55" y="550" fill="#94a3b8" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">Annotation Target</text>
  <text x="240" y="550" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">Class / Bean definition only</text>
  <text x="540" y="550" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">Both Class &amp; Injection site (or ctor parameter)</text>
  <text x="800" y="550" fill="#fca5a5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">Qualifier specifies target</text>

  <!-- Row 2 -->
  <line x1="35" y1="565" x2="965" y2="565" stroke="#374151" stroke-width="1"/>
  <text x="55" y="585" fill="#94a3b8" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">Caller Awareness</text>
  <text x="240" y="585" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">Transparent: Caller needs no knowledge</text>
  <text x="540" y="585" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">Explicit: Caller specifies name string</text>
  <text x="800" y="585" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">No ambiguity</text>

  <!-- Row 3 -->
  <line x1="35" y1="600" x2="965" y2="600" stroke="#374151" stroke-width="1"/>
  <text x="55" y="620" fill="#94a3b8" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">Precedence Rank</text>
  <text x="240" y="620" fill="#f87171" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">Secondary (Default baseline)</text>
  <text x="540" y="620" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">Highest (Direct Specific Match)</text>
  <text x="800" y="620" fill="#fbbf24" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">@Qualifier Overrides!</text>

  <!-- Row 4 -->
  <line x1="35" y1="635" x2="965" y2="635" stroke="#374151" stroke-width="1"/>
  <text x="55" y="655" fill="#94a3b8" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">Multiple Beans</text>
  <text x="240" y="655" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">Max 1 primary per interface type</text>
  <text x="540" y="655" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">Unlimited unique qualifier names</text>
  <text x="800" y="655" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">Safe &amp; Scalable</text>
</svg>
