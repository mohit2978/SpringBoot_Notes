<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowBlue4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="960" height="620" rx="16" fill="url(#bgGrad4)"/>

  <!-- Title Banner -->
  <rect x="35" y="20" width="890" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow4)"/>
  <text x="55" y="54" fill="#fbbf24" font-family="Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold">Setter Injection: Mechanism, Advantages &amp; Pitfalls</text>
  <text x="730" y="54" fill="#94a3b8" font-family="Segoe UI, Roboto, sans-serif" font-size="13">Spring DI Method #2</text>

  <!-- Left: Code & Execution Flow -->
  <rect x="35" y="90" width="435" height="505" rx="12" fill="url(#cardGrad4)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow4)"/>
  <rect x="50" y="105" width="405" height="30" rx="6" fill="#0284c7"/>
  <text x="65" y="125" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="bold">Code Implementation &amp; Execution</text>

  <rect x="50" y="145" width="405" height="205" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="65" y="168" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5">@Component</text>
  <text x="65" y="186" fill="#f43f5e" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">public class User {</text>
  <text x="85" y="206" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11.5">  public Order order;</text>
  <text x="85" y="226" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">  public User() { System.out.println(&quot;User init&quot;); }</text>
  <text x="85" y="250" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5">  @Autowired</text>
  <text x="85" y="268" fill="#fbbf24" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">  public void setOrder(Order order) {</text>
  <text x="105" y="288" fill="#f8fafc" font-family="Consolas, monospace" font-size="11.5">    this.order = order;</text>
  <text x="85" y="306" fill="#fbbf24" font-family="Consolas, monospace" font-size="11.5">  }</text>
  <text x="65" y="326" fill="#f43f5e" font-family="Consolas, monospace" font-size="11.5">}</text>

  <!-- Step Flow Graphic -->
  <rect x="50" y="365" width="405" height="215" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="65" y="388" fill="#38bdf8" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">Spring Internal Invocation Step-by-Step:</text>

  <rect x="65" y="405" width="375" height="35" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="75" y="427" fill="#93c5fd" font-family="Segoe UI, Roboto, sans-serif" font-size="12"><tspan font-weight="bold">Step 1:</tspan> Spring calls default constructor <tspan font-family="Consolas, monospace">new User()</tspan></text>

  <rect x="65" y="450" width="375" height="35" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="75" y="472" fill="#93c5fd" font-family="Segoe UI, Roboto, sans-serif" font-size="12"><tspan font-weight="bold">Step 2:</tspan> Spring iterates methods looking for <tspan font-family="Consolas, monospace">@Autowired</tspan></text>

  <rect x="65" y="495" width="375" height="35" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="75" y="517" fill="#93c5fd" font-family="Segoe UI, Roboto, sans-serif" font-size="12"><tspan font-weight="bold">Step 3:</tspan> Reflection invokes <tspan font-family="Consolas, monospace">setOrder(orderBean)</tspan></text>

  <rect x="65" y="540" width="375" height="30" rx="6" fill="#064e3b"/>
  <text x="75" y="560" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">&#x2714; Injected after creation, before @PostConstruct</text>

  <!-- Right: Advantages & Disadvantages -->
  <rect x="490" y="90" width="435" height="505" rx="12" fill="url(#cardGrad4)" stroke="#475569" stroke-width="1.5" filter="url(#shadow4)"/>

  <!-- Advantages Box -->
  <rect x="505" y="105" width="405" height="30" rx="6" fill="#059669"/>
  <text x="520" y="125" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="bold">Advantages of Setter Injection</text>

  <rect x="505" y="145" width="405" height="155" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="520" y="170" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">&#x2714; Runtime Reconfigurability:</text>
  <text x="535" y="190" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="12">Can change dependency after creation (e.g. switch from</text>
  <text x="535" y="208" fill="#a7f3d0" font-family="Consolas, monospace" font-size="11.5">OnlineOrder</text>
  <text x="610" y="208" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="12">to</text>
  <text x="630" y="208" fill="#a7f3d0" font-family="Consolas, monospace" font-size="11.5">OfflineOrder</text>
  <text x="710" y="208" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="12">anytime by invoking setter).</text>

  <text x="520" y="235" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">&#x2714; Simple Mocking in Unit Tests:</text>
  <text x="535" y="255" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="12">No need for Mockito reflection / @InjectMocks.</text>
  <text x="535" y="275" fill="#a7f3d0" font-family="Consolas, monospace" font-size="11.5">user.setOrder(mockOrder); // Direct and clean!</text>

  <!-- Disadvantages Box -->
  <rect x="505" y="315" width="405" height="30" rx="6" fill="#b91c1c"/>
  <text x="520" y="335" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="bold">Disadvantages &amp; Pitfalls</text>

  <rect x="505" y="355" width="405" height="225" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="520" y="380" fill="#fca5a5" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">&#x2718; Violates Immutability:</text>
  <text x="535" y="400" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="12">Fields <tspan font-weight="bold">cannot</tspan> be declared <tspan font-family="Consolas, monospace" fill="#fed7aa">final</tspan>. Objects remain mutable</text>
  <text x="535" y="418" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="12">throughout the application lifetime (concurrency hazards).</text>

  <text x="520" y="445" fill="#fca5a5" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">&#x2718; Risk of Incomplete Initialization:</text>
  <text x="535" y="465" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="12">If setter call is omitted outside Spring, object starts in</text>
  <text x="535" y="483" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="12">an incomplete / broken state, causing unexpected NPE.</text>

  <text x="520" y="510" fill="#fca5a5" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">&#x2718; Poor Readability &amp; Maintenance:</text>
  <text x="535" y="530" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="12">Developers reading class fields often miss that injection</text>
  <text x="535" y="548" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="12">happens through a setter buried below in the file.</text>
  <text x="535" y="568" fill="#fca5a5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">&#x27A4; Industry consensus: Avoid for mandatory dependencies!</text>
</svg>