<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="stepGradHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="stepGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="stepGradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowHead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1000" height="620" rx="16" fill="url(#bgGrad2)"/>

  <!-- Title Banner -->
  <rect x="40" y="24" width="920" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow2)"/>
  <text x="60" y="58" fill="#f59e0b" font-family="Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold">Spring Bean Lifecycle &amp; Dependency Injection Pipeline</text>
  <text x="730" y="58" fill="#94a3b8" font-family="Segoe UI, Roboto, sans-serif" font-size="13">Execution Sequence</text>

  <!-- Top Row 4 Stages -->
  <!-- Stage 1: App Start -->
  <rect x="40" y="115" width="180" height="90" rx="10" fill="url(#stepGrad1)" filter="url(#shadow2)"/>
  <text x="130" y="152" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Application</text>
  <text x="130" y="174" fill="#bfdbfe" font-family="Segoe UI, Roboto, sans-serif" font-size="13" text-anchor="middle">Start</text>

  <line x1="220" y1="160" x2="275" y2="160" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowHead)"/>

  <!-- Stage 2: IoC Container Started -->
  <rect x="285" y="115" width="190" height="90" rx="10" fill="url(#stepGrad2)" filter="url(#shadow2)"/>
  <text x="380" y="145" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle">IoC Container</text>
  <text x="380" y="167" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle">Started</text>
  <text x="380" y="190" fill="#bae6fd" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" text-anchor="middle">Configuration Loaded</text>

  <line x1="475" y1="160" x2="530" y2="160" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowHead)"/>

  <!-- Stage 3: Construct Bean -->
  <rect x="540" y="115" width="185" height="90" rx="10" fill="url(#stepGrad2)" filter="url(#shadow2)"/>
  <text x="632" y="148" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle">Construct Bean</text>
  <text x="632" y="172" fill="#bae6fd" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" text-anchor="middle">(Instantiate via ctor)</text>

  <line x1="725" y1="160" x2="780" y2="160" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowHead)"/>

  <!-- Stage 4: Inject Dependency (HIGHLIGHT) -->
  <rect x="790" y="110" width="170" height="100" rx="10" fill="url(#stepGradHighlight)" stroke="#fde68a" stroke-width="2" filter="url(#shadow2)"/>
  <text x="875" y="145" fill="#000000" font-family="Segoe UI, Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Inject Dependency</text>
  <text x="875" y="168" fill="#451a03" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Into Constructed</text>
  <text x="875" y="188" fill="#451a03" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Bean</text>

  <!-- Curve Down from Stage 4 to Stage 5 -->
  <path d="M 875 210 L 875 250 L 875 270" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowHead)"/>

  <!-- Bottom Row: Stage 5 to 8 (Right to Left flow) -->
  <!-- Stage 5: @PostConstruct -->
  <rect x="785" y="275" width="175" height="90" rx="10" fill="url(#stepGrad2)" filter="url(#shadow2)"/>
  <text x="872" y="315" fill="#ffffff" font-family="Consolas, monospace" font-size="14.5" font-weight="bold" text-anchor="middle">@PostConstruct</text>
  <text x="872" y="338" fill="#bae6fd" font-family="Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">Init method runs</text>

  <line x1="785" y1="320" x2="735" y2="320" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowHead)"/>

  <!-- Stage 6: Use Bean (Active) -->
  <rect x="535" y="275" width="190" height="90" rx="10" fill="url(#stepGradGreen)" stroke="#6ee7b7" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="630" y="315" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Use the Bean</text>
  <text x="630" y="338" fill="#d1fae5" font-family="Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">Servicing Requests</text>

  <line x1="535" y1="320" x2="485" y2="320" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowHead)"/>

  <!-- Stage 7: @PreDestroy -->
  <rect x="285" y="275" width="190" height="90" rx="10" fill="url(#stepGrad2)" filter="url(#shadow2)"/>
  <text x="380" y="315" fill="#ffffff" font-family="Consolas, monospace" font-size="14.5" font-weight="bold" text-anchor="middle">@PreDestroy</text>
  <text x="380" y="338" fill="#bae6fd" font-family="Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">Cleanup callbacks</text>

  <line x1="285" y1="320" x2="230" y2="320" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowHead)"/>

  <!-- Stage 8: Bean Destroyed -->
  <rect x="40" y="275" width="180" height="90" rx="10" fill="url(#stepGradRed)" filter="url(#shadow2)"/>
  <text x="130" y="315" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Bean Destroyed</text>
  <text x="130" y="338" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">Context Closed</text>

  <!-- Bottom Detailed Deep Dive Section -->
  <rect x="40" y="395" width="920" height="195" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <rect x="55" y="410" width="280" height="26" rx="5" fill="#1e293b"/>
  <text x="65" y="428" fill="#38bdf8" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">Injection Timing Deep Dive:</text>

  <!-- 3 comparison boxes at bottom -->
  <!-- Box 1: Field Injection Timing -->
  <rect x="55" y="445" width="280" height="130" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
  <text x="70" y="468" fill="#f87171" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">Field Injection</text>
  <text x="70" y="490" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; Bean instantiated with default ctor</text>
  <text x="70" y="510" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; Spring uses <tspan fill="#fca5a5" font-weight="bold">Reflection</tspan> on fields</text>
  <text x="70" y="530" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; Dependencies injected after ctor!</text>
  <text x="70" y="555" fill="#f87171" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">&#x2718; Fields cannot be final (mutable)</text>

  <!-- Box 2: Setter Injection Timing -->
  <rect x="360" y="445" width="280" height="130" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
  <text x="375" y="468" fill="#fbbf24" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">Setter Injection</text>
  <text x="375" y="490" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; Bean instantiated with default ctor</text>
  <text x="375" y="510" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; Spring calls setter via Reflection</text>
  <text x="375" y="530" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; Mutable: can be re-injected later</text>
  <text x="375" y="555" fill="#f59e0b" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">&#x26A0; Easy to miss, fields cannot be final</text>

  <!-- Box 3: Constructor Injection Timing -->
  <rect x="665" y="445" width="280" height="130" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="680" y="468" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">Constructor Injection (Best!)</text>
  <text x="680" y="490" fill="#d1fae5" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; Injected AT MOMENT of construction</text>
  <text x="680" y="510" fill="#d1fae5" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; <tspan font-weight="bold" fill="#6ee7b7">NO Reflection used</tspan> by Spring</text>
  <text x="680" y="530" fill="#d1fae5" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x2022; Fully initialized on creation (No NPE)</text>
  <text x="680" y="555" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">&#x2714; Supports `final` immutable fields!</text>
</svg>