<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2320" viewBox="0 0 1400 2320" role="img" aria-labelledby="title desc">
<title id="title">Save and read an entity through one Hibernate persistence context</title>
<desc id="desc">Eight steps separate service and repository calls, Hibernate persistence, the database INSERT and generated ID, HashMap storage, and primary-key lookup. The same Session returns the initialized managed object from its own context, so no SELECT is needed. Every arrow is labeled.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7dd3fc"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#fbbf24"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6ee7b7"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#94a3b8"/></marker></defs>
<rect width="1400" height="2320" fill="#0c1423"/>
<text x="40" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="31" fill="#f8fafc"><tspan x="40" dy="0">SAVE → STORE IN CONTEXT → READ FROM THE SAME CONTEXT</tspan></text>
<text x="40" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#e2e8f0"><tspan x="40" dy="0">Follow the numbered steps. Calls, SQL, and returned objects have separate, labeled arrows.</tspan></text>
<rect x="40" y="131" width="1320" height="135" rx="14" fill="#142e35" stroke="#397e84" stroke-width="2"/>
<text x="64" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#99f6e4"><tspan x="64" dy="0">ONE SHARED ENTITYMANAGER / HIBERNATE SESSION</tspan></text>
<text x="64" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e2e8f0"><tspan x="64" dy="0">Both service calls use the same persistence context in this example (Open EntityManager in View).</tspan><tspan x="64" dy="31">The repository uses the bound EntityManager; calling save() does not itself mean “create a new one”.</tspan></text>
<text x="40" y="319" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#7dd3fc"><tspan x="40" dy="0">A · SAVE A NEW USER</tspan></text>
<rect x="40" y="345" width="500" height="191" rx="14" fill="#18283c" stroke="#3a5472" stroke-width="2"/>
<text x="64" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7dd3fc"><tspan x="64" dy="0">① UserDetailsService.saveUser(user)</tspan></text>
<text x="64" y="427" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e2e8f0"><tspan x="64" dy="0">user = new UserDetails("xyx", …)</tspan><tspan x="64" dy="31">repository.save(user)</tspan><tspan x="64" dy="31">New object: id is initially null.</tspan></text>
<rect x="810" y="345" width="550" height="191" rx="14" fill="#18283c" stroke="#3a5472" stroke-width="2"/>
<text x="834" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7dd3fc"><tspan x="834" dy="0">② SimpleJpaRepository.save(user)</tspan></text>
<text x="834" y="427" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e2e8f0"><tspan x="834" dy="0">entityInformation.isNew(user) → true</tspan><tspan x="834" dy="31">entityManager.persist(user)</tspan><tspan x="834" dy="31">The existing-entity branch uses merge().</tspan></text>
<path d="M 540 442 L 804 442" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#blue)"/>
<text x="586" y="421" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#7dd3fc"><tspan x="586" dy="0">save(user)</tspan></text>
<path d="M 1090 536 V 572 H 350 V 603" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#blue)"/>
<text x="470" y="562" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#7dd3fc"><tspan x="470" dy="0">persist call → Hibernate implementation</tspan></text>
<rect x="40" y="610" width="640" height="219" rx="14" fill="#18283c" stroke="#3a5472" stroke-width="2"/>
<text x="64" y="651" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#7dd3fc"><tspan x="64" dy="0">③ SessionImpl handles persistence</tspan></text>
<text x="64" y="693" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e2e8f0"><tspan x="64" dy="0">Hibernate coordinates entity state and SQL.</tspan><tspan x="64" dy="31">This IDENTITY example inserts the new row</tspan><tspan x="64" dy="31">and obtains the generated primary key: 1.</tspan><tspan x="64" dy="31">user is managed; its id is now 1.</tspan></text>
<rect x="1050" y="610" width="310" height="219" rx="14" fill="#2d281c" stroke="#9e7b35" stroke-width="2"/>
<text x="1070" y="651" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#fbbf24"><tspan x="1070" dy="0">DATABASE</tspan></text>
<text x="1070" y="693" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0"><tspan x="1070" dy="0">user_details</tspan><tspan x="1070" dy="31">id = 1</tspan><tspan x="1070" dy="31">name = xyx</tspan><tspan x="1070" dy="31">email = xyz@…</tspan></text>
<path d="M 680 686 H 1044" stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#gold)"/>
<text x="739" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#fbbf24"><tspan x="739" dy="0">INSERT new row</tspan></text>
<path d="M 1050 778 H 686" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#blue)"/>
<text x="746" y="756" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#7dd3fc"><tspan x="746" dy="0">generated ID: 1</tspan></text>
<path d="M 350 829 V 885" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#blue)"/>
<text x="380" y="865" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#7dd3fc"><tspan x="380" dy="0">track the managed entity</tspan></text>
<rect x="40" y="893" width="1320" height="322" rx="14" fill="#122e2b" stroke="#387963" stroke-width="2"/>
<text x="64" y="935" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#6ee7b7"><tspan x="64" dy="0">④ Inside this Session: StatefulPersistenceContext</tspan></text>
<text x="64" y="975" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#e2e8f0"><tspan x="64" dy="0">JVM memory → entitiesByKey: HashMap&lt;EntityKey, EntityHolderImpl&gt;</tspan></text>
<rect x="65" y="1000" width="485" height="121" rx="14" fill="#102032" stroke="#3a5472" stroke-width="2"/>
<text x="87" y="1038" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#7dd3fc"><tspan x="87" dy="0">KEY: EntityKey</tspan></text>
<text x="87" y="1076" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e2e8f0"><tspan x="87" dy="0">Entity type: UserDetails  +  identifier: 1</tspan></text>
<rect x="865" y="1000" width="470" height="121" rx="14" fill="#102032" stroke="#3a5472" stroke-width="2"/>
<text x="887" y="1038" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#7dd3fc"><tspan x="887" dy="0">VALUE: EntityHolderImpl</tspan></text>
<text x="887" y="1076" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0"><tspan x="887" dy="0">state = INITIALIZED</tspan><tspan x="887" dy="31">entity → managed user object A</tspan></text>
<path d="M 550 1064 H 859" stroke="#6ee7b7" stroke-width="3" fill="none" marker-end="url(#green)"/>
<text x="608" y="1046" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#6ee7b7"><tspan x="608" dy="0">maps to holder</tspan></text>
<text x="65" y="1158" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e2e8f0"><tspan x="65" dy="0">Relevant bookkeeping: addEntity(key, user) → getOrInitializeEntitiesByKey() → store holder.</tspan></text>
<text x="65" y="1190" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#a9c0d8"><tspan x="65" dy="0">The cache stores a reference to a managed object, not a JSON response or a database row.</tspan></text>
<text x="40" y="1274" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#7dd3fc"><tspan x="40" dy="0">B · READ USER 1 THROUGH THE SAME ENTITYMANAGER</tspan></text>
<rect x="40" y="1300" width="570" height="178" rx="14" fill="#18283c" stroke="#3a5472" stroke-width="2"/>
<text x="64" y="1341" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#7dd3fc"><tspan x="64" dy="0">⑤ UserDetailsService.getUser(1L)</tspan></text>
<text x="64" y="1382" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e2e8f0"><tspan x="64" dy="0">repository.findById(1L)</tspan><tspan x="64" dy="31">Calls the repository's primary-key lookup.</tspan></text>
<rect x="860" y="1300" width="500" height="178" rx="14" fill="#18283c" stroke="#3a5472" stroke-width="2"/>
<text x="884" y="1341" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7dd3fc"><tspan x="884" dy="0">⑥ SimpleJpaRepository.findById(1L)</tspan></text>
<text x="884" y="1382" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0"><tspan x="884" dy="0">entityManager.find(UserDetails.class, 1L)</tspan><tspan x="884" dy="31">Delegates to the same Hibernate Session.</tspan></text>
<path d="M 610 1405 H 854" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#blue)"/>
<text x="658" y="1383" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#7dd3fc"><tspan x="658" dy="0">findById(1L)</tspan></text>
<path d="M 1105 1478 V 1514 H 365 V 1543" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#blue)"/>
<text x="507" y="1504" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#7dd3fc"><tspan x="507" dy="0">find call → check the first-level cache</tspan></text>
<rect x="40" y="1550" width="630" height="244" rx="14" fill="#18283c" stroke="#3a5472" stroke-width="2"/>
<text x="64" y="1591" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7dd3fc"><tspan x="64" dy="0">⑦ Hibernate looks up EntityKey(UserDetails, 1)</tspan></text>
<text x="64" y="1632" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e2e8f0"><tspan x="64" dy="0">StatefulPersistenceContext.getEntity(key)</tspan><tspan x="64" dy="31">holder = entitiesByKey.get(key)</tspan><tspan x="64" dy="31">If holder is initialized: return holder.entity.</tspan><tspan x="64" dy="31">The user is already present from step ④.</tspan></text>
<rect x="1000" y="1550" width="360" height="244" rx="14" fill="#122e2b" stroke="#387963" stroke-width="2"/>
<text x="1022" y="1591" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#6ee7b7"><tspan x="1022" dy="0">SAME CACHE AS STEP ④</tspan></text>
<text x="1022" y="1632" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0"><tspan x="1022" dy="0">UserDetails#1</tspan><tspan x="1022" dy="31">→ initialized holder</tspan><tspan x="1022" dy="31">→ managed object A</tspan><tspan x="1022" dy="31">No new cache is created.</tspan></text>
<path d="M 670 1655 H 994" stroke="#6ee7b7" stroke-width="3" fill="none" marker-end="url(#green)"/>
<text x="730" y="1635" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#6ee7b7"><tspan x="730" dy="0">get(key)</tspan></text>
<path d="M 1000 1752 H 676" stroke="#6ee7b7" stroke-width="3" fill="none" marker-end="url(#green)"/>
<text x="712" y="1732" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#6ee7b7"><tspan x="712" dy="0">return holder.entity</tspan></text>
<path d="M 350 1794 V 1848" stroke="#6ee7b7" stroke-width="3" fill="none" marker-end="url(#green)"/>
<text x="380" y="1828" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#6ee7b7"><tspan x="380" dy="0">cache hit → return the existing object</tspan></text>
<rect x="40" y="1855" width="1320" height="173" rx="14" fill="#142e35" stroke="#397e84" stroke-width="2"/>
<text x="64" y="1896" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#99f6e4"><tspan x="64" dy="0">⑧ Return path: Session → EntityManager.find → repository Optional → service → controller</tspan></text>
<text x="64" y="1936" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e2e8f0"><tspan x="64" dy="0">The service unwraps the Optional; the controller returns user A and Spring serializes it to JSON.</tspan><tspan x="64" dy="31">Response: { id: 1, name: "xyx", email: "xyz@conceptandcoding.com" }</tspan><tspan x="64" dy="31">SQL for this save-then-read example: 1 INSERT + 0 SELECTs.</tspan></text>
<rect x="40" y="2060" width="1320" height="143" rx="14" fill="#302819" stroke="#927239" stroke-width="2"/>
<text x="64" y="2101" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#fbbf24"><tspan x="64" dy="0">IF THE ENTITY IS ABSENT FROM THIS CONTEXT</tspan></text>
<text x="64" y="2140" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e2e8f0"><tspan x="64" dy="0">For this example without an L2 cache: lookup misses → SELECT from DB → manage the loaded entity → return it.</tspan><tspan x="64" dy="31">A second lookup in that context can then be a cache hit. A separate context has a separate first-level cache.</tspan></text>
<text x="40" y="2250" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#a9c0d8"><tspan x="40" dy="0">Blue: API calls / generated ID     •     Gold: SQL sent to DB     •     Green: cache lookup / returned entity</tspan></text>
<text x="40" y="2284" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#a9c0d8"><tspan x="40" dy="0">Simplified relevant paths; internal event processing varies by Hibernate version. Fresh database, IDENTITY ID = 1.</tspan></text>
</svg>
