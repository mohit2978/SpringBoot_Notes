<svg viewBox="0 0 950 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
<rect width="950" height="480" fill="#1e1e1e" rx="8"/>
<text x="110" y="30" fill="#e0e0e0">I see, the tight coupling lies during VERIFY process.</text>
<text x="110" y="60" fill="#e0e0e0">Client need some info, before it can decide which Verify API to invoke. For example:</text>

<rect x="25" y="85" width="400" height="145" fill="#fff" rx="3"/>
<g font-family="Consolas, monospace" font-size="12.5">
<text x="38" y="105" fill="#111">{</text>
<text x="58" y="127" fill="#a31515">"userID"<tspan fill="#111">: </tspan><tspan fill="#0451a5">"123456"</tspan><tspan fill="#111">,</tspan></text>
<text x="58" y="149" fill="#a31515">"name"<tspan fill="#111">: </tspan><tspan fill="#0451a5">"SJ"</tspan><tspan fill="#111">,</tspan></text>
<text x="58" y="171" fill="#a31515">"verifyStatus"<tspan fill="#111">: </tspan><tspan fill="#0451a5">"UNVERIFIED"</tspan><tspan fill="#111">,</tspan></text>
<text x="58" y="193" fill="#a31515">"verifyType"<tspan fill="#111">: </tspan><tspan fill="#0451a5">"SMS"</tspan><tspan fill="#111">,</tspan></text>
<text x="58" y="215" fill="#a31515">"verifyState"<tspan fill="#111">: </tspan><tspan fill="#0451a5">"NOT_YET_STARTED"</tspan></text>
</g>

<text x="470" y="105" fill="#e0e0e0">Client need to put business logic, that</text>
<g font-size="12">
<text x="470" y="140" fill="#e0e0e0">if(VerifyStatus == "UNVERIFIED")</text>
<text x="470" y="158" fill="#e0e0e0">{</text>
<text x="495" y="176" fill="#e0e0e0">if(verifyType== "SMS")</text>
<text x="495" y="194" fill="#e0e0e0">{</text>
<text x="520" y="212" fill="#e0e0e0">if(verifyState== "NOTE_YET_STARTED")</text>
<text x="520" y="230" fill="#e0e0e0">{</text>
<text x="545" y="248" fill="#e0e0e0">Call POST: /sms-verify-start</text>
<text x="520" y="266" fill="#e0e0e0">}</text>
<text x="520" y="284" fill="#e0e0e0">Else if (verifyState == "STARTED")</text>
<text x="520" y="302" fill="#e0e0e0">{</text>
<text x="545" y="320" fill="#e0e0e0">Call POST: /sms-verify-finish</text>
<text x="520" y="338" fill="#e0e0e0">}</text>
<text x="495" y="356" fill="#e0e0e0">}</text>
<text x="495" y="374" fill="#e0e0e0">Else if(verifyType == "EMAIL")</text>
<text x="495" y="392" fill="#e0e0e0">{</text>
<text x="520" y="410" fill="#e0e0e0">if(verifyState== "NOTE_YET_STARTED") { Call POST: /email-verify-start }</text>
<text x="520" y="428" fill="#e0e0e0">Else if (verifyState == "STARTED") { Call POST: /email-verify-finish }</text>
<text x="495" y="446" fill="#e0e0e0">}</text>
<text x="470" y="464" fill="#e0e0e0">}</text>
</g>
</svg>
