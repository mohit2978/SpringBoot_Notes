<svg viewBox="0 0 950 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
<rect width="950" height="300" fill="#1e1e1e" rx="8"/>
<text x="110" y="30" fill="#e0e0e0">This dependency, can be removed by HATEOAS link</text>

<rect x="25" y="55" width="500" height="210" fill="#fff" rx="3"/>
<g font-family="Consolas, monospace" font-size="11.5">
<text x="38" y="75" fill="#111">{</text>
<text x="58" y="95" fill="#a31515">"userID"<tspan fill="#111">: </tspan><tspan fill="#0451a5">"123456"</tspan><tspan fill="#111">,</tspan></text>
<text x="58" y="115" fill="#a31515">"name"<tspan fill="#111">: </tspan><tspan fill="#0451a5">"SJ"</tspan><tspan fill="#111">,</tspan></text>
<text x="58" y="135" fill="#a31515">"verifyStatus"<tspan fill="#111">: </tspan><tspan fill="#0451a5">"UNVERIFIED"</tspan><tspan fill="#111">,</tspan></text>
<text x="58" y="155" fill="#a31515">"links"<tspan fill="#111">: [</tspan></text>
<text x="78" y="175" fill="#111">{</text>
<text x="98" y="195" fill="#a31515">"rel"<tspan fill="#111">: </tspan><tspan fill="#0451a5">"verify"</tspan><tspan fill="#111">,</tspan></text>
<text x="98" y="215" fill="#a31515">"href"<tspan fill="#111">: </tspan><tspan fill="#0451a5" text-decoration="underline">"http://localhost:8080/api/sms-verify-finish/123456"</tspan><tspan fill="#111">,</tspan></text>
<text x="98" y="235" fill="#a31515">"type"<tspan fill="#111">: </tspan><tspan fill="#0451a5">"POST"</tspan></text>
<text x="78" y="252" fill="#111">}</text>
<text x="58" y="262" fill="#111">]</text>
</g>

<text x="570" y="80" fill="#e0e0e0">Now, we have achieved LOOSE COUPLING and</text>
<text x="570" y="98" fill="#e0e0e0">Client code looks like this.</text>
<text x="590" y="155" fill="#e0e0e0">if(verifyStatus == "UNVERIFIED") {</text>
<text x="615" y="190" fill="#e0e0e0">//invoke the verify URI, given in</text>
<text x="615" y="208" fill="#e0e0e0">HATEOAS link</text>
<text x="590" y="240" fill="#e0e0e0">}</text>
</svg>
