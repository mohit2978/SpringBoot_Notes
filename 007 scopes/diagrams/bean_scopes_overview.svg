<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 460" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="scopeShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1060" height="460" fill="#0b0f19" rx="14"/>
  <rect x="2" y="2" width="1056" height="456" fill="none" stroke="#1e293b" stroke-width="1.5" rx="13"/>

  <!-- Title Badge -->
  <rect x="360" y="18" width="340" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="530" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">Spring Bean Scopes (5 Core Types)</text>

  <!-- Central Split: Standard vs Web-Aware -->
  <!-- Top Root Node -->
  <rect x="440" y="80" width="180" height="44" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="530" y="107" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Spring Bean Scopes</text>

  <!-- Connecting Lines from Root to Branches -->
  <path d="M 530 124 L 530 150 L 260 150 L 260 180" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 530 150 L 800 150 L 800 180" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- ================= LEFT SECTION: Standard Scopes ================= -->
  <rect x="150" y="175" width="220" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <text x="260" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#94a3b8">Standard Core Scopes</text>

  <!-- 1. Singleton -->
  <g filter="url(#scopeShadow)">
    <rect x="40" y="225" width="200" height="175" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="55" y="238" width="80" height="22" rx="4" fill="#0369a1"/>
    <text x="95" y="253" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e0f2fe">DEFAULT</text>
    <text x="140" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#38bdf8">Singleton</text>
    <line x1="55" y1="292" x2="225" y2="292" stroke="#334155" stroke-width="1"/>
    <text x="55" y="315" font-size="11" fill="#cbd5e1">&#x2022; <tspan font-weight="700" fill="#f8fafc">1 Instance per IoC</tspan></text>
    <text x="55" y="335" font-size="11" fill="#cbd5e1">&#x2022; Eagerly initialized</text>
    <text x="55" y="355" font-size="11" fill="#cbd5e1">&#x2022; Created at startup</text>
    <text x="55" y="380" font-size="10" fill="#94a3b8">Shared by all injection points</text>
  </g>

  <!-- 2. Prototype -->
  <g filter="url(#scopeShadow)">
    <rect x="260" y="225" width="200" height="175" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.8"/>
    <rect x="275" y="238" width="70" height="22" rx="4" fill="#4338ca"/>
    <text x="310" y="253" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e0e7ff">ON-DEMAND</text>
    <text x="360" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#a5b4fc">Prototype</text>
    <line x1="275" y1="292" x2="445" y2="292" stroke="#334155" stroke-width="1"/>
    <text x="275" y="315" font-size="11" fill="#cbd5e1">&#x2022; <tspan font-weight="700" fill="#f8fafc">New Instance</tspan> per request</text>
    <text x="275" y="335" font-size="11" fill="#cbd5e1">&#x2022; Lazily initialized</text>
    <text x="275" y="355" font-size="11" fill="#cbd5e1">&#x2022; Stateful objects</text>
    <text x="275" y="380" font-size="10" fill="#f87171">Spring does NOT manage destruction</text>
  </g>


  <!-- ================= RIGHT SECTION: Web-Aware Scopes ================= -->
  <rect x="680" y="175" width="240" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <text x="800" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#94a3b8">Web-Aware Scopes (WebApplicationContext)</text>

  <!-- 3. Request -->
  <g filter="url(#scopeShadow)">
    <rect x="480" y="225" width="175" height="175" rx="10" fill="#0f172a" stroke="#4ade80" stroke-width="1.8"/>
    <rect x="495" y="238" width="65" height="22" rx="4" fill="#15803d"/>
    <text x="527" y="253" text-anchor="middle" font-size="10.5" font-weight="700" fill="#dcfce7">HTTP REQ</text>
    <text x="567" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#4ade80">Request</text>
    <line x1="495" y1="292" x2="640" y2="292" stroke="#334155" stroke-width="1"/>
    <text x="495" y="315" font-size="11" fill="#cbd5e1">&#x2022; 1 Bean per <tspan font-weight="700" fill="#4ade80">HTTP Req</tspan></text>
    <text x="495" y="335" font-size="11" fill="#cbd5e1">&#x2022; Lazily initialized</text>
    <text x="495" y="355" font-size="11" fill="#cbd5e1">&#x2022; Dies with response</text>
    <text x="495" y="380" font-size="10" fill="#94a3b8">@RequestScope</text>
  </g>

  <!-- 4. Session -->
  <g filter="url(#scopeShadow)">
    <rect x="670" y="225" width="175" height="175" rx="10" fill="#0f172a" stroke="#facc15" stroke-width="1.8"/>
    <rect x="685" y="238" width="65" height="22" rx="4" fill="#a16207"/>
    <text x="717" y="253" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fef9c3">SESSION</text>
    <text x="757" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#facc15">Session</text>
    <line x1="685" y1="292" x2="830" y2="292" stroke="#334155" stroke-width="1"/>
    <text x="685" y="315" font-size="11" fill="#cbd5e1">&#x2022; 1 Bean per <tspan font-weight="700" fill="#facc15">HTTP Session</tspan></text>
    <text x="685" y="335" font-size="11" fill="#cbd5e1">&#x2022; Lazily initialized</text>
    <text x="685" y="355" font-size="11" fill="#cbd5e1">&#x2022; Shared across user reqs</text>
    <text x="685" y="380" font-size="10" fill="#94a3b8">Dies on timeout/logout</text>
  </g>

  <!-- 5. Application -->
  <g filter="url(#scopeShadow)">
    <rect x="860" y="225" width="175" height="175" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.8"/>
    <rect x="875" y="238" width="65" height="22" rx="4" fill="#be123c"/>
    <text x="907" y="253" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffe4e6">APP WIDE</text>
    <text x="947" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#fb7185">Application</text>
    <line x1="875" y1="292" x2="1020" y2="292" stroke="#334155" stroke-width="1"/>
    <text x="875" y="315" font-size="11" fill="#cbd5e1">&#x2022; 1 Bean per <tspan font-weight="700" fill="#fb7185">ServletContext</tspan></text>
    <text x="875" y="335" font-size="11" fill="#cbd5e1">&#x2022; Shared app-wide</text>
    <text x="875" y="355" font-size="11" fill="#cbd5e1">&#x2022; Across multiple IoCs</text>
    <text x="875" y="380" font-size="10" fill="#94a3b8">Rarely used in practice</text>
  </g>

  <!-- Bottom Summary Strip -->
  <rect x="180" y="415" width="700" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="530" y="435" text-anchor="middle" font-size="11.5" fill="#cbd5e1">
    <tspan fill="#38bdf8" font-weight="700">Singleton</tspan> = 1 per IoC &#x2502; <tspan fill="#818cf8" font-weight="700">Prototype</tspan> = 1 per injection &#x2502; <tspan fill="#4ade80" font-weight="700">Request</tspan> = 1 per HTTP request &#x2502; <tspan fill="#facc15" font-weight="700">Session</tspan> = 1 per user session
  </text>
</svg>
