<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="restCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="mvcCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34d399"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="680" rx="16" fill="url(#bgGrad3)"/>

  <!-- Title Banner -->
  <rect x="35" y="20" width="930" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow3)"/>
  <text x="55" y="54" fill="#38bdf8" font-family="Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold">Under the Hood: @RestController vs @Controller</text>
  <text x="730" y="54" fill="#a78bfa" font-family="Segoe UI, Roboto, sans-serif" font-size="13">Spring MVC DispatcherServlet Pipeline</text>

  <!-- Common Incoming Request Header -->
  <rect x="35" y="88" width="930" height="58" rx="8" fill="#111827" stroke="#475569" stroke-width="1"/>
  <text x="55" y="113" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">Client Request:</text>
  <text x="160" y="113" fill="#38bdf8" font-family="Consolas, monospace" font-size="13">GET /api/get-user</text>
  <text x="320" y="113" fill="#94a3b8" font-family="Segoe UI, Roboto, sans-serif" font-size="12">&#x27A4; Enters Spring Boot <tspan font-family="Consolas, monospace" fill="#fbbf24">DispatcherServlet</tspan> &#x27A4; Routes to controller method returning <tspan font-family="Consolas, monospace" fill="#f43f5e">&quot;XYZ&quot;</tspan> or <tspan font-family="Consolas, monospace" fill="#6ee7b7">new User(&quot;XYZ&quot;, 28)</tspan></text>
  <text x="55" y="134" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">How does Spring decide between returning JSON data vs rendering an HTML web page?</text>

  <!-- LEFT PANEL: @RestController -->
  <rect x="35" y="160" width="455" height="495" rx="12" fill="url(#restCardGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="50" y="174" width="425" height="32" rx="6" fill="#059669"/>
  <text x="62" y="195" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="bold">PATH A: @RestController (REST API Data)</text>

  <!-- Code Box Left -->
  <rect x="50" y="218" width="425" height="150" rx="8" fill="#090d16" stroke="#059669" stroke-width="1"/>
  <text x="62" y="238" fill="#34d399" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">@RestController // @Controller + @ResponseBody</text>
  <text x="62" y="256" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5">@RequestMapping(&quot;/api&quot;)</text>
  <text x="62" y="274" fill="#f43f5e" font-family="Consolas, monospace" font-size="11.5">public class UserController {</text>
  <text x="78" y="294" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5">  @GetMapping(&quot;/get-user&quot;)</text>
  <text x="78" y="314" fill="#f8fafc" font-family="Consolas, monospace" font-size="11.5">  public User getUser() {</text>
  <text x="94" y="334" fill="#34d399" font-family="Consolas, monospace" font-size="11.5">    return new User(&quot;XYZ&quot;, 28);</text>
  <text x="78" y="352" fill="#f8fafc" font-family="Consolas, monospace" font-size="11.5">  }</text>
  <text x="62" y="364" fill="#f43f5e" font-family="Consolas, monospace" font-size="11.5">}</text>

  <!-- Pipeline Flow Left -->
  <rect x="50" y="380" width="425" height="165" rx="8" fill="#022c22" stroke="#047857" stroke-width="1"/>
  <text x="62" y="402" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">Internal Execution Flow:</text>

  <circle cx="70" cy="426" r="10" fill="#059669"/>
  <text x="70" y="430" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">1</text>
  <text x="88" y="430" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">Spring detects <tspan fill="#6ee7b7" font-weight="bold">@ResponseBody</tspan> on class.</text>

  <circle cx="70" cy="458" r="10" fill="#059669"/>
  <text x="70" y="462" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">2</text>
  <text x="88" y="462" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">Bypasses View Resolver entirely.</text>

  <circle cx="70" cy="490" r="10" fill="#059669"/>
  <text x="70" y="494" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">3</text>
  <text x="88" y="494" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5"><tspan fill="#38bdf8" font-family="Consolas, monospace">HttpMessageConverter</tspan> (Jackson) serializes to JSON.</text>

  <circle cx="70" cy="522" r="10" fill="#059669"/>
  <text x="70" y="526" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">4</text>
  <text x="88" y="526" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">Spring wraps in <tspan fill="#6ee7b7" font-weight="bold">ResponseEntity&lt;User&gt;</tspan> with status <tspan fill="#6ee7b7" font-weight="bold">200 OK</tspan>.</text>

  <!-- Output Box Left -->
  <rect x="50" y="555" width="425" height="85" rx="8" fill="#090d16" stroke="#10b981" stroke-width="1"/>
  <text x="62" y="575" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">&#x2714; HTTP Response Output:</text>
  <text x="62" y="595" fill="#a7f3d0" font-family="Consolas, monospace" font-size="11">Status: 200 OK  | Content-Type: application/json</text>
  <text x="62" y="618" fill="#f8fafc" font-family="Consolas, monospace" font-size="11.5">{ &quot;name&quot;: &quot;XYZ&quot;, &quot;age&quot;: 28 }</text>

  <!-- RIGHT PANEL: @Controller -->
  <rect x="510" y="160" width="455" height="495" rx="12" fill="url(#mvcCardGrad)" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="525" y="174" width="425" height="32" rx="6" fill="#991b1b"/>
  <text x="537" y="195" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="bold">PATH B: @Controller (Spring MVC View Template)</text>

  <!-- Code Box Right -->
  <rect x="525" y="218" width="425" height="150" rx="8" fill="#090d16" stroke="#991b1b" stroke-width="1"/>
  <text x="537" y="238" fill="#f87171" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">@Controller // No @ResponseBody!</text>
  <text x="537" y="256" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5">@RequestMapping(&quot;/api&quot;)</text>
  <text x="537" y="274" fill="#f43f5e" font-family="Consolas, monospace" font-size="11.5">public class UserController {</text>
  <text x="553" y="294" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5">  @GetMapping(&quot;/get-user&quot;)</text>
  <text x="553" y="314" fill="#f8fafc" font-family="Consolas, monospace" font-size="11.5">  public String getUser() {</text>
  <text x="569" y="334" fill="#f87171" font-family="Consolas, monospace" font-size="11.5">    return &quot;XYZ&quot;; // Treated as View Template name!</text>
  <text x="553" y="352" fill="#f8fafc" font-family="Consolas, monospace" font-size="11.5">  }</text>
  <text x="537" y="364" fill="#f43f5e" font-family="Consolas, monospace" font-size="11.5">}</text>

  <!-- Pipeline Flow Right -->
  <rect x="525" y="380" width="425" height="165" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="537" y="402" fill="#fca5a5" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">Internal Execution Flow:</text>

  <circle cx="545" cy="426" r="10" fill="#dc2626"/>
  <text x="545" y="430" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">1</text>
  <text x="563" y="430" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">No @ResponseBody found on method or class.</text>

  <circle cx="545" cy="458" r="10" fill="#dc2626"/>
  <text x="545" y="462" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">2</text>
  <text x="563" y="462" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">Spring hands return string &quot;XYZ&quot; to <tspan fill="#fca5a5" font-weight="bold">ViewResolver</tspan>.</text>

  <circle cx="545" cy="490" r="10" fill="#dc2626"/>
  <text x="545" y="494" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">3</text>
  <text x="563" y="494" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">Spring searches template paths for <tspan fill="#fed7aa" font-family="Consolas, monospace">XYZ.html</tspan> or <tspan fill="#fed7aa" font-family="Consolas, monospace">XYZ.jsp</tspan>.</text>

  <circle cx="545" cy="522" r="10" fill="#dc2626"/>
  <text x="545" y="526" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">4</text>
  <text x="563" y="526" fill="#fecaca" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">Template file doesn't exist &#x27A4; Throws <tspan fill="#fca5a5" font-weight="bold">404 NOT FOUND</tspan>!</text>

  <!-- Output Box Right -->
  <rect x="525" y="555" width="425" height="85" rx="8" fill="#090d16" stroke="#ef4444" stroke-width="1"/>
  <text x="537" y="575" fill="#f87171" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">&#x2718; HTTP Response Output:</text>
  <text x="537" y="595" fill="#fca5a5" font-family="Consolas, monospace" font-size="11">Status: 404 Not Found  | Error: &quot;Not Found&quot;</text>
  <text x="537" y="618" fill="#fed7aa" font-family="Consolas, monospace" font-size="10.5">path: &quot;/api/get-user&quot; (Cannot resolve view &apos;XYZ&apos;)</text>
</svg>
