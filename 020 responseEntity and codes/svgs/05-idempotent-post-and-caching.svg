<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="idempGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="proxyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#4a044e"/>
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="680" rx="16" fill="url(#bgGrad5)"/>

  <!-- Title Banner -->
  <rect x="35" y="20" width="930" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow5)"/>
  <text x="55" y="54" fill="#38bdf8" font-family="Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold">Advanced REST Architecture: Idempotent POST &amp; Reverse Proxy Gotchas</text>
  <text x="750" y="54" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="13">Production Design Patterns</text>

  <!-- LEFT PANEL: The Idempotent POST Pattern -->
  <rect x="35" y="90" width="455" height="425" rx="12" fill="url(#idempGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow5)"/>
  <rect x="50" y="104" width="425" height="30" rx="6" fill="#059669"/>
  <text x="62" y="124" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="bold">1. Idempotent POST Pattern (201 Created vs 200 OK)</text>

  <!-- Step 1: Initial POST -->
  <rect x="50" y="146" width="425" height="115" rx="8" fill="#090d16" stroke="#059669" stroke-width="1"/>
  <rect x="62" y="156" width="115" height="20" rx="4" fill="#065f46"/>
  <text x="119.5" y="170" fill="#a7f3d0" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Step 1: First Call</text>

  <text x="62" y="194" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">POST /api/users { &quot;email&quot;: &quot;alex@mail.com&quot; }</text>
  <text x="62" y="214" fill="#d1fae5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; User does not exist in DB &#x27A4; Insert new record.</text>
  <text x="62" y="234" fill="#34d399" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">&#x2714; Returns: 201 CREATED (New Resource Created)</text>

  <!-- Step 2: Duplicate POST -->
  <rect x="50" y="272" width="425" height="115" rx="8" fill="#090d16" stroke="#059669" stroke-width="1"/>
  <rect x="62" y="282" width="140" height="20" rx="4" fill="#065f46"/>
  <text x="132" y="296" fill="#a7f3d0" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Step 2: Duplicate Call</text>

  <text x="62" y="320" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">POST /api/users { &quot;email&quot;: &quot;alex@mail.com&quot; }</text>
  <text x="62" y="340" fill="#d1fae5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; Duplicate detected: User already exists in DB!</text>
  <text x="62" y="360" fill="#60a5fa" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">&#x2714; Returns: 200 OK (Do NOT create duplicate; return data)</text>

  <!-- Rule summary -->
  <rect x="50" y="398" width="425" height="102" rx="6" fill="#022c22"/>
  <text x="62" y="418" fill="#34d399" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">&#x27A4; What is Idempotency?</text>
  <text x="62" y="438" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11">Multiple identical requests produce the same side-effect as a single request.</text>
  <text x="62" y="458" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11">Standard POST is non-idempotent by default, but building idempotent POST APIs</text>
  <text x="62" y="478" fill="#a7f3d0" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="bold">with 201 on first creation and 200 on duplicate is an industry standard best practice!</text>

  <!-- RIGHT PANEL: 502 Bad Gateway Architecture -->
  <rect x="510" y="90" width="455" height="425" rx="12" fill="url(#proxyGrad)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow5)"/>
  <rect x="525" y="104" width="425" height="30" rx="6" fill="#7e22ce"/>
  <text x="537" y="124" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="bold">2. 502 Bad Gateway with Reverse Proxy (Nginx)</text>

  <!-- Architecture Flow Boxes -->
  <g transform="translate(525, 146)">
    <!-- Client Box -->
    <rect x="0" y="0" width="105" height="60" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <text x="52.5" y="26" fill="#c7d2fe" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Client</text>
    <text x="52.5" y="44" fill="#94a3b8" font-family="Consolas, monospace" font-size="10" text-anchor="middle">Browser/App</text>

    <!-- Arrow 1 -->
    <line x1="105" y1="30" x2="145" y2="30" stroke="#38bdf8" stroke-width="2"/>

    <!-- Reverse Proxy Box -->
    <rect x="150" y="0" width="125" height="60" rx="6" fill="#3b0764" stroke="#c084fc" stroke-width="1.5"/>
    <text x="212.5" y="24" fill="#e9d5ff" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Reverse Proxy</text>
    <text x="212.5" y="44" fill="#fde047" font-family="Consolas, monospace" font-size="10.5" font-weight="bold" text-anchor="middle">Nginx :80/:443</text>

    <!-- Arrow 2 Broken -->
    <line x1="275" y1="30" x2="315" y2="30" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="295" y="22" fill="#ef4444" font-family="Segoe UI, Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">&#x2718;</text>

    <!-- Spring Boot Box (Dead / Misconfigured) -->
    <rect x="320" y="0" width="105" height="60" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1.5"/>
    <text x="372.5" y="24" fill="#fca5a5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Spring Boot</text>
    <text x="372.5" y="44" fill="#fca5a5" font-family="Consolas, monospace" font-size="10" text-anchor="middle">Port :8080 (DOWN)</text>
  </g>

  <!-- Explanation of 502 -->
  <rect x="525" y="220" width="425" height="280" rx="8" fill="#1e102f" stroke="#7e22ce" stroke-width="1"/>
  <text x="537" y="242" fill="#e9d5ff" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">Why Nginx Returns 502 Bad Gateway to Client:</text>
  
  <text x="537" y="266" fill="#f5d0fe" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; Nginx receives valid client request, but cannot communicate with</text>
  <text x="537" y="284" fill="#f5d0fe" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">the upstream Spring Boot application server.</text>

  <text x="537" y="310" fill="#f5d0fe" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; <tspan font-weight="bold" fill="#fde047">Common Root Causes:</tspan></text>
  <text x="550" y="330" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="11">1. Spring Boot server crashed or is restarting (Port 8080 refused).</text>
  <text x="550" y="350" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="11">2. Nginx configuration points to wrong port or IP address.</text>
  <text x="550" y="370" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="11">3. Upstream Spring application dropped connection unexpectedly.</text>

  <rect x="537" y="390" width="400" height="95" rx="6" fill="#2e1065"/>
  <text x="548" y="410" fill="#c084fc" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">🎯 502 vs 504 Difference:</text>
  <text x="548" y="430" fill="#e9d5ff" font-family="Segoe UI, Roboto, sans-serif" font-size="11">&#x2022; <tspan font-weight="bold">502 Bad Gateway:</tspan> Immediate rejection / connection refused from upstream.</text>
  <text x="548" y="450" fill="#e9d5ff" font-family="Segoe UI, Roboto, sans-serif" font-size="11">&#x2022; <tspan font-weight="bold">504 Gateway Timeout:</tspan> Nginx connected to Spring Boot, but Spring Boot took</text>
  <text x="548" y="468" fill="#e9d5ff" font-family="Segoe UI, Roboto, sans-serif" font-size="11">longer than <tspan font-family="Consolas, monospace" fill="#fde047">proxy_read_timeout</tspan> (e.g. 60s) to return a response.</text>

  <!-- BOTTOM COMPARISON: 401 vs 403 & 400 vs 422 -->
  <rect x="35" y="528" width="930" height="135" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5" filter="url(#shadow5)"/>
  <rect x="50" y="540" width="280" height="24" rx="4" fill="#1f2937"/>
  <text x="60" y="557" fill="#fbbf24" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">Rapid Interview Diagnostics: 401 vs 403 &amp; 400 vs 422</text>

  <!-- 401 vs 403 -->
  <rect x="50" y="572" width="430" height="78" rx="6" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
  <text x="62" y="592" fill="#38bdf8" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">401 Unauthorized vs 403 Forbidden:</text>
  <text x="62" y="612" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; <tspan font-weight="bold" fill="#fca5a5">401 (Authentication):</tspan> &quot;Who are you?&quot; Missing or expired JWT token.</text>
  <text x="62" y="632" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; <tspan font-weight="bold" fill="#fca5a5">403 (Authorization):</tspan> &quot;I know who you are, but you don't have permission!&quot;</text>

  <!-- 400 vs 422 -->
  <rect x="505" y="572" width="445" height="78" rx="6" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
  <text x="517" y="592" fill="#38bdf8" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">400 Bad Request vs 422 Unprocessable Entity:</text>
  <text x="517" y="612" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; <tspan font-weight="bold" fill="#fca5a5">400 (Syntactic):</tspan> Malformed JSON, missing mandatory HTTP header.</text>
  <text x="517" y="632" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; <tspan font-weight="bold" fill="#fca5a5">422 (Semantic):</tspan> JSON syntax is 100% valid, but business validation failed.</text>
</svg>
