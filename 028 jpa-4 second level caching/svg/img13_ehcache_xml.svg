<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="710" viewBox="0 0 1050 710">
  <defs>
    <marker id="arr13-green" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#a6e3a1"/>
    </marker>
    <marker id="arr13-blue" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#89b4fa"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1050" height="710" fill="#1e1e2e" rx="14"/>

  <!-- ==================== TOP SECTION: ENTITY 1 (UserDetails) ==================== -->
  <rect x="30" y="20" width="480" height="295" rx="10" fill="#181825" stroke="#313244" stroke-width="1.5"/>

  <!-- Window Bar 1 -->
  <path d="M 30 28 A 8 8 0 0 1 38 20 L 502 20 A 8 8 0 0 1 510 28 L 510 50 L 30 50 Z" fill="#11111b"/>
  <circle cx="48" cy="35" r="4.5" fill="#f38ba8"/>
  <circle cx="62" cy="35" r="4.5" fill="#f9e2af"/>
  <circle cx="76" cy="35" r="4.5" fill="#a6e3a1"/>
  <text x="94" y="39" font-family="monospace" font-size="11" fill="#cdd6f4">UserDetails.java</text>
  <rect x="335" y="26" width="165" height="18" rx="3" fill="#1c2d25"/>
  <text x="417" y="39" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#a6e3a1">region: userDetailsCache</text>

  <!-- Code UserDetails -->
  <text x="48" y="72" font-family="monospace" font-size="11.5" fill="#cba6f7">@Entity</text>
  <text x="48" y="90" font-family="monospace" font-size="11.5" fill="#89dceb">@Cache<tspan fill="#cdd6f4">(usage = </tspan><tspan fill="#fab387">CacheConcurrencyStrategy.READ_WRITE</tspan><tspan fill="#cdd6f4">,</tspan></text>
  <rect x="110" y="96" width="175" height="20" rx="3" fill="#1c2d25" stroke="#a6e3a1" stroke-width="1"/>
  <text x="115" y="110" font-family="monospace" font-size="11.5" fill="#cdd6f4">       region = <tspan fill="#a6e3a1" font-weight="bold">"userDetailsCache"</tspan><tspan fill="#cdd6f4">)</tspan></text>
  
  <text x="48" y="130" font-family="monospace" font-size="11.5" fill="#89b4fa">public class <tspan fill="#f9e2af" font-weight="bold">UserDetails</tspan> {</text>
  <text x="68" y="148" font-family="monospace" font-size="11" fill="#cba6f7">    @Id</text>
  <text x="68" y="165" font-family="monospace" font-size="11" fill="#89dceb">    @GeneratedValue<tspan fill="#cdd6f4">(strategy = GenerationType.IDENTITY)</tspan></text>
  <text x="68" y="182" font-family="monospace" font-size="11" fill="#89b4fa">    private <tspan fill="#cdd6f4">Long</tspan> id;</text>
  <text x="68" y="200" font-family="monospace" font-size="11" fill="#89b4fa">    private <tspan fill="#cdd6f4">String</tspan> name;</text>
  <text x="68" y="218" font-family="monospace" font-size="11" fill="#89b4fa">    private <tspan fill="#cdd6f4">String</tspan> email;</text>
  <text x="68" y="238" font-family="monospace" font-size="10.5" fill="#585b70">    // Constructors, Getters and setters...</text>
  <text x="48" y="258" font-family="monospace" font-size="11.5" fill="#cdd6f4">}</text>

  <!-- Tag 1 -->
  <rect x="44" y="272" width="452" height="26" rx="4" fill="#1c2d25"/>
  <text x="270" y="289" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#a6e3a1" font-weight="bold">Mapped to: &lt;cache alias="userDetailsCache" ... /&gt;</text>


  <!-- ==================== TOP SECTION: ENTITY 2 (OrderDetails) ==================== -->
  <rect x="540" y="20" width="480" height="295" rx="10" fill="#181825" stroke="#313244" stroke-width="1.5"/>

  <!-- Window Bar 2 -->
  <path d="M 540 28 A 8 8 0 0 1 548 20 L 1012 20 A 8 8 0 0 1 1020 28 L 1020 50 L 540 50 Z" fill="#11111b"/>
  <circle cx="558" cy="35" r="4.5" fill="#f38ba8"/>
  <circle cx="572" cy="35" r="4.5" fill="#f9e2af"/>
  <circle cx="586" cy="35" r="4.5" fill="#a6e3a1"/>
  <text x="604" y="39" font-family="monospace" font-size="11" fill="#cdd6f4">OrderDetails.java</text>
  <rect x="840" y="26" width="170" height="18" rx="3" fill="#1e2238"/>
  <text x="925" y="39" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#89b4fa">region: orderDetailsCache</text>

  <!-- Code OrderDetails -->
  <text x="558" y="72" font-family="monospace" font-size="11.5" fill="#cba6f7">@Entity</text>
  <text x="558" y="90" font-family="monospace" font-size="11.5" fill="#89dceb">@Cache<tspan fill="#cdd6f4">(usage = </tspan><tspan fill="#fab387">CacheConcurrencyStrategy.READ_WRITE</tspan><tspan fill="#cdd6f4">,</tspan></text>
  <rect x="620" y="96" width="178" height="20" rx="3" fill="#1e2238" stroke="#89b4fa" stroke-width="1"/>
  <text x="625" y="110" font-family="monospace" font-size="11.5" fill="#cdd6f4">       region = <tspan fill="#89b4fa" font-weight="bold">"orderDetailsCache"</tspan><tspan fill="#cdd6f4">)</tspan></text>
  
  <text x="558" y="130" font-family="monospace" font-size="11.5" fill="#89b4fa">public class <tspan fill="#f9e2af" font-weight="bold">OrderDetails</tspan> {</text>
  <text x="578" y="148" font-family="monospace" font-size="11" fill="#cba6f7">    @Id</text>
  <text x="578" y="165" font-family="monospace" font-size="11" fill="#89dceb">    @GeneratedValue<tspan fill="#cdd6f4">(strategy = GenerationType.IDENTITY)</tspan></text>
  <text x="578" y="182" font-family="monospace" font-size="11" fill="#89b4fa">    private <tspan fill="#cdd6f4">Long</tspan> id;</text>
  <text x="578" y="200" font-family="monospace" font-size="11" fill="#89b4fa">    private <tspan fill="#cdd6f4">String</tspan> productName;</text>
  <text x="578" y="218" font-family="monospace" font-size="11" fill="#89b4fa">    private <tspan fill="#cdd6f4">int</tspan> quantity;</text>
  <text x="578" y="236" font-family="monospace" font-size="11" fill="#89b4fa">    private <tspan fill="#cdd6f4">double</tspan> price;</text>
  <text x="578" y="254" font-family="monospace" font-size="10.5" fill="#585b70">    // Getters and Setters...</text>
  <text x="558" y="270" font-family="monospace" font-size="11.5" fill="#cdd6f4">}</text>

  <!-- Tag 2 -->
  <rect x="554" y="272" width="452" height="26" rx="4" fill="#1e2238"/>
  <text x="780" y="289" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#89b4fa" font-weight="bold">Mapped to: &lt;cache alias="orderDetailsCache" ... /&gt;</text>


  <!-- ==================== BOTTOM SECTION: EHCACHE.XML ==================== -->
  <rect x="30" y="328" width="990" height="362" rx="10" fill="#181825" stroke="#313244" stroke-width="1.5"/>

  <!-- XML Window Header -->
  <path d="M 30 336 A 8 8 0 0 1 38 328 L 1012 328 A 8 8 0 0 1 1020 336 L 1020 364 L 30 364 Z" fill="#11111b"/>
  <circle cx="48" cy="346" r="4.5" fill="#f38ba8"/>
  <circle cx="62" cy="346" r="4.5" fill="#f9e2af"/>
  <circle cx="76" cy="346" r="4.5" fill="#a6e3a1"/>
  <text x="94" y="350" font-family="monospace" font-size="12" font-weight="bold" fill="#f9e2af">ehcache.xml</text>
  <text x="190" y="350" font-family="sans-serif" font-size="11" fill="#6c7086">(located in: src/main/resources/ehcache.xml)</text>

  <!-- Root Tag -->
  <text x="48" y="386" font-family="monospace" font-size="11" fill="#89dceb">&lt;ehcache <tspan fill="#a6adc8">xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"</tspan></text>
  <text x="48" y="402" font-family="monospace" font-size="11" fill="#a6adc8">         xsi:noNamespaceSchemaLocation="http://www.ehcache.org/ehcache.xsd"&gt;</text>

  <!-- Left XML Subcard: userDetailsCache Region -->
  <rect x="48" y="415" width="460" height="175" rx="8" fill="#11111b" stroke="#a6e3a1" stroke-width="1.2"/>
  
  <rect x="58" y="425" width="220" height="20" rx="4" fill="#1c2d25"/>
  <text x="168" y="439" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="#a6e3a1">&lt;cache alias="userDetailsCache"&gt;</text>

  <text x="65" y="465" font-family="monospace" font-size="11" fill="#89dceb">    &lt;cache <tspan fill="#cba6f7">alias</tspan>=<tspan fill="#a6e3a1">"userDetailsCache"</tspan></text>
  <text x="65" y="483" font-family="monospace" font-size="11" fill="#cba6f7">           maxElementsInMemory=<tspan fill="#a6e3a1">"100"</tspan></text>
  <text x="65" y="501" font-family="monospace" font-size="11" fill="#cba6f7">           timeToLiveSeconds=<tspan fill="#a6e3a1">"60"</tspan></text>
  <text x="65" y="519" font-family="monospace" font-size="11" fill="#cba6f7">           evictionStrategy=<tspan fill="#a6e3a1">"LIFO"</tspan><tspan fill="#89dceb"> /&gt;</tspan></text>

  <rect x="58" y="535" width="440" height="44" rx="5" fill="#181825"/>
  <text x="70" y="551" font-family="sans-serif" font-size="10.5" fill="#a6adc8">• Capacity: Max <tspan fill="#cdd6f4" font-weight="bold">100 elements</tspan> in memory</text>
  <text x="70" y="568" font-family="sans-serif" font-size="10.5" fill="#a6adc8">• TTL: <tspan fill="#cdd6f4" font-weight="bold">60s</tspan>  |  Eviction Strategy: <tspan fill="#a6e3a1" font-weight="bold">LIFO</tspan></text>


  <!-- Right XML Subcard: orderDetailsCache Region -->
  <rect x="540" y="415" width="460" height="175" rx="8" fill="#11111b" stroke="#89b4fa" stroke-width="1.2"/>

  <rect x="550" y="425" width="225" height="20" rx="4" fill="#1e2238"/>
  <text x="662" y="439" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="#89b4fa">&lt;cache alias="orderDetailsCache"&gt;</text>

  <text x="557" y="465" font-family="monospace" font-size="11" fill="#89dceb">    &lt;cache <tspan fill="#cba6f7">alias</tspan>=<tspan fill="#89b4fa">"orderDetailsCache"</tspan></text>
  <text x="557" y="483" font-family="monospace" font-size="11" fill="#cba6f7">           maxElementsInMemory=<tspan fill="#89b4fa">"1000"</tspan></text>
  <text x="557" y="501" font-family="monospace" font-size="11" fill="#cba6f7">           timeToLiveSeconds=<tspan fill="#89b4fa">"200"</tspan></text>
  <text x="557" y="519" font-family="monospace" font-size="11" fill="#cba6f7">           evictionStrategy=<tspan fill="#89b4fa">"FIFO"</tspan><tspan fill="#89dceb"> /&gt;</tspan></text>

  <rect x="550" y="535" width="440" height="44" rx="5" fill="#181825"/>
  <text x="562" y="551" font-family="sans-serif" font-size="10.5" fill="#a6adc8">• Capacity: Max <tspan fill="#cdd6f4" font-weight="bold">1000 elements</tspan> in memory</text>
  <text x="562" y="568" font-family="sans-serif" font-size="10.5" fill="#a6adc8">• TTL: <tspan fill="#cdd6f4" font-weight="bold">200s</tspan>  |  Eviction Strategy: <tspan fill="#89b4fa" font-weight="bold">FIFO</tspan></text>

  <!-- Closing XML Tag -->
  <text x="48" y="608" font-family="monospace" font-size="11" fill="#89dceb">&lt;/ehcache&gt;</text>

  <!-- Footer Takeaway Bar -->
  <rect x="48" y="630" width="952" height="44" rx="6" fill="#11111b" stroke="#313244" stroke-width="1"/>
  <text x="524" y="652" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#cdd6f4">
    <tspan fill="#f9e2af" font-weight="bold">Key Mapping: </tspan>
    The entity attribute <tspan fill="#f9e2af">@Cache(region = "...")</tspan> matches directly with <tspan fill="#89b4fa">&lt;cache alias="..."&gt;</tspan> in <tspan fill="#cdd6f4">ehcache.xml</tspan>.
  </text>
  <text x="524" y="667" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#a6adc8">
    This enables you to configure completely independent size limits, TTLs, and eviction algorithms for each table.
  </text>
</svg>
