<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420">
  <rect width="820" height="420" fill="#1e1e2e" rx="12"/>

  <!-- Title -->
  <text x="410" y="38" text-anchor="middle" font-family="monospace" font-size="13" fill="#cdd6f4">From previous video, First level caching: for each HTTP REQUEST, different EntityManager</text>
  <text x="410" y="56" text-anchor="middle" font-family="monospace" font-size="13" fill="#cdd6f4">Object (session) is created and it has its own Persistence context (1st level cache)</text>

  <!-- Row 1: 1st POST call -->
  <text x="30" y="115" font-family="monospace" font-size="13" fill="#cdd6f4">1st POST call</text>
  <line x1="130" y1="112" x2="175" y2="112" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="180" y="96" width="160" height="36" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="260" y="112" text-anchor="middle" font-family="monospace" font-size="12" fill="#cdd6f4">EntityManager Object1</text>
  <text x="260" y="127" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8">(Session 1)</text>
  <line x1="345" y1="112" x2="390" y2="112" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="395" y="96" width="170" height="36" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="480" y="112" text-anchor="middle" font-family="monospace" font-size="12" fill="#cdd6f4">Its own 1st level cache</text>
  <text x="480" y="127" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8">(PersistenceContext)</text>
  <line x1="570" y1="112" x2="615" y2="112" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- DB cylinder -->
  <ellipse cx="650" cy="104" rx="28" ry="9" fill="#45475a" stroke="#89b4fa" stroke-width="1.5"/>
  <rect x="622" y="104" width="56" height="22" fill="#45475a" stroke="#89b4fa" stroke-width="1.5"/>
  <ellipse cx="650" cy="126" rx="28" ry="9" fill="#585b70" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="650" y="120" text-anchor="middle" font-family="monospace" font-size="12" fill="#cdd6f4">DB</text>

  <!-- Row 2: 2nd Get call -->
  <text x="30" y="215" font-family="monospace" font-size="13" fill="#cdd6f4">2nd Get call</text>
  <line x1="130" y1="212" x2="175" y2="212" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="180" y="196" width="160" height="36" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="260" y="212" text-anchor="middle" font-family="monospace" font-size="12" fill="#cdd6f4">EntityManager Object2</text>
  <text x="260" y="227" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8">(Session 2)</text>
  <line x1="345" y1="212" x2="390" y2="212" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="395" y="196" width="170" height="36" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="480" y="212" text-anchor="middle" font-family="monospace" font-size="12" fill="#cdd6f4">Its own 1st level cache</text>
  <text x="480" y="227" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8">(PersistenceContext)</text>
  <line x1="570" y1="212" x2="615" y2="212" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>
  <ellipse cx="650" cy="204" rx="28" ry="9" fill="#45475a" stroke="#89b4fa" stroke-width="1.5"/>
  <rect x="622" y="204" width="56" height="22" fill="#45475a" stroke="#89b4fa" stroke-width="1.5"/>
  <ellipse cx="650" cy="226" rx="28" ry="9" fill="#585b70" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="650" y="220" text-anchor="middle" font-family="monospace" font-size="12" fill="#cdd6f4">DB</text>

  <!-- Row 3: 3rd Get call -->
  <text x="30" y="315" font-family="monospace" font-size="13" fill="#cdd6f4">3rd Get Call</text>
  <line x1="130" y1="312" x2="175" y2="312" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="180" y="296" width="160" height="36" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="260" y="312" text-anchor="middle" font-family="monospace" font-size="12" fill="#cdd6f4">EntityManager Object3</text>
  <text x="260" y="327" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8">(Session 3)</text>
  <line x1="345" y1="312" x2="390" y2="312" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="395" y="296" width="170" height="36" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="480" y="312" text-anchor="middle" font-family="monospace" font-size="12" fill="#cdd6f4">Its own 1st level cache</text>
  <text x="480" y="327" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8">(PersistenceContext)</text>
  <line x1="570" y1="312" x2="615" y2="312" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>
  <ellipse cx="650" cy="304" rx="28" ry="9" fill="#45475a" stroke="#89b4fa" stroke-width="1.5"/>
  <rect x="622" y="304" width="56" height="22" fill="#45475a" stroke="#89b4fa" stroke-width="1.5"/>
  <ellipse cx="650" cy="326" rx="28" ry="9" fill="#585b70" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="650" y="320" text-anchor="middle" font-family="monospace" font-size="12" fill="#cdd6f4">DB</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#89b4fa"/>
    </marker>
  </defs>
</svg>
