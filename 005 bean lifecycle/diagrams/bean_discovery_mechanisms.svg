<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 440" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadowDisc" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1020" height="440" fill="#0b0f19" rx="14"/>
  <rect x="2" y="2" width="1016" height="436" fill="none" stroke="#1e293b" stroke-width="1.5" rx="13"/>

  <!-- Title Badge -->
  <rect x="290" y="18" width="440" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="510" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">How Spring Boot Finds Beans</text>

  <!-- Left: Mechanism 1 @ComponentScan -->
  <g filter="url(#shadowDisc)">
    <rect x="40" y="80" width="440" height="320" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/>
  </g>
  <rect x="60" y="95" width="230" height="28" rx="6" fill="#0284c7"/>
  <text x="175" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1. @ComponentScan</text>

  <rect x="60" y="135" width="400" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="75" y="160" font-size="12" font-weight="600" fill="#38bdf8">&#x2022; Automatic Package Scanning:</text>
  <text x="75" y="180" font-size="11" fill="#94a3b8">Starts at package where <tspan fill="#f8fafc">@SpringBootApplication</tspan> lives</text>
  <text x="75" y="198" font-size="11" fill="#94a3b8">and scans down through all sub-packages automatically.</text>

  <rect x="60" y="230" width="400" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="75" y="255" font-size="12" font-weight="600" fill="#4ade80">&#x2714; Auto-Detects Stereotypes:</text>
  <text x="90" y="280" font-size="11.5" fill="#cbd5e1">&#x25AA; <tspan font-weight="700" fill="#38bdf8">@Component</tspan> (Base stereotype)</text>
  <text x="90" y="302" font-size="11.5" fill="#cbd5e1">&#x25AA; <tspan font-weight="700" fill="#818cf8">@Service</tspan> (Business logic layer)</text>
  <text x="90" y="324" font-size="11.5" fill="#cbd5e1">&#x25AA; <tspan font-weight="700" fill="#fbbf24">@Repository</tspan> (Data access layer)</text>
  <text x="90" y="346" font-size="11.5" fill="#cbd5e1">&#x25AA; <tspan font-weight="700" fill="#f43f5e">@Controller / @RestController</tspan> (Web presentation)</text>
  <text x="90" y="368" font-size="10.5" fill="#94a3b8">All these annotations contain @Component internally!</text>


  <!-- Right: Mechanism 2 @Configuration & @Bean -->
  <g filter="url(#shadowDisc)">
    <rect x="540" y="80" width="440" height="320" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.6"/>
  </g>
  <rect x="560" y="95" width="280" height="28" rx="6" fill="#6b21a8"/>
  <text x="700" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2. @Configuration &amp; @Bean</text>

  <rect x="560" y="135" width="400" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="575" y="160" font-size="12" font-weight="600" fill="#c084fc">&#x2022; Explicit Bean Definition Methods:</text>
  <text x="575" y="180" font-size="11" fill="#94a3b8">Spring scans for classes marked with <tspan fill="#f8fafc">@Configuration</tspan></text>
  <text x="575" y="198" font-size="11" fill="#94a3b8">and invokes methods marked with <tspan fill="#facc15">@Bean</tspan>.</text>

  <rect x="560" y="230" width="400" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="575" y="255" font-size="12" font-weight="600" fill="#facc15">&#x26A0; Under the Hood:</text>
  <text x="575" y="278" font-size="11.5" fill="#cbd5e1">&#x2022; @Configuration is meta-annotated with <tspan font-weight="700" fill="#38bdf8">@Component</tspan>!</text>
  <text x="575" y="300" font-size="11" fill="#94a3b8">So @ComponentScan discovers @Configuration classes first,</text>
  <text x="575" y="318" font-size="11" fill="#94a3b8">then Spring executes the @Bean methods inside them.</text>
  <text x="575" y="344" font-size="11.5" fill="#cbd5e1">&#x2022; Manages third-party library classes (cannot add @Component)</text>
  <text x="575" y="364" font-size="11" fill="#4ade80">&#x2714; Allows multiple beans of the same type</text>
</svg>
