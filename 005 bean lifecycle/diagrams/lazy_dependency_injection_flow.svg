<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 440" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#4ade80"/>
    </marker>
    <filter id="shadowLz" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1060" height="440" fill="#0b0f19" rx="14"/>
  <rect x="2" y="2" width="1056" height="436" fill="none" stroke="#1e293b" stroke-width="1.5" rx="13"/>

  <!-- Title Badge -->
  <rect x="270" y="18" width="520" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="530" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">Eager Bean with @Lazy Dependency: Instantiation Flow</text>

  <!-- Step 1: User Instantiation -->
  <g filter="url(#shadowLz)">
    <rect x="40" y="85" width="220" height="150" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="55" y="97" width="70" height="22" rx="4" fill="#0369a1"/>
    <text x="90" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#e0f2fe">STEP 1</text>
    <text x="150" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#38bdf8">User Bean (Eager)</text>
    <text x="150" y="162" text-anchor="middle" font-size="11" fill="#cbd5e1">Singleton scope</text>
    <rect x="55" y="180" width="190" height="36" rx="6" fill="#1e293b"/>
    <text x="150" y="202" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#4ade80">&quot;initializing user&quot;</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="260" y1="160" x2="315" y2="160" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrB)"/>

  <!-- Step 2: Spring Detects @Autowired Order -->
  <g filter="url(#shadowLz)">
    <rect x="325" y="85" width="230" height="150" rx="10" fill="#0f172a" stroke="#facc15" stroke-width="1.8"/>
    <rect x="340" y="97" width="70" height="22" rx="4" fill="#a16207"/>
    <text x="375" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#fef9c3">STEP 2</text>
    <text x="440" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#facc15">Dependency Check</text>
    <text x="440" y="162" text-anchor="middle" font-size="11" fill="#cbd5e1">@Autowired Order order;</text>
    <text x="440" y="182" text-anchor="middle" font-size="10" fill="#94a3b8">Spring checks IoC context</text>
    <text x="440" y="198" text-anchor="middle" font-size="10" fill="#f87171">Order not created yet!</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="555" y1="160" x2="610" y2="160" stroke="#facc15" stroke-width="2.2" marker-end="url(#arrB)"/>

  <!-- Step 3: Lazy Order Created on Demand -->
  <g filter="url(#shadowLz)">
    <rect x="620" y="85" width="240" height="150" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.8"/>
    <rect x="635" y="97" width="70" height="22" rx="4" fill="#6b21a8"/>
    <text x="670" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#f3e8ff">STEP 3</text>
    <text x="740" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#c084fc">Order Bean (@Lazy)</text>
    <text x="740" y="162" text-anchor="middle" font-size="11" fill="#cbd5e1">Forced creation now!</text>
    <rect x="635" y="180" width="210" height="36" rx="6" fill="#1e293b"/>
    <text x="740" y="202" text-anchor="middle" font-family="monospace" font-size="10" fill="#c084fc">&quot;Lazy: initializing Order&quot;</text>
  </g>

  <!-- Arrow 3 -> 4 (wraps to Step 4) -->
  <line x1="860" y1="160" x2="905" y2="160" stroke="#a855f7" stroke-width="2.2"/>
  <path d="M 905 160 C 940 160, 940 310, 905 310" fill="none" stroke="#4ade80" stroke-width="2.2"/>
  <line x1="905" y1="310" x2="865" y2="310" stroke="#4ade80" stroke-width="2.2" marker-end="url(#arrG)"/>

  <!-- Step 4: Injected & Initialized -->
  <g filter="url(#shadowLz)">
    <rect x="420" y="255" width="440" height="110" rx="10" fill="#14281e" stroke="#4ade80" stroke-width="1.8"/>
    <rect x="435" y="267" width="70" height="22" rx="4" fill="#15803d"/>
    <text x="470" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="#dcfce7">STEP 4</text>
    <text x="655" y="284" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4ade80">Dependency Injected into User</text>
    <text x="655" y="307" text-anchor="middle" font-size="11.5" fill="#cbd5e1">Spring injects Order instance into User.order field</text>
    <text x="655" y="328" text-anchor="middle" font-size="11" fill="#94a3b8">Then User's @PostConstruct methods are executed!</text>
  </g>

  <!-- Left Callout Box -->
  <rect x="40" y="255" width="350" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="60" y="282" font-size="12.5" font-weight="700" fill="#facc15">&#x26A0; Core Insight:</text>
  <text x="60" y="305" font-size="11" fill="#cbd5e1">Even though Order is marked <tspan font-family="monospace" fill="#a5b4fc">@Lazy</tspan>, because the</text>
  <text x="60" y="323" font-size="11" fill="#cbd5e1">eager singleton <tspan font-family="monospace" fill="#38bdf8">User</tspan> requires it at startup,</text>
  <text x="60" y="341" font-size="11" fill="#4ade80">Order is created during startup to satisfy User!</text>

  <!-- Bottom Timeline summary -->
  <text x="530" y="415" text-anchor="middle" font-size="11.5" fill="#64748b">
    Execution Order in Logs: User constructor &#x2192; Order constructor &#x2192; User @PostConstruct &#x2192; Application Ready
  </text>
</svg>
