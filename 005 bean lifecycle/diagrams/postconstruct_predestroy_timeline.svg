<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 400" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrTime" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#64748b"/>
    </marker>
    <filter id="timeSh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1060" height="400" fill="#0b0f19" rx="14"/>
  <rect x="2" y="2" width="1056" height="396" fill="none" stroke="#1e293b" stroke-width="1.5" rx="13"/>

  <!-- Title Badge -->
  <rect x="310" y="18" width="440" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="530" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">@PostConstruct &amp; @PreDestroy Execution Timeline</text>

  <!-- Central Horizontal Timeline Bar -->
  <line x1="60" y1="180" x2="1000" y2="180" stroke="#334155" stroke-width="4"/>

  <!-- Event 1: Bean Instantiated -->
  <circle cx="100" cy="180" r="10" fill="#38bdf8" stroke="#0f172a" stroke-width="3"/>
  <line x1="100" y1="180" x2="100" y2="120" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3,3"/>
  <g filter="url(#timeSh)">
    <rect x="20" y="55" width="160" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="100" y="78" text-anchor="middle" font-size="11.5" font-weight="700" fill="#38bdf8">1. Constructor</text>
    <text x="100" y="98" text-anchor="middle" font-size="10.5" fill="#94a3b8">new User() called</text>
  </g>

  <!-- Event 2: Dependency Injection -->
  <circle cx="280" cy="180" r="10" fill="#818cf8" stroke="#0f172a" stroke-width="3"/>
  <line x1="280" y1="180" x2="280" y2="240" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="3,3"/>
  <g filter="url(#timeSh)">
    <rect x="200" y="245" width="160" height="60" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
    <text x="280" y="268" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a5b4fc">2. @Autowired</text>
    <text x="280" y="288" text-anchor="middle" font-size="10.5" fill="#94a3b8">Dependencies injected</text>
  </g>

  <!-- Event 3: @PostConstruct -->
  <circle cx="460" cy="180" r="12" fill="#4ade80" stroke="#0f172a" stroke-width="3"/>
  <line x1="460" y1="180" x2="460" y2="120" stroke="#4ade80" stroke-width="2"/>
  <g filter="url(#timeSh)">
    <rect x="365" y="50" width="190" height="65" rx="8" fill="#14281e" stroke="#4ade80" stroke-width="1.6"/>
    <text x="460" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#4ade80">3. @PostConstruct</text>
    <text x="460" y="91" text-anchor="middle" font-size="10.5" fill="#cbd5e1">Pre-use initialization</text>
    <text x="460" y="105" text-anchor="middle" font-size="9.5" fill="#94a3b8">Warms cache / verifies state</text>
  </g>

  <!-- Event 4: Active Runtime Bean Usage -->
  <circle cx="640" cy="180" r="10" fill="#facc15" stroke="#0f172a" stroke-width="3"/>
  <line x1="640" y1="180" x2="640" y2="240" stroke="#facc15" stroke-width="1.8" stroke-dasharray="3,3"/>
  <g filter="url(#timeSh)">
    <rect x="555" y="245" width="170" height="60" rx="8" fill="#1e293b" stroke="#facc15" stroke-width="1.2"/>
    <text x="640" y="268" text-anchor="middle" font-size="11.5" font-weight="700" fill="#facc15">4. Bean in Active Use</text>
    <text x="640" y="288" text-anchor="middle" font-size="10.5" fill="#94a3b8">Processes business calls</text>
  </g>

  <!-- Event 5: context.close() & @PreDestroy -->
  <circle cx="820" cy="180" r="12" fill="#f43f5e" stroke="#0f172a" stroke-width="3"/>
  <line x1="820" y1="180" x2="820" y2="120" stroke="#f43f5e" stroke-width="2"/>
  <g filter="url(#timeSh)">
    <rect x="725" y="50" width="190" height="65" rx="8" fill="#281414" stroke="#f43f5e" stroke-width="1.6"/>
    <text x="820" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#fb7185">5. @PreDestroy</text>
    <text x="820" y="91" text-anchor="middle" font-size="10.5" fill="#cbd5e1">Pre-destruction cleanup</text>
    <text x="820" y="105" text-anchor="middle" font-size="9.5" fill="#94a3b8">Closes connections / resources</text>
  </g>

  <!-- Event 6: Bean Destroyed -->
  <circle cx="960" cy="180" r="10" fill="#64748b" stroke="#0f172a" stroke-width="3"/>
  <line x1="960" y1="180" x2="960" y2="240" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3,3"/>
  <g filter="url(#timeSh)">
    <rect x="880" y="245" width="160" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="960" y="268" text-anchor="middle" font-size="11.5" font-weight="700" fill="#94a3b8">6. Destroyed</text>
    <text x="960" y="288" text-anchor="middle" font-size="10.5" fill="#64748b">Garbage collected</text>
  </g>

  <!-- Bottom Insight -->
  <rect x="180" y="345" width="700" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="530" y="367" text-anchor="middle" font-size="11.5" fill="#cbd5e1">
    <tspan fill="#4ade80" font-weight="700">@PostConstruct</tspan> runs only AFTER all dependencies are injected &#x2502; <tspan fill="#fb7185" font-weight="700">@PreDestroy</tspan> runs right before Context terminates
  </text>
</svg>
