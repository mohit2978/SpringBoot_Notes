<svg viewBox="0 0 1040 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" font-size="13">
<rect width="1040" height="620" fill="#1e1e1e" rx="8"/>
<defs><marker id="g1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9aa3a4"/></marker></defs>

<text x="520" y="32" fill="#d4a017" font-size="18" font-weight="bold" text-anchor="middle">ThreadPoolTaskExecutor — the growth order surprises everybody</text>
<text x="520" y="54" fill="#aaa" font-size="12" text-anchor="middle">The queue fills up BEFORE the pool grows past core-size. Not the other way round.</text>

<rect x="40" y="76" width="960" height="40" rx="6" fill="#252525"/>
<text x="60" y="102" fill="#e0e0e0" font-family="Consolas, monospace" font-size="13">core-size = 5     queue-capacity = 10     max-size = 20     → a new task arrives…</text>

<!-- step 1 -->
<rect x="40" y="134" width="300" height="150" rx="8" fill="#234a3e" stroke="#4ec9b0" stroke-width="2"/>
<circle cx="72" cy="164" r="16" fill="#4ec9b0"/><text x="72" y="170" fill="#1e1e1e" text-anchor="middle" font-weight="bold">1</text>
<text x="100" y="170" fill="#9ae6d0" font-weight="bold" font-size="14">threads &lt; core-size?</text>
<text x="60" y="198" fill="#e0e0e0" font-size="12.5">YES → create a NEW thread,</text>
<text x="60" y="216" fill="#e0e0e0" font-size="12.5">even if other threads are idle.</text>
<g fill="#4ec9b0">
<rect x="60" y="234" width="38" height="20" rx="3"/><rect x="104" y="234" width="38" height="20" rx="3"/>
<rect x="148" y="234" width="38" height="20" rx="3"/><rect x="192" y="234" width="38" height="20" rx="3"/>
<rect x="236" y="234" width="38" height="20" rx="3"/>
</g>
<text x="60" y="272" fill="#aaa" font-size="11.5">pool grows 1 → 5</text>

<line x1="340" y1="208" x2="372" y2="208" stroke="#9aa3a4" stroke-width="2" marker-end="url(#g1)"/>
<text x="356" y="196" fill="#f14c4c" font-size="11" text-anchor="middle">full</text>

<!-- step 2 -->
<rect x="376" y="134" width="300" height="150" rx="8" fill="#4a3a1a" stroke="#d4a017" stroke-width="2"/>
<circle cx="408" cy="164" r="16" fill="#d4a017"/><text x="408" y="170" fill="#1e1e1e" text-anchor="middle" font-weight="bold">2</text>
<text x="436" y="170" fill="#f0d68a" font-weight="bold" font-size="14">queue has room?</text>
<text x="396" y="198" fill="#e0e0e0" font-size="12.5">YES → QUEUE the task.</text>
<text x="396" y="216" fill="#f14c4c" font-size="12.5">Pool does NOT grow here.</text>
<g fill="#d4a017">
<rect x="396" y="234" width="24" height="20" rx="3"/><rect x="424" y="234" width="24" height="20" rx="3"/>
<rect x="452" y="234" width="24" height="20" rx="3"/><rect x="480" y="234" width="24" height="20" rx="3"/>
<rect x="508" y="234" width="24" height="20" rx="3"/><rect x="536" y="234" width="24" height="20" rx="3"/>
<rect x="564" y="234" width="24" height="20" rx="3"/><rect x="592" y="234" width="24" height="20" rx="3"/>
<rect x="620" y="234" width="24" height="20" rx="3"/><rect x="648" y="234" width="24" height="20" rx="3"/>
</g>
<text x="396" y="272" fill="#aaa" font-size="11.5">queue fills 0 → 10, still only 5 threads</text>

<line x1="676" y1="208" x2="708" y2="208" stroke="#9aa3a4" stroke-width="2" marker-end="url(#g1)"/>
<text x="692" y="196" fill="#f14c4c" font-size="11" text-anchor="middle">full</text>

<!-- step 3 -->
<rect x="712" y="134" width="288" height="150" rx="8" fill="#2a3a4a" stroke="#569cd6" stroke-width="2"/>
<circle cx="744" cy="164" r="16" fill="#569cd6"/><text x="744" y="170" fill="#1e1e1e" text-anchor="middle" font-weight="bold">3</text>
<text x="772" y="170" fill="#9cdcfe" font-weight="bold" font-size="14">threads &lt; max-size?</text>
<text x="732" y="198" fill="#e0e0e0" font-size="12.5">YES → NOW create more threads,</text>
<text x="732" y="216" fill="#e0e0e0" font-size="12.5">up to max-size.</text>
<g fill="#569cd6">
<rect x="732" y="234" width="22" height="20" rx="3"/><rect x="758" y="234" width="22" height="20" rx="3"/>
<rect x="784" y="234" width="22" height="20" rx="3"/><rect x="810" y="234" width="22" height="20" rx="3"/>
<rect x="836" y="234" width="22" height="20" rx="3"/><rect x="862" y="234" width="22" height="20" rx="3"/>
<rect x="888" y="234" width="22" height="20" rx="3"/><rect x="914" y="234" width="22" height="20" rx="3"/>
</g>
<text x="732" y="272" fill="#aaa" font-size="11.5">pool grows 5 → 20</text>

<path d="M856,290 L856,320" stroke="#9aa3a4" stroke-width="2" fill="none" marker-end="url(#g1)"/>
<rect x="712" y="326" width="288" height="86" rx="8" fill="#3a2a2a" stroke="#f14c4c" stroke-width="2"/>
<circle cx="744" cy="356" r="16" fill="#f14c4c"/><text x="744" y="362" fill="#1e1e1e" text-anchor="middle" font-weight="bold">4</text>
<text x="772" y="362" fill="#ffb3b3" font-weight="bold" font-size="14">Otherwise → REJECT</text>
<text x="732" y="388" fill="#e0e0e0" font-family="Consolas, monospace" font-size="11">RejectedExecutionException</text>
<text x="732" y="404" fill="#aaa" font-size="11.5">policy: AbortPolicy (default), CallerRuns…</text>

<line x1="40" y1="436" x2="1000" y2="436" stroke="#444"/>

<rect x="40" y="454" width="470" height="146" rx="8" fill="#3a2a2a" stroke="#f14c4c" stroke-width="2"/>
<text x="60" y="480" fill="#ffb3b3" font-weight="bold" font-size="14">The Spring Boot default trap</text>
<text x="60" y="506" fill="#e0e0e0" font-family="Consolas, monospace" font-size="11.5">spring.task.execution.pool.core-size     = 8</text>
<text x="60" y="524" fill="#e0e0e0" font-family="Consolas, monospace" font-size="11.5">spring.task.execution.pool.max-size      = Integer.MAX</text>
<text x="60" y="542" fill="#e0e0e0" font-family="Consolas, monospace" font-size="11.5">spring.task.execution.pool.queue-capacity = Integer.MAX</text>
<text x="60" y="568" fill="#f14c4c" font-size="12.5">The queue is unbounded, so step 2 NEVER fails —</text>
<text x="60" y="586" fill="#f14c4c" font-size="12.5">step 3 never runs. You are stuck at 8 threads forever.</text>

<rect x="530" y="454" width="470" height="146" rx="8" fill="#234a3e" stroke="#4ec9b0" stroke-width="2"/>
<text x="550" y="480" fill="#9ae6d0" font-weight="bold" font-size="14">The fix: bound the queue</text>
<text x="550" y="506" fill="#e0e0e0" font-family="Consolas, monospace" font-size="11.5">spring.task.execution.pool.core-size      = 8</text>
<text x="550" y="524" fill="#e0e0e0" font-family="Consolas, monospace" font-size="11.5">spring.task.execution.pool.max-size       = 32</text>
<text x="550" y="542" fill="#e0e0e0" font-family="Consolas, monospace" font-size="11.5">spring.task.execution.pool.queue-capacity = 100</text>
<text x="550" y="568" fill="#4ec9b0" font-size="12.5">Now the pool can actually grow under load, and an</text>
<text x="550" y="586" fill="#4ec9b0" font-size="12.5">overload fails fast instead of queueing until OOM.</text>
</svg>
