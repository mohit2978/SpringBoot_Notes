<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1130" viewBox="0 0 1400 1130" role="img" aria-labelledby="title"><title id="title">SHARED CODEBASE · REGISTER A BEAN IN ONE APPLICATION</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7dd3fc"/></marker></defs><rect width="1400" height="1130" fill="#0c1423"/><text x="40" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#f8fafc"><tspan x="40" dy="0">SHARED CODEBASE · REGISTER A BEAN IN ONE APPLICATION</tspan></text>
<text x="40" y="99" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#a9c0d8"><tspan x="40" dy="0">Profile names can identify application variants as well as environments.</tspan></text>
<rect x="260" y="150" width="880" height="204" rx="14" fill="#18283c" stroke="#49617c" stroke-width="2"/>
<text x="283" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#7dd3fc"><tspan x="283" dy="0">① Common component in the shared codebase</tspan></text>
<text x="283" y="231" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e2e8f0"><tspan x="283" dy="0">@Component</tspan><tspan x="283" dy="31">@Profile("app1")</tspan><tspan x="283" dy="31">class NoSQLConnection { … }</tspan><tspan x="283" dy="31">Both applications can scan this class.</tspan></text>
<path d="M 480 354 V 422 H 355 V 486" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 920 354 V 422 H 1040 V 486" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
<text x="60" y="455" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#c4b5fd"><tspan x="60" dy="0">Separate application context</tspan></text>
<text x="740" y="455" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#c4b5fd"><tspan x="740" dy="0">Separate application context</tspan></text>
<rect x="40" y="493" width="630" height="250" rx="14" fill="#142e35" stroke="#49617c" stroke-width="2"/>
<text x="63" y="533" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#7dd3fc"><tspan x="63" dy="0">② Application 1</tspan></text>
<text x="63" y="574" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e2e8f0"><tspan x="63" dy="0">spring.profiles.active=app1</tspan><tspan x="63" dy="31">Does @Profile("app1") match? YES</tspan><tspan x="63" dy="31">Register and instantiate NoSQLConnection.</tspan><tspan x="63" dy="31">Inject properties, then run @PostConstruct.</tspan></text>
<rect x="720" y="493" width="640" height="250" rx="14" fill="#302819" stroke="#49617c" stroke-width="2"/>
<text x="743" y="533" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#7dd3fc"><tspan x="743" dy="0">③ Application 2</tspan></text>
<text x="743" y="574" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e2e8f0"><tspan x="743" dy="0">spring.profiles.active=app2</tspan><tspan x="743" dy="31">Does @Profile("app1") match? NO</tspan><tspan x="743" dy="31">Do not register this bean.</tspan><tspan x="743" dy="31">Its @PostConstruct method does not run.</tspan></text>
<rect x="40" y="800" width="1320" height="259" rx="14" fill="#18283c" stroke="#49617c" stroke-width="2"/>
<text x="63" y="840" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#7dd3fc"><tspan x="63" dy="0">④ Same code, different bean registrations</tspan></text>
<text x="63" y="881" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e2e8f0"><tspan x="63" dy="0">Application 1 gets the bean; Application 2 does not.</tspan><tspan x="63" dy="31">Application 1 must still supply username and password, for example in common properties.</tspan><tspan x="63" dy="31">@Profile controls bean registration; it does not supply missing property values.</tspan><tspan x="63" dy="31">dev / qa / prod describe environments. app1 / app2 describe application variants.</tspan><tspan x="63" dy="31">Choose names that clearly express the configuration’s purpose.</tspan></text></svg>

