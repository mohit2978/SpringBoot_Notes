<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1150" viewBox="0 0 1400 1150" role="img" aria-labelledby="title"><title id="title">ONE CODEBASE · DIFFERENT ENVIRONMENT SETTINGS</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7dd3fc"/></marker></defs><rect width="1400" height="1150" fill="#0c1423"/><text x="40" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#f8fafc"><tspan x="40" dy="0">ONE CODEBASE · DIFFERENT ENVIRONMENT SETTINGS</tspan></text>
<text x="40" y="99" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#a9c0d8"><tspan x="40" dy="0">Choose the runtime profile to use that environment’s configuration.</tspan></text>
<rect x="40" y="135" width="1320" height="110" rx="14" fill="#18283c" stroke="#49617c" stroke-width="2"/>
<text x="63" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#7dd3fc"><tspan x="63" dy="0">Common configuration: application.properties</tspan></text>
<text x="63" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#e2e8f0"><tspan x="63" dy="0">Shared values remain available; active profile files override matching keys.</tspan></text>
