<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2695" viewBox="0 0 1400 2695" role="img" aria-labelledby="title desc">
<title id="title">First-level cache: implementation, storage, lookup, and output</title>
<desc id="desc">A transactional save and two findById calls pass through SimpleJpaRepository and Hibernate SessionImpl. StatefulPersistenceContext holds a HashMap from EntityKey to EntityHolderImpl. A cache hit returns the same entity without SELECT. The example produces one INSERT, true for reference equality, and the user JSON.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7dd3fc"/></marker></defs>
<rect width="1400" height="2695" fill="#0c1423"/>
<text x="40" y="56" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif" font-size="34"><tspan x="40" dy="0">FIRST-LEVEL CACHE · IMPLEMENTATION TO OUTPUT</tspan></text>
<text x="40" y="94" fill="#a9c0d8" font-family="Segoe UI, Arial, sans-serif" font-size="21"><tspan x="40" dy="0">One entity • one shared persistence context • one INSERT • repeated reads from memory</tspan></text>
<rect x="40" y="120" width="1320" height="92" rx="16" fill="#123137" stroke="#2d7370" stroke-width="2"/>
<text x="62" y="152" fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="62" dy="0">EXAMPLE SETUP</tspan></text>
<text x="62" y="182" fill="#dce6f3" font-family="Segoe UI, Arial, sans-serif" font-size="21"><tspan x="62" dy="0">H2 + IDENTITY-generated ID; new row gets ID 1. One service transaction shares one EntityManager.</tspan></text>
<rect x="40" y="240" width="640" height="432" rx="16" fill="#182538" stroke="#36516d" stroke-width="2"/>
<text x="64" y="279" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="24"><tspan x="64" dy="0">01  Application code</tspan></text>
<text x="64" y="314" fill="#e2e8f0" font-family="Consolas, monospace" font-size="18"><tspan x="64" dy="0">// UserDetails: @Entity</tspan><tspan x="64" dy="21">// id: @Id @GeneratedValue(IDENTITY)</tspan><tspan x="64" dy="21">// fields: Long id; String name, email</tspan><tspan x="64" dy="21"></tspan><tspan x="64" dy="21">@Transactional</tspan><tspan x="64" dy="21">public UserDetails demo() {</tspan><tspan x="64" dy="21">  var user = new UserDetails("xyx",</tspan><tspan x="64" dy="21">      "xyz@conceptandcoding.com");</tspan><tspan x="64" dy="21">  repository.save(user);</tspan><tspan x="64" dy="21">  var a = repository.findById(user.getId())</tspan><tspan x="64" dy="21">      .orElseThrow();</tspan><tspan x="64" dy="21">  var b = repository.findById(user.getId())</tspan><tspan x="64" dy="21">      .orElseThrow();</tspan><tspan x="64" dy="21">  System.out.println(a == b); // true</tspan><tspan x="64" dy="21">  return b;</tspan><tspan x="64" dy="21">}</tspan></text>
<rect x="710" y="240" width="650" height="432" rx="16" fill="#182538" stroke="#36516d" stroke-width="2"/>
<text x="734" y="279" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="24"><tspan x="734" dy="0">02  Repository → EntityManager → Hibernate</tspan></text>
<text x="734" y="314" fill="#e2e8f0" font-family="Consolas, monospace" font-size="18"><tspan x="734" dy="0">SimpleJpaRepository.save(entity)</tspan><tspan x="734" dy="25">  if (entityInformation.isNew(entity))</tspan><tspan x="734" dy="25">    entityManager.persist(entity);</tspan><tspan x="734" dy="25">  else</tspan><tspan x="734" dy="25">    return entityManager.merge(entity);</tspan><tspan x="734" dy="25"></tspan><tspan x="734" dy="25">SimpleJpaRepository.findById(id)</tspan><tspan x="734" dy="25">  → entityManager.find(UserDetails.class, id)</tspan><tspan x="734" dy="25"></tspan><tspan x="734" dy="25">EntityManager API</tspan><tspan x="734" dy="25">  → Hibernate SessionImpl</tspan><tspan x="734" dy="25">  → StatefulPersistenceContext</tspan></text>
<text x="734" y="639" fill="#a9c0d8" font-family="Segoe UI, Arial, sans-serif" font-size="17"><tspan x="734" dy="0">Relevant paths shown; Hibernate's full event chain is omitted.</tspan></text>
<path d="M 700 689 V 731" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="748" width="1320" height="390" rx="16" fill="#182538" stroke="#36516d" stroke-width="2"/>
<text x="64" y="787" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="24"><tspan x="64" dy="0">03  Where is the entity stored?</tspan></text>
<text x="64" y="820" fill="#dce6f3" font-family="Segoe UI, Arial, sans-serif" font-size="22"><tspan x="64" dy="0">Application JVM heap — the cache is an in-memory Java object graph.</tspan></text>
<rect x="68" y="849" width="1256" height="254" rx="16" fill="#101b2b" stroke="#36516d" stroke-width="2"/>
<text x="92" y="881" fill="#c4b5fd" font-family="Consolas, monospace" font-size="22"><tspan x="92" dy="0">EntityManager / SessionImpl  →  StatefulPersistenceContext</tspan></text>
<text x="92" y="922" fill="#5eead4" font-family="Consolas, monospace" font-size="23"><tspan x="92" dy="0">entitiesByKey : HashMap&lt;EntityKey, EntityHolderImpl&gt;</tspan></text>
<rect x="94" y="947" width="508" height="123" rx="16" fill="#1d3046" stroke="#36516d" stroke-width="2"/>
<text x="114" y="978" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="18"><tspan x="114" dy="0">KEY · EntityKey</tspan></text>
<text x="114" y="1009" fill="#e2e8f0" font-family="Consolas, monospace" font-size="19"><tspan x="114" dy="0">Entity identity: UserDetails + ID 1</tspan><tspan x="114" dy="30">Conceptual label: UserDetails#1</tspan></text>
<text x="623" y="1016" fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="32"><tspan x="623" dy="0">→</tspan></text>
<rect x="675" y="947" width="620" height="123" rx="16" fill="#1d3046" stroke="#36516d" stroke-width="2"/>
<text x="695" y="978" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="18"><tspan x="695" dy="0">VALUE · EntityHolderImpl</tspan></text>
<text x="695" y="1009" fill="#e2e8f0" font-family="Consolas, monospace" font-size="19"><tspan x="695" dy="0">state = INITIALIZED</tspan><tspan x="695" dy="30">entity → UserDetails {1, xyx, xyz@…}</tspan></text>
<path d="M 700 1151 V 1192" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="1210" width="640" height="370" rx="16" fill="#182538" stroke="#36516d" stroke-width="2"/>
<text x="64" y="1249" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="24"><tspan x="64" dy="0">04  Write path: persist the new entity</tspan></text>
<text x="64" y="1284" fill="#e2e8f0" font-family="Consolas, monospace" font-size="18"><tspan x="64" dy="0">1. repository.save(user) chooses persist().</tspan><tspan x="64" dy="24">2. Hibernate makes the entity managed.</tspan><tspan x="64" dy="24">3. The IDENTITY insert obtains generated ID 1.</tspan><tspan x="64" dy="24">4. The context tracks UserDetails#1.</tspan><tspan x="64" dy="24"></tspan><tspan x="64" dy="24">// Simplified cache-registration logic</tspan><tspan x="64" dy="24">var map = getOrInitializeEntitiesByKey();</tspan><tspan x="64" dy="24">var holder = EntityHolderImpl.forEntity(</tspan><tspan x="64" dy="24">    key, key.getPersister(), entity);</tspan><tspan x="64" dy="24">var previous = map.putIfAbsent(key, holder);</tspan><tspan x="64" dy="24">// Reuse an existing holder when present.</tspan><tspan x="64" dy="24">holder.state = INITIALIZED;</tspan></text>
<rect x="710" y="1210" width="650" height="370" rx="16" fill="#182538" stroke="#36516d" stroke-width="2"/>
<text x="734" y="1249" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="24"><tspan x="734" dy="0">05  Data structure: HashMap</tspan></text>
<text x="734" y="1284" fill="#e2e8f0" font-family="Consolas, monospace" font-size="18"><tspan x="734" dy="0">// Lazy initialization</tspan><tspan x="734" dy="24">if (entitiesByKey == null) {</tspan><tspan x="734" dy="24">  entitiesByKey =</tspan><tspan x="734" dy="24">      CollectionHelper.mapOfSize(INIT_COLL_SIZE);</tspan><tspan x="734" dy="24">}</tspan><tspan x="734" dy="24"></tspan><tspan x="734" dy="24">putIfAbsent(key, holder) → store a holder</tspan><tspan x="734" dy="24">get(key)                → look up a holder</tspan><tspan x="734" dy="24"></tspan><tspan x="734" dy="24">EntityKey hash/equals identify the entity.</tspan><tspan x="734" dy="24">The holder references the managed Java object.</tspan><tspan x="734" dy="24">This is not a map of SQL queries or JSON.</tspan></text>
<path d="M 700 1593 V 1634" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="1652" width="1320" height="364" rx="16" fill="#182538" stroke="#36516d" stroke-width="2"/>
<text x="64" y="1691" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="24"><tspan x="64" dy="0">06  Read path: findById → find → persistence-context lookup</tspan></text>
<text x="64" y="1726" fill="#e2e8f0" font-family="Consolas, monospace" font-size="21"><tspan x="64" dy="0">// Relevant StatefulPersistenceContext lookup, reformatted</tspan><tspan x="64" dy="28">public Object getEntity(EntityKey key) {</tspan><tspan x="64" dy="28">    var holder = entitiesByKey == null ? null : entitiesByKey.get(key);</tspan><tspan x="64" dy="28">    return holder == null || holder.state == EntityHolderState.UNINITIALIZED</tspan><tspan x="64" dy="28">        ? null : holder.entity;</tspan><tspan x="64" dy="28">}</tspan></text>
<rect x="64" y="1908" width="607" height="78" rx="16" fill="#13382f" stroke="#297d60" stroke-width="2"/>
<text x="84" y="1938" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="20"><tspan x="84" dy="0">HIT: initialized holder found</tspan></text>
<text x="84" y="1967" fill="#dce6f3" font-family="Segoe UI, Arial, sans-serif" font-size="19"><tspan x="84" dy="0">Return holder.entity. No SELECT for this lookup.</tspan></text>
<rect x="693" y="1908" width="639" height="78" rx="16" fill="#3b2b18" stroke="#a57938" stroke-width="2"/>
<text x="713" y="1938" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="20"><tspan x="713" dy="0">MISS: no initialized entity in this context</tspan></text>
<text x="713" y="1967" fill="#dce6f3" font-family="Segoe UI, Arial, sans-serif" font-size="19"><tspan x="713" dy="0">In this example: SELECT → manage entity → return it.</tspan></text>
<path d="M 700 2029 V 2070" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="2088" width="640" height="300" rx="16" fill="#182538" stroke="#36516d" stroke-width="2"/>
<text x="64" y="2127" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="24"><tspan x="64" dy="0">07  Observed SQL + console</tspan></text>
<text x="64" y="2162" fill="#e2e8f0" font-family="Consolas, monospace" font-size="18"><tspan x="64" dy="0">Hibernate:</tspan><tspan x="64" dy="25">  insert into user_details (email, name, id)</tspan><tspan x="64" dy="25">  values (?, ?, default)</tspan><tspan x="64" dy="25"></tspan><tspan x="64" dy="25">true</tspan><tspan x="64" dy="25"></tspan><tspan x="64" dy="25">INSERT count: 1</tspan><tspan x="64" dy="25">SELECT count: 0 for the two findById calls</tspan></text>
<rect x="710" y="2088" width="650" height="300" rx="16" fill="#182538" stroke="#36516d" stroke-width="2"/>
<text x="734" y="2127" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="24"><tspan x="734" dy="0">08  Returned entity → JSON response</tspan></text>
<text x="734" y="2162" fill="#e2e8f0" font-family="Consolas, monospace" font-size="18"><tspan x="734" dy="0">{</tspan><tspan x="734" dy="25">  "id": 1,</tspan><tspan x="734" dy="25">  "name": "xyx",</tspan><tspan x="734" dy="25">  "email": "xyz@conceptandcoding.com"</tspan><tspan x="734" dy="25">}</tspan><tspan x="734" dy="25"></tspan><tspan x="734" dy="25">a == b → both reads return the same object.</tspan><tspan x="734" dy="25">JSON is produced when the controller returns it.</tspan></text>
<rect x="40" y="2420" width="1320" height="164" rx="16" fill="#17233c" stroke="#526b9a" stroke-width="2"/>
<text x="64" y="2460" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="21"><tspan x="64" dy="0">SCOPE &amp; LIFETIME</tspan></text>
<text x="64" y="2497" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="21"><tspan x="64" dy="0">New EntityManager → different persistence context → separate first-level cache.</tspan><tspan x="64" dy="31">clear() detaches all managed entities; detach(entity) removes one from management.</tspan><tspan x="64" dy="31">Closing the EntityManager ends its context. The stored database row remains.</tspan></text>
<text x="40" y="2627" fill="#a9c0d8" font-family="Segoe UI, Arial, sans-serif" font-size="18"><tspan x="40" dy="0">Implementation details vary by Hibernate version. Cache internals above are simplified to explain this example.</tspan></text>
<text x="40" y="2660" fill="#a9c0d8" font-family="Segoe UI, Arial, sans-serif" font-size="18"><tspan x="40" dy="0">The existing controller example can also share its context through Open EntityManager in View.</tspan></text>
</svg>
