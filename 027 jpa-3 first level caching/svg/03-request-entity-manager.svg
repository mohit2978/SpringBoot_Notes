<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title"><title id="title">One web request shares the demonstrated EntityManager</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#e6edf3"/></marker></defs><rect width="1120" height="790" fill="#171b21"/><text x="36" y="45" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="27"><tspan x="36" dy="0">One web request shares the demonstrated EntityManager</tspan></text><rect x="35" y="90" width="360" height="120" rx="10" fill="#202832" stroke="#708195"/><text x="55" y="122" fill="#89cfff" font-family="Segoe UI, Arial, sans-serif" font-size="20"><tspan x="55" dy="0">HTTP request</tspan></text><text x="55" y="156" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="17"><tspan x="55" dy="0">GET /api/test-jpa</tspan><tspan x="55" dy="28">DispatcherServlet</tspan></text><rect x="535" y="90" width="550" height="150" rx="10" fill="#202832" stroke="#708195"/><text x="555" y="122" fill="#89cfff" font-family="Segoe UI, Arial, sans-serif" font-size="20"><tspan x="555" dy="0">OpenEntityManagerInViewInterceptor</tspan></text><text x="555" y="156" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="17"><tspan x="555" dy="0">preHandle() → createEntityManager()</tspan><tspan x="555" dy="28">Wrap in EntityManagerHolder</tspan><tspan x="555" dy="28">Bind using TransactionSynchronizationManager</tspan></text><path d="M 395 150 L 529 150" fill="none" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrow)"/><text x="407" y="132" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="407" dy="0">preHandle</tspan></text><rect x="35" y="325" width="360" height="150" rx="10" fill="#202832" stroke="#708195"/><text x="55" y="357" fill="#89cfff" font-family="Segoe UI, Arial, sans-serif" font-size="20"><tspan x="55" dy="0">UserController → service</tspan></text><text x="55" y="391" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="17"><tspan x="55" dy="0">saveUser(user)</tspan><tspan x="55" dy="28">findByID(1L)</tspan><tspan x="55" dy="28">Both share one EntityManager</tspan></text><rect x="535" y="325" width="550" height="175" rx="10" fill="#202832" stroke="#708195"/><text x="555" y="357" fill="#89cfff" font-family="Segoe UI, Arial, sans-serif" font-size="20"><tspan x="555" dy="0">Same EntityManager / persistence context</tspan></text><text x="555" y="391" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="17"><tspan x="555" dy="0">save → persist → entity enters first-level cache</tspan><tspan x="555" dy="28">findById → cached entity returned</tspan><tspan x="555" dy="28">Observed request SQL: INSERT only</tspan><tspan x="555" dy="28">No SELECT for the following lookup</tspan></text><path d="M 810 240 L 810 275 L 210 275 L 210 319" fill="none" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrow)"/><path d="M 395 390 L 529 390" fill="none" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="575" width="1050" height="125" rx="10" fill="#202832" stroke="#708195"/><text x="55" y="607" fill="#89cfff" font-family="Segoe UI, Arial, sans-serif" font-size="20"><tspan x="55" dy="0">Next HTTP request: GET /api/read-jpa</tspan></text><text x="55" y="641" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="17"><tspan x="55" dy="0">New EntityManager → new persistence context → entity absent from this first-level cache</tspan><tspan x="55" dy="28">findById(1L) → SELECT → entity loaded into the new context</tspan></text><path d="M 810 500 L 810 569" fill="none" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="745" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="18"><tspan x="35" dy="0">Request-wide sharing here depends on Open EntityManager in View.</tspan></text></svg>

