<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="580" fill="#0b0f19" rx="14"/>
  <rect x="2" y="2" width="996" height="576" fill="none" stroke="#1e293b" stroke-width="1.5" rx="13"/>

  <!-- Title -->
  <rect x="300" y="14" width="400" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="500" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Hierarchy of Transaction Managers</text>

  <!-- TransactionManager (interface) -->
  <g filter="url(#shadow)">
    <rect x="370" y="64" width="260" height="52" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="500" y="83" text-anchor="middle" font-size="10" fill="#94a3b8">&lt;&lt;interface&gt;&gt;</text>
    <text x="500" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#38bdf8">TransactionManager</text>
  </g>
  <text x="500" y="132" text-anchor="middle" font-size="10" fill="#64748b">extends ↓</text>

  <!-- PlatformTransactionManager (interface) -->
  <g filter="url(#shadow)">
    <rect x="310" y="144" width="380" height="60" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.8"/>
    <text x="500" y="163" text-anchor="middle" font-size="10" fill="#94a3b8">&lt;&lt;interface&gt;&gt;</text>
    <text x="500" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#818cf8">PlatformTransactionManager</text>
  </g>
  <!-- Label for 3 methods -->
  <rect x="60" y="150" width="200" height="56" rx="6" fill="#1e293b"/>
  <text x="70" y="168" font-size="10.5" font-weight="700" fill="#4ade80">3 Methods:</text>
  <text x="70" y="184" font-size="10" fill="#cbd5e1">• getTransaction</text>
  <text x="70" y="198" font-size="10" fill="#cbd5e1">• commit</text>
  <text x="70" y="212" font-size="10" fill="#cbd5e1">• rollback</text>
  <line x1="260" y1="174" x2="310" y2="174" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="3,3"/>

  <line x1="500" y1="204" x2="500" y2="226" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AbstractPlatformTransactionManager -->
  <g filter="url(#shadow)">
    <rect x="270" y="228" width="460" height="60" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.8"/>
    <text x="500" y="247" text-anchor="middle" font-size="10" fill="#94a3b8">&lt;&lt;Abstract Class&gt;&gt;</text>
    <text x="500" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#fbbf24">AbstractPlatformTransactionManager</text>
  </g>
  <!-- Label -->
  <rect x="30" y="232" width="220" height="62" rx="6" fill="#1e293b"/>
  <text x="40" y="250" font-size="10.5" font-weight="700" fill="#fbbf24">Provides default implementation:</text>
  <text x="40" y="266" font-size="10" fill="#cbd5e1">• getTransaction</text>
  <text x="40" y="280" font-size="10" fill="#cbd5e1">• commit</text>
  <text x="40" y="294" font-size="10" fill="#cbd5e1">• rollback</text>
  <line x1="250" y1="260" x2="270" y2="260" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Branches from AbstractPlatformTransactionManager -->
  <line x1="500" y1="288" x2="500" y2="318" stroke="#64748b" stroke-width="1.5"/>
  <line x1="137" y1="318" x2="837" y2="318" stroke="#64748b" stroke-width="1.5"/>
  <line x1="137" y1="318" x2="137" y2="346" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="367" y1="318" x2="367" y2="346" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="597" y1="318" x2="597" y2="346" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="837" y1="318" x2="837" y2="346" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DataSourceTransactionManager -->
  <g filter="url(#shadow)">
    <rect x="40" y="348" width="195" height="64" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.6"/>
    <text x="137" y="368" text-anchor="middle" font-size="10" fill="#94a3b8">&lt;&lt;Concrete Class&gt;&gt;</text>
    <text x="137" y="384" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4ade80">DataSource</text>
    <text x="137" y="399" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4ade80">TransactionManager</text>
  </g>

  <!-- HibernateTransactionManager -->
  <g filter="url(#shadow)">
    <rect x="270" y="348" width="195" height="64" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.6"/>
    <text x="367" y="368" text-anchor="middle" font-size="10" fill="#94a3b8">&lt;&lt;Concrete Class&gt;&gt;</text>
    <text x="367" y="384" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4ade80">Hibernate</text>
    <text x="367" y="399" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4ade80">TransactionManager</text>
  </g>

  <!-- JpaTransactionManager -->
  <g filter="url(#shadow)">
    <rect x="500" y="348" width="195" height="74" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.6"/>
    <text x="597" y="368" text-anchor="middle" font-size="10" fill="#94a3b8">&lt;&lt;Concrete Class&gt;&gt;</text>
    <text x="597" y="384" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4ade80">JPA</text>
    <text x="597" y="399" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4ade80">TransactionManager</text>
    <text x="597" y="414" text-anchor="middle" font-size="9.5" fill="#94a3b8">(Java Persistence API)</text>
  </g>

  <!-- JtaTransactionManager -->
  <g filter="url(#shadow)">
    <rect x="730" y="348" width="215" height="74" rx="8" fill="#0f172a" stroke="#f87171" stroke-width="1.8"/>
    <text x="837" y="368" text-anchor="middle" font-size="10" fill="#94a3b8">&lt;&lt;Concrete Class&gt;&gt;</text>
    <text x="837" y="384" text-anchor="middle" font-size="11.5" font-weight="700" fill="#f87171">JTA</text>
    <text x="837" y="399" text-anchor="middle" font-size="11.5" font-weight="700" fill="#f87171">TransactionManager</text>
    <text x="837" y="414" text-anchor="middle" font-size="9.5" fill="#94a3b8">(Java Transaction API)</text>
  </g>

  <!-- JdbcTransactionManager (child of DataSource) -->
  <g filter="url(#shadow)">
    <rect x="40" y="458" width="195" height="64" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="137" y="478" text-anchor="middle" font-size="10" fill="#94a3b8">&lt;&lt;Concrete Class&gt;&gt;</text>
    <text x="137" y="494" text-anchor="middle" font-size="11.5" font-weight="700" fill="#38bdf8">JDBC</text>
    <text x="137" y="509" text-anchor="middle" font-size="11.5" font-weight="700" fill="#38bdf8">TransactionManager</text>
  </g>
  <text x="137" y="532" text-anchor="middle" font-size="9" fill="#64748b">(Java Data Base Connectivity)</text>
  <line x1="137" y1="412" x2="137" y2="458" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Local vs Distributed Labels -->
  <rect x="40" y="548" width="500" height="24" rx="6" fill="#14532d"/>
  <text x="290" y="564" text-anchor="middle" font-size="11" fill="#86efac">DataSource, Hibernate, JPA, JDBC → manage LOCAL Transactions</text>
  <rect x="700" y="548" width="260" height="24" rx="6" fill="#450a0a"/>
  <text x="830" y="564" text-anchor="middle" font-size="11" fill="#fca5a5">JTA → manages Distributed Transactions</text>
</svg>
