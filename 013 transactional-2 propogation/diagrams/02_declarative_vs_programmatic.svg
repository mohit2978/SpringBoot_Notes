<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="486" fill="#0b0f19" rx="14"/>
  <rect x="2" y="2" width="956" height="482" fill="none" stroke="#1e293b" stroke-width="1.5" rx="13"/>

  <!-- Title -->
  <rect x="300" y="14" width="360" height="36" rx="18" fill="#1e293b" stroke="#334155"/>
  <text x="480" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Transaction Management Approaches</text>

  <!-- Left: Declarative -->
  <g filter="url(#shadow)">
    <rect x="30" y="68" width="435" height="400" rx="10" fill="#0f172a" stroke="#4ade80" stroke-width="1.8"/>
    <rect x="30" y="68" width="435" height="42" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="1.8"/>
    <text x="247" y="94" text-anchor="middle" font-size="16" font-weight="800" fill="#86efac">Declarative</text>
    <text x="247" y="126" text-anchor="middle" font-size="11.5" fill="#94a3b8">Transaction Management through Annotations</text>

    <!-- Code block -->
    <rect x="45" y="138" width="405" height="145" rx="6" fill="#111827" stroke="#334155"/>
    <text x="60" y="159" font-size="11" fill="#fbbf24" font-family="Consolas, monospace">@Component</text>
    <text x="60" y="177" font-size="11" fill="#e2e8f0" font-family="Consolas, monospace">public class User {</text>
    <text x="80" y="197" font-size="11" fill="#fbbf24" font-family="Consolas, monospace">  @Transactional</text>
    <text x="80" y="217" font-size="11" fill="#e2e8f0" font-family="Consolas, monospace">  public void updateUser() {</text>
    <text x="100" y="237" font-size="10" fill="#94a3b8" font-family="Consolas, monospace">    System.out.println("UPDATE QUERY...");</text>
    <text x="80" y="257" font-size="11" fill="#e2e8f0" font-family="Consolas, monospace">  }</text>
    <text x="60" y="273" font-size="11" fill="#e2e8f0" font-family="Consolas, monospace">}</text>

    <!-- Info Box -->
    <rect x="45" y="293" width="405" height="74" rx="6" fill="#1e293b"/>
    <text x="247" y="313" text-anchor="middle" font-size="11.5" font-weight="700" fill="#38bdf8">Auto-Configuration</text>
    <text x="247" y="333" text-anchor="middle" font-size="11" fill="#cbd5e1">Based on underlying DataSource (JDBC or JPA),</text>
    <text x="247" y="351" text-anchor="middle" font-size="11" fill="#cbd5e1">Spring Boot auto-selects the appropriate Transaction Manager</text>

    <!-- Advantages Box -->
    <rect x="45" y="378" width="405" height="74" rx="6" fill="#052e16" stroke="#4ade80" stroke-width="1"/>
    <text x="247" y="398" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4ade80">Advantages</text>
    <text x="60" y="418" font-size="10.5" fill="#cbd5e1">✓ Spring Boot auto-configures Transaction Manager</text>
    <text x="60" y="436" font-size="10.5" fill="#cbd5e1">✓ Simple to use with minimal boilerplate code</text>
  </g>

  <!-- Right: Programmatic -->
  <g filter="url(#shadow)">
    <rect x="495" y="68" width="435" height="400" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.8"/>
    <rect x="495" y="68" width="435" height="42" rx="10" fill="#312e81" stroke="#818cf8" stroke-width="1.8"/>
    <text x="712" y="94" text-anchor="middle" font-size="16" font-weight="800" fill="#c7d2fe">Programmatic</text>
    <text x="712" y="126" text-anchor="middle" font-size="11.5" fill="#94a3b8">Transaction Management through Code</text>

    <!-- Code block -->
    <rect x="510" y="138" width="405" height="145" rx="6" fill="#111827" stroke="#334155"/>
    <text x="525" y="156" font-size="11" fill="#fbbf24" font-family="Consolas, monospace">@Component</text>
    <text x="525" y="172" font-size="11" fill="#e2e8f0" font-family="Consolas, monospace">public class User {</text>
    <text x="545" y="188" font-size="11" fill="#fbbf24" font-family="Consolas, monospace">  @Transactional</text>
    <text x="545" y="204" font-size="11" fill="#e2e8f0" font-family="Consolas, monospace">  public void updateUser() {</text>
    <text x="565" y="220" font-size="10" fill="#94a3b8" font-family="Consolas, monospace">    //1. update DB</text>
    <text x="565" y="235" font-size="10" fill="#f87171" font-family="Consolas, monospace">    //2. External API call</text>
    <text x="565" y="250" font-size="10" fill="#94a3b8" font-family="Consolas, monospace">    //3. update DB</text>
    <text x="545" y="265" font-size="11" fill="#e2e8f0" font-family="Consolas, monospace">  }</text>
    <text x="525" y="278" font-size="11" fill="#e2e8f0" font-family="Consolas, monospace">}</text>

    <!-- Warning: The Problem -->
    <rect x="510" y="293" width="405" height="74" rx="6" fill="#450a0a" stroke="#f87171" stroke-width="1"/>
    <text x="712" y="313" text-anchor="middle" font-size="11.5" font-weight="700" fill="#f87171">Warning: The Problem</text>
    <text x="525" y="333" font-size="10.5" fill="#cbd5e1">If External API call (step 2) takes long time,</text>
    <text x="525" y="351" font-size="10.5" fill="#fca5a5">DB connection is held open → pool starvation in peak hours!</text>

    <!-- Solution / Trade-offs Box -->
    <rect x="510" y="378" width="405" height="74" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="712" y="398" text-anchor="middle" font-size="11.5" font-weight="700" fill="#818cf8">Programmatic Approach</text>
    <text x="525" y="418" font-size="10.5" fill="#cbd5e1">✓ Flexible: explicitly control exact transaction boundaries</text>
    <text x="525" y="436" font-size="10.5" fill="#fbbf24">✗ Requires more code and manual management</text>
  </g>
</svg>
