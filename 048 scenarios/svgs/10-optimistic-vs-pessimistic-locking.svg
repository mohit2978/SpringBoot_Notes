  <text x="500.0" y="444.6" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">Across services / non-DB resources: distributed lock (Redis SET NX PX + fencing token, Redisson) with a timeout.</text>
