  <path d="M544.2,125.3 Q741.3,124.6 938.8,126.3 Q949.5,124.9 950.3,136.3 Q949.6,229.5 950.0,320.1 Q950.1,328.5 939.8,329.0 Q740.1,331.4 544.0,329.9 Q535.7,330.2 534.4,320.1 Q535.3,228.9 533.7,135.2 Q534.2,124.3 548.9,125.0" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="742.5" y="181.4" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">the CONTAINER exceeded its memory limit</text>
  <text x="742.5" y="198.3" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">(heap + metaspace + threads + direct</text>
  <text x="742.5" y="215.2" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">buffers + GC overhead)</text>
  <text x="742.5" y="232.1" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve"></text>
  <text x="742.5" y="249.0" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">no Java stack trace, the pod just dies</text>
  <text x="742.5" y="265.9" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">fix: -XX:MaxRAMPercentage=75</text>
  <text x="742.5" y="282.8" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">(leave room for non-heap)</text>
  <rect x="30" y="375" width="940" height="140" rx="10" fill="#ffec99"/>
  <path d="M40.1,375.5 Q501.2,374.8 960.2,375.0 Q970.0,375.4 969.9,385.1 Q969.9,446.3 970.4,505.8 Q970.9,514.5 960.1,515.9 Q501.0,513.9 39.2,514.9 Q29.1,514.5 29.1,505.3 Q30.9,446.2 29.3,385.4 Q30.3,374.3 43.8,375.9" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M39.1,376.4 Q499.5,374.9 961.6,376.1 Q968.9,374.8 970.0,384.5 Q968.5,444.1 970.7,503.5 Q970.2,514.8 958.5,514.5 Q500.6,515.1 38.6,516.6 Q30.9,516.5 28.7,504.2 Q27.8,446.3 29.3,383.8 Q29.8,376.3 44.0,374.2" fill="none" stroke="#1e1e1e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="500.0" y="432.7" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">Interview flow: 1) restart / scale to restore service  2) collect evidence: heap dump, GC logs, jvm_memory_used,</text>
  <text x="500.0" y="449.6" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">container memory  3) find the leak (what grows, who holds it)  4) fix: bounded caches (Caffeine maximumSize),</text>
  <text x="500.0" y="466.5" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">pagination / streaming instead of loading everything, clear ThreadLocals  5) alert on heap after GC, not raw heap.</text>
</svg>
