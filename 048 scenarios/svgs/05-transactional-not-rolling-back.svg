  <text x="50.0" y="330.0" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="start" font-weight="normal" xml:space="preserve">1. self-invocation (method calls another method in the same class)</text>
  <text x="50.0" y="364.0" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="start" font-weight="normal" xml:space="preserve">2. checked exception: by default only RuntimeException / Error roll back → rollbackFor = Exception.class</text>
  <text x="50.0" y="398.0" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="start" font-weight="normal" xml:space="preserve">3. exception caught and swallowed inside the method → nothing to roll back</text>
  <text x="50.0" y="432.0" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="start" font-weight="normal" xml:space="preserve">4. method is private / final, or the class is not a Spring bean (new OrderService())</text>
  <text x="50.0" y="466.0" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="start" font-weight="normal" xml:space="preserve">5. wrong propagation (REQUIRES_NEW / NOT_SUPPORTED) or table engine without transactions (MyISAM)</text>
  <text x="50.0" y="500.0" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="start" font-weight="normal" xml:space="preserve">6. work done on another thread (@Async, CompletableFuture): the transaction is ThreadLocal</text>
</svg>
