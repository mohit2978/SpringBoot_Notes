  <text x="500.0" y="434.2" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">Answer pattern: find the shared resource first (Grafana: DB CPU, Hikari pending, p99 per dependency).</text>
  <text x="500.0" y="451.1" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">Fixes: read replicas, cache hot reads, fix slow queries &amp; indexes, PgBouncer / smaller pools,</text>
  <text x="500.0" y="468.0" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">batch &amp; async work via Kafka, partition the data (shard by userId), scale on the right metric (latency, queue lag).</text>
  <text x="500.0" y="484.9" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">Rule: more pods only help if the bottleneck is inside the pod.</text>
