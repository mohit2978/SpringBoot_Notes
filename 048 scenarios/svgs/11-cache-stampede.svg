  <text x="500.0" y="459.6" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">or publish an event to evict on all pods. Penetration (keys that never exist) → cache the null / Bloom filter.</text>
