<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pool-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#082b4a"/>
      <stop offset="100%" stop-color="#040f1c"/>
    </linearGradient>
    <filter id="s2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <marker id="arrowB2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowG2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8z" fill="#10b981"/>
    </marker>
    <marker id="arrowR2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="1160" height="700" rx="16" fill="url(#bg2)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(40,26)">
    <rect x="0" y="0" width="175" height="24" rx="12" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="87" y="16" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">HIKARICP · POOLING</text>
    <text x="0" y="52" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#f8fafc">HikariCP Connection Pool</text>
    <text x="0" y="72" font-family="system-ui,sans-serif" font-size="13" fill="#94a3b8">Spring Boot's default pool — reuses connections so you never pay the 20ms creation cost per request</text>
  </g>

  <!-- ===== LEFT: Pool Visual ===== -->
  <g transform="translate(40,108)" filter="url(#s2)">
    <rect width="320" height="548" rx="12" fill="url(#pool-card)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <g transform="translate(18,18)">
      <rect x="0" y="0" width="140" height="22" rx="4" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1"/>
      <text x="70" y="15" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">THE POOL AT STARTUP</text>
      <text x="0" y="44" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#f8fafc">HikariCP — 10 Pre-Warmed Connections</text>
      <text x="0" y="62" font-family="system-ui,sans-serif" font-size="10.5" fill="#7dd3fc">Default: maximum-pool-size = 10, minimum-idle = 2</text>

      <!-- Connection slots 1-10 -->
      <g transform="translate(0,76)">
        <text x="0" y="12" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#bae6fd">Connection Slots (Pool):</text>
        <!-- Conn 1-5 (available - green) -->
        <g transform="translate(0,24)">
          <rect x="0" y="0" width="282" height="34" rx="6" fill="#052e16" stroke="#16a34a" stroke-width="1"/>
          <circle cx="14" cy="17" r="5" fill="#22c55e"/>
          <text x="26" y="21" font-family="'JetBrains Mono',monospace" font-size="10" fill="#86efac">Connection #1</text>
          <rect x="210" y="9" width="58" height="16" rx="8" fill="#14532d" stroke="#16a34a"/>
          <text x="239" y="21" font-family="system-ui,sans-serif" font-size="9" fill="#86efac" text-anchor="middle">IDLE ✓</text>
        </g>
        <g transform="translate(0,64)">
          <rect x="0" y="0" width="282" height="34" rx="6" fill="#052e16" stroke="#16a34a" stroke-width="1"/>
          <circle cx="14" cy="17" r="5" fill="#22c55e"/>
          <text x="26" y="21" font-family="'JetBrains Mono',monospace" font-size="10" fill="#86efac">Connection #2</text>
          <rect x="210" y="9" width="58" height="16" rx="8" fill="#14532d" stroke="#16a34a"/>
          <text x="239" y="21" font-family="system-ui,sans-serif" font-size="9" fill="#86efac" text-anchor="middle">IDLE ✓</text>
        </g>
        <g transform="translate(0,104)">
          <rect x="0" y="0" width="282" height="34" rx="6" fill="#1c1a06" stroke="#d97706" stroke-width="1"/>
          <circle cx="14" cy="17" r="5" fill="#fbbf24"/>
          <text x="26" y="21" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fde68a">Connection #3</text>
          <rect x="200" y="9" width="70" height="16" rx="8" fill="#451a03" stroke="#d97706"/>
          <text x="235" y="21" font-family="system-ui,sans-serif" font-size="9" fill="#fde68a" text-anchor="middle">ACTIVE ★</text>
        </g>
        <g transform="translate(0,144)">
          <rect x="0" y="0" width="282" height="34" rx="6" fill="#052e16" stroke="#16a34a" stroke-width="1"/>
          <circle cx="14" cy="17" r="5" fill="#22c55e"/>
          <text x="26" y="21" font-family="'JetBrains Mono',monospace" font-size="10" fill="#86efac">Connection #4</text>
          <rect x="210" y="9" width="58" height="16" rx="8" fill="#14532d" stroke="#16a34a"/>
          <text x="239" y="21" font-family="system-ui,sans-serif" font-size="9" fill="#86efac" text-anchor="middle">IDLE ✓</text>
        </g>
        <g transform="translate(0,184)">
          <rect x="0" y="0" width="282" height="34" rx="6" fill="#1c1a06" stroke="#d97706" stroke-width="1"/>
          <circle cx="14" cy="17" r="5" fill="#fbbf24"/>
          <text x="26" y="21" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fde68a">Connection #5</text>
          <rect x="200" y="9" width="70" height="16" rx="8" fill="#451a03" stroke="#d97706"/>
          <text x="235" y="21" font-family="system-ui,sans-serif" font-size="9" fill="#fde68a" text-anchor="middle">ACTIVE ★</text>
        </g>
        <g transform="translate(0,224)">
          <rect x="0" y="0" width="282" height="34" rx="6" fill="#052e16" stroke="#16a34a" stroke-width="1"/>
          <circle cx="14" cy="17" r="5" fill="#22c55e"/>
          <text x="26" y="21" font-family="'JetBrains Mono',monospace" font-size="10" fill="#86efac">Connection #6</text>
          <rect x="210" y="9" width="58" height="16" rx="8" fill="#14532d" stroke="#16a34a"/>
          <text x="239" y="21" font-family="system-ui,sans-serif" font-size="9" fill="#86efac" text-anchor="middle">IDLE ✓</text>
        </g>
        <g transform="translate(0,264)">
          <rect x="0" y="0" width="282" height="34" rx="6" fill="#052e16" stroke="#16a34a" stroke-width="1"/>
          <circle cx="14" cy="17" r="5" fill="#22c55e"/>
          <text x="26" y="21" font-family="'JetBrains Mono',monospace" font-size="10" fill="#86efac">Connection #7</text>
          <rect x="210" y="9" width="58" height="16" rx="8" fill="#14532d" stroke="#16a34a"/>
          <text x="239" y="21" font-family="system-ui,sans-serif" font-size="9" fill="#86efac" text-anchor="middle">IDLE ✓</text>
        </g>

        <!-- dot dot dot -->
        <text x="141" y="318" font-family="system-ui,sans-serif" font-size="16" fill="#475569" text-anchor="middle">•  •  •</text>

        <g transform="translate(0,330)">
          <rect x="0" y="0" width="282" height="34" rx="6" fill="#052e16" stroke="#16a34a" stroke-width="1"/>
          <circle cx="14" cy="17" r="5" fill="#22c55e"/>
          <text x="26" y="21" font-family="'JetBrains Mono',monospace" font-size="10" fill="#86efac">Connection #10</text>
          <rect x="210" y="9" width="58" height="16" rx="8" fill="#14532d" stroke="#16a34a"/>
          <text x="239" y="21" font-family="system-ui,sans-serif" font-size="9" fill="#86efac" text-anchor="middle">IDLE ✓</text>
        </g>

        <!-- Legend -->
        <g transform="translate(0,376)">
          <circle cx="8" cy="8" r="5" fill="#22c55e"/>
          <text x="18" y="12" font-family="system-ui,sans-serif" font-size="10" fill="#86efac">Idle — available to borrow</text>
          <circle cx="8" cy="28" r="5" fill="#fbbf24"/>
          <text x="18" y="32" font-family="system-ui,sans-serif" font-size="10" fill="#fde68a">Active — executing SQL for a request</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== MIDDLE: Request flow ===== -->
  <g transform="translate(380,108)" filter="url(#s2)">
    <rect width="360" height="548" rx="12" fill="#0c1220" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <g transform="translate(18,18)">
      <rect x="0" y="0" width="145" height="22" rx="4" fill="#047857" fill-opacity="0.35" stroke="#10b981" stroke-width="1"/>
      <text x="72" y="15" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">REQUEST FLOW</text>
      <text x="0" y="44" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#f8fafc">5 Users Hit the API Simultaneously</text>
      <text x="0" y="62" font-family="system-ui,sans-serif" font-size="10.5" fill="#a7f3d0">Each gets a pre-existing pooled connection</text>

      <!-- 5 user boxes → pool -->
      <g transform="translate(0,76)" font-family="system-ui,sans-serif" font-size="10.5">
        <rect x="0" y="0" width="112" height="32" rx="6" fill="#0f2b24" stroke="#10b981" stroke-width="1"/>
        <text x="56" y="20" fill="#f8fafc" text-anchor="middle" font-weight="700">GET /emp/1</text>
        <line x1="116" y1="16" x2="192" y2="16" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG2)"/>
        <rect x="196" y="0" width="124" height="32" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
        <text x="258" y="20" fill="#86efac" text-anchor="middle">Connection #1</text>

        <rect x="0" y="46" width="112" height="32" rx="6" fill="#0f2b24" stroke="#10b981" stroke-width="1"/>
        <text x="56" y="66" fill="#f8fafc" text-anchor="middle" font-weight="700">GET /emp/2</text>
        <line x1="116" y1="62" x2="192" y2="62" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG2)"/>
        <rect x="196" y="46" width="124" height="32" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
        <text x="258" y="66" fill="#86efac" text-anchor="middle">Connection #2</text>

        <rect x="0" y="92" width="112" height="32" rx="6" fill="#0f2b24" stroke="#10b981" stroke-width="1"/>
        <text x="56" y="112" fill="#f8fafc" text-anchor="middle" font-weight="700">POST /emp</text>
        <line x1="116" y1="108" x2="192" y2="108" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG2)"/>
        <rect x="196" y="92" width="124" height="32" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
        <text x="258" y="112" fill="#86efac" text-anchor="middle">Connection #3</text>

        <rect x="0" y="138" width="112" height="32" rx="6" fill="#0f2b24" stroke="#10b981" stroke-width="1"/>
        <text x="56" y="158" fill="#f8fafc" text-anchor="middle" font-weight="700">DELETE /1</text>
        <line x1="116" y1="154" x2="192" y2="154" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG2)"/>
        <rect x="196" y="138" width="124" height="32" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
        <text x="258" y="154" fill="#86efac" text-anchor="middle">Connection #4</text>

        <rect x="0" y="184" width="112" height="32" rx="6" fill="#0f2b24" stroke="#10b981" stroke-width="1"/>
        <text x="56" y="204" fill="#f8fafc" text-anchor="middle" font-weight="700">PUT /emp/5</text>
        <line x1="116" y1="200" x2="192" y2="200" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG2)"/>
        <rect x="196" y="184" width="124" height="32" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
        <text x="258" y="200" fill="#86efac" text-anchor="middle">Connection #5</text>
      </g>

      <!-- Return flow -->
      <text x="0" y="298" font-family="system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#a7f3d0">When request finishes → connection returned:</text>
      <rect x="0" y="308" width="322" height="66" rx="8" fill="#052e16" stroke="#059669" stroke-width="1"/>
      <g transform="translate(12,308)" font-family="'JetBrains Mono',monospace" font-size="10">
        <text y="20" fill="#86efac">Request done → conn.close() called</text>
        <text y="38" fill="#34d399">→ HikariCP intercepts → NOT closed!</text>
        <text y="56" fill="#6ee7b7">→ Returned to pool → IDLE again ✓</text>
      </g>

      <!-- Timeline diagram -->
      <text x="0" y="396" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">Single request timeline:</text>
      <g transform="translate(0,404)">
        <rect x="0" y="0" width="322" height="118" rx="8" fill="#081a13" stroke="#047857" stroke-width="1"/>
        <g transform="translate(12,12)" font-family="system-ui,sans-serif" font-size="10.2">
          <circle cx="8" cy="8" r="6" fill="#0369a1" stroke="#38bdf8"/>
          <text x="20" y="12" fill="#bae6fd">HTTP Request arrives</text>
          <line x1="8" y1="18" x2="8" y2="30" stroke="#38bdf8" stroke-width="1.5"/>
          <circle cx="8" cy="36" r="6" fill="#047857" stroke="#10b981"/>
          <text x="20" y="40" fill="#86efac">Pool: borrow Connection #3</text>
          <line x1="8" y1="46" x2="8" y2="58" stroke="#10b981" stroke-width="1.5"/>
          <circle cx="8" cy="64" r="6" fill="#1d4ed8" stroke="#60a5fa"/>
          <text x="20" y="68" fill="#93c5fd">SQL executes via that connection</text>
          <line x1="8" y1="74" x2="8" y2="86" stroke="#60a5fa" stroke-width="1.5"/>
          <circle cx="8" cy="92" r="6" fill="#047857" stroke="#10b981"/>
          <text x="20" y="96" fill="#86efac">Pool: Connection #3 returned (idle)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== RIGHT: 20 users, timeout, config ===== -->
  <g transform="translate(760,108)" filter="url(#s2)">
    <rect width="360" height="548" rx="12" fill="#1a0a00" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
    <g transform="translate(18,18)">
      <rect x="0" y="0" width="168" height="22" rx="4" fill="#92400e" fill-opacity="0.35" stroke="#f59e0b" stroke-width="1"/>
      <text x="84" y="15" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">OVERLOAD &amp; TIMEOUT</text>
      <text x="0" y="44" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#f8fafc">What Happens with 20 Concurrent Requests?</text>
      <text x="0" y="62" font-family="system-ui,sans-serif" font-size="10.5" fill="#fcd34d">Pool has 10, so 10 must wait in queue</text>

      <!-- 20 request diagram -->
      <g transform="translate(0,76)">
        <rect x="0" y="0" width="322" height="96" rx="8" fill="#0d0600" stroke="#d97706" stroke-width="1"/>
        <text x="12" y="18" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fbbf24">20 Requests hit simultaneously:</text>
        <rect x="12" y="26" width="296" height="24" rx="4" fill="#052e16" stroke="#22c55e"/>
        <text x="160" y="42" font-family="system-ui,sans-serif" font-size="10" fill="#86efac" text-anchor="middle">Requests 1–10 → get connections immediately ✓</text>
        <rect x="12" y="56" width="296" height="24" rx="4" fill="#450a0a" stroke="#f43f5e"/>
        <text x="160" y="72" font-family="system-ui,sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">Requests 11–20 → enter WAITING QUEUE ⏳</text>
      </g>

      <text x="0" y="192" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fcd34d">When connection freed → queue moves:</text>
      <rect x="0" y="200" width="322" height="60" rx="6" fill="#0d0600" stroke="#d97706" stroke-width="1"/>
      <g transform="translate(12,200)" font-family="'JetBrains Mono',monospace" font-size="10">
        <text y="20" fill="#fbbf24">Req #3 finishes → Connection #3 released</text>
        <text y="38" fill="#fde047">→ Request #11 (first in queue) gets it</text>
        <text y="56" fill="#86efac">→ No new connection created ✓</text>
      </g>

      <!-- Timeout exception -->
      <text x="0" y="284" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#f87171">If all busy for &gt; 30s — throws Exception:</text>
      <rect x="0" y="294" width="322" height="62" rx="6" fill="#450a0a" stroke="#f43f5e" stroke-width="1.5"/>
      <g transform="translate(12,294)" font-family="'JetBrains Mono',monospace" font-size="9.5">
        <text y="20" fill="#fca5a5">SQLTransientConnectionException:</text>
        <text y="36" fill="#f87171">Connection is not available, request</text>
        <text y="52" fill="#f87171">timed out after 30000ms.</text>
      </g>

      <!-- Configuration box -->
      <text x="0" y="380" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fcd34d">HikariCP configuration (application.properties):</text>
      <rect x="0" y="390" width="322" height="140" rx="6" fill="#100800" stroke="#d97706" stroke-width="1"/>
      <g transform="translate(12,390)" font-family="'JetBrains Mono',monospace" font-size="9.5">
        <text y="18" fill="#fde047"># Max connections in pool</text>
        <text y="34" fill="#86efac">spring.datasource.hikari.maximum-pool-size=10</text>
        <text y="54" fill="#fde047"># Keep N idle connections ready</text>
        <text y="70" fill="#86efac">spring.datasource.hikari.minimum-idle=2</text>
        <text y="90" fill="#fde047"># Wait 30s max for a connection</text>
        <text y="106" fill="#86efac">spring.datasource.hikari.connection-timeout=30000</text>
        <text y="126" fill="#fde047"># Close idle conns after 10 min</text>
        <text y="142" fill="#86efac">spring.datasource.hikari.idle-timeout=600000</text>
      </g>
    </g>
  </g>

  <!-- Bottom bar -->
  <g transform="translate(40,672)">
    <rect width="1080" height="16" rx="8" fill="#1e293b" fill-opacity="0.5"/>
    <text x="540" y="11" font-family="system-ui,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">
      Interview answer: "HikariCP default is 10 connections. Pool reuses them. Requests wait up to 30s before SQLTransientConnectionException is thrown."
    </text>
  </g>
</svg>
