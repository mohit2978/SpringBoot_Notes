<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dc-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0600"/>
      <stop offset="100%" stop-color="#0a0200"/>
    </linearGradient>
    <filter id="s4" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <marker id="a4o" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8z" fill="#f97316"/>
    </marker>
    <marker id="a4g" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8z" fill="#34d399"/>
    </marker>
    <marker id="a4b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="16" fill="url(#bg4)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(40,26)">
    <rect x="0" y="0" width="190" height="24" rx="12" fill="#f97316" fill-opacity="0.12" stroke="#f97316" stroke-opacity="0.35"/>
    <text x="95" y="16" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="600" fill="#f97316" text-anchor="middle">DIRTY CHECKING · FLUSH</text>
    <text x="0" y="52" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Dirty Checking — Auto-Update Without save()</text>
    <text x="0" y="72" font-family="system-ui,sans-serif" font-size="13" fill="#94a3b8">Hibernate remembers the original state and compares at flush — generates UPDATE only when something changed</text>
  </g>

  <!-- ===== CARD 1: Step-by-step flow ===== -->
  <g transform="translate(40,108)" filter="url(#s4)">
    <rect width="440" height="614" rx="12" fill="url(#dc-card)" stroke="#f97316" stroke-opacity="0.4" stroke-width="1.5"/>
    <g transform="translate(18,18)">
      <rect x="0" y="0" width="148" height="22" rx="4" fill="#9a3412" fill-opacity="0.35" stroke="#f97316" stroke-width="1"/>
      <text x="74" y="15" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#f97316" text-anchor="middle">STEP-BY-STEP FLOW</text>
      <text x="0" y="44" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#f8fafc">How Hibernate Detects Changes</text>

      <!-- Code example at top -->
      <rect x="0" y="56" width="402" height="78" rx="6" fill="#0d0400" stroke="#c2410c" stroke-width="1"/>
      <path d="M0 8 Q0 0 8 0 L394 0 Q402 0 402 8 L402 22 L0 22Z" fill="#1e0800" transform="translate(0,56)"/>
      <circle cx="16" cy="67" r="4" fill="#ef4444" opacity="0.8"/>
      <circle cx="30" cy="67" r="4" fill="#eab308" opacity="0.8"/>
      <circle cx="44" cy="67" r="4" fill="#22c55e" opacity="0.8"/>
      <text x="60" y="71" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fb923c">UpdateService.java</text>
      <g transform="translate(12,82)" font-family="'JetBrains Mono',monospace" font-size="9.5">
        <text y="14" fill="#fb923c">@Transactional</text>
        <text y="30" fill="#f8fafc"><tspan fill="#ec4899">public void</tspan> updateEmployee() {</text>
        <text y="46" fill="#fbbf24">    Employee e = repo.<tspan fill="#f8fafc">findById</tspan>(<tspan fill="#86efac">1L</tspan>).orElseThrow();</text>
        <text y="62" fill="#fbbf24">    e.<tspan fill="#f8fafc">setName</tspan>(<tspan fill="#86efac">"Mohit"</tspan>); <tspan fill="#64748b">// &lt;-- no save() call!</tspan></text>
      </g>

      <!-- Steps -->
      <g transform="translate(0,148)">
        <!-- Step 1 -->
        <rect x="0" y="0" width="402" height="80" rx="8" fill="#0d0400" stroke="#f97316" stroke-width="1"/>
        <circle cx="22" cy="22" r="16" fill="#9a3412" stroke="#f97316" stroke-width="1.5"/>
        <text x="22" y="27" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">1</text>
        <text x="48" y="18" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Transaction Begins</text>
        <text x="48" y="34" font-family="system-ui,sans-serif" font-size="10.5" fill="#94a3b8">Spring opens EntityManager, begins database transaction</text>
        <rect x="48" y="44" width="340" height="26" rx="4" fill="#1e0800" stroke="#c2410c"/>
        <text x="60" y="61" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#fb923c">Spring → EM created → @Transactional begins</text>

        <!-- Arrow -->
        <line x1="201" y1="84" x2="201" y2="104" stroke="#f97316" stroke-width="2" marker-end="url(#a4o)"/>

        <!-- Step 2 -->
        <rect x="0" y="108" width="402" height="90" rx="8" fill="#0d0400" stroke="#f97316" stroke-width="1"/>
        <circle cx="22" cy="22" r="16" fill="#9a3412" stroke="#f97316" stroke-width="1.5" transform="translate(0,108)"/>
        <text x="22" y="135" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">2</text>
        <text x="48" y="126" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Entity Loaded — Snapshot Taken</text>
        <text x="48" y="142" font-family="system-ui,sans-serif" font-size="10.5" fill="#94a3b8">Hibernate executes SQL, creates object, AND stores original state</text>
        <rect x="12" y="160" width="378" height="30" rx="4" fill="#0b1a08" stroke="#16a34a"/>
        <g transform="translate(24,162)" font-family="'JetBrains Mono',monospace" font-size="9.5">
          <text y="14" fill="#86efac">Original snapshot: </text>
          <text x="130" y="14" fill="#fde047">Employee{id=1, name="Rahul"}</text>
          <text x="352" y="14" fill="#64748b">  ← saved internally</text>
        </g>

        <!-- Arrow -->
        <line x1="201" y1="202" x2="201" y2="222" stroke="#f97316" stroke-width="2" marker-end="url(#a4o)"/>

        <!-- Step 3 -->
        <rect x="0" y="226" width="402" height="82" rx="8" fill="#0d0400" stroke="#f97316" stroke-width="1"/>
        <circle cx="22" cy="22" r="16" fill="#9a3412" stroke="#f97316" stroke-width="1.5" transform="translate(0,226)"/>
        <text x="22" y="253" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">3</text>
        <text x="48" y="244" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Java Object Changed in Memory</text>
        <text x="48" y="260" font-family="system-ui,sans-serif" font-size="10.5" fill="#94a3b8">setName() runs — only the Java object changes, DB untouched yet</text>
        <g transform="translate(12,272)">
          <rect x="0" y="0" width="176" height="26" rx="4" fill="#0f2b48" stroke="#38bdf8"/>
          <text x="88" y="17" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7dd3fc" text-anchor="middle">Snapshot: name="Rahul"</text>
          <rect x="186" y="0" width="204" height="26" rx="4" fill="#14532d" stroke="#16a34a"/>
          <text x="288" y="17" font-family="'JetBrains Mono',monospace" font-size="9" fill="#86efac" text-anchor="middle">Managed obj: name="Mohit"</text>
        </g>

        <!-- Arrow -->
        <line x1="201" y1="312" x2="201" y2="332" stroke="#f97316" stroke-width="2" marker-end="url(#a4o)"/>

        <!-- Step 4 -->
        <rect x="0" y="336" width="402" height="82" rx="8" fill="#0d0400" stroke="#f97316" stroke-width="1"/>
        <circle cx="22" cy="22" r="16" fill="#9a3412" stroke="#f97316" stroke-width="1.5" transform="translate(0,336)"/>
        <text x="22" y="363" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">4</text>
        <text x="48" y="354" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Flush — Hibernate Detects Dirty Entity</text>
        <text x="48" y="370" font-family="system-ui,sans-serif" font-size="10.5" fill="#94a3b8">Compares snapshot vs managed object → fields differ → generates UPDATE</text>
        <rect x="12" y="382" width="378" height="28" rx="4" fill="#1c1200" stroke="#d97706"/>
        <text x="24" y="400" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#fde047">Snapshot("Rahul") ≠ Current("Mohit") → entity is DIRTY → SQL needed</text>

        <!-- Arrow -->
        <line x1="201" y1="422" x2="201" y2="442" stroke="#f97316" stroke-width="2" marker-end="url(#a4o)"/>

        <!-- Step 5 -->
        <rect x="0" y="446" width="402" height="82" rx="8" fill="#0d0400" stroke="#10b981" stroke-width="1"/>
        <circle cx="22" cy="22" r="16" fill="#047857" stroke="#10b981" stroke-width="1.5" transform="translate(0,446)"/>
        <text x="22" y="473" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">5</text>
        <text x="48" y="464" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#34d399">UPDATE SQL Generated &amp; Committed</text>
        <text x="48" y="480" font-family="system-ui,sans-serif" font-size="10.5" fill="#94a3b8">Hibernate sends UPDATE; Spring commits; database changes permanently</text>
        <rect x="12" y="492" width="378" height="28" rx="4" fill="#052e16" stroke="#16a34a"/>
        <text x="24" y="510" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#86efac">UPDATE employee SET name='Mohit' WHERE id=1;</text>
      </g>
    </g>
  </g>

  <!-- ===== CARD 2: When to use save() ===== -->
  <g transform="translate(500,108)" filter="url(#s4)">
    <rect width="340" height="614" rx="12" fill="#0c1820" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <g transform="translate(18,18)">
      <rect x="0" y="0" width="175" height="22" rx="4" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1"/>
      <text x="87" y="15" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">WHEN TO USE save()</text>
      <text x="0" y="44" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Entity States</text>
      <text x="0" y="62" font-family="system-ui,sans-serif" font-size="10.5" fill="#7dd3fc">save() is NOT always needed — depends on entity state</text>

      <!-- State 1: Managed -->
      <rect x="0" y="76" width="302" height="148" rx="8" fill="#052e16" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="0" y="76" width="302" height="30" rx="8" fill="#065e2a" stroke="none"/>
      <text x="14" y="97" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#86efac">✓ MANAGED entity — no save() needed</text>
      <g transform="translate(12,110)" font-family="'JetBrains Mono',monospace" font-size="9.5">
        <text y="14" fill="#34d399">@Transactional</text>
        <text y="30" fill="#f8fafc"><tspan fill="#ec4899">public void</tspan> update() {</text>
        <text y="46" fill="#f8fafc">  Employee e = repo.findById(<tspan fill="#86efac">1L</tspan>).orElseThrow();</text>
        <text y="62" fill="#fde047">  e.setName(<tspan fill="#86efac">"Mohit"</tspan>); <tspan fill="#64748b">// dirty checking handles it</tspan></text>
        <text y="78" fill="#f8fafc">} <tspan fill="#4ade80">// UPDATE runs at commit automatically!</tspan></text>
      </g>

      <!-- State 2: New entity -->
      <rect x="0" y="238" width="302" height="148" rx="8" fill="#1c1200" stroke="#d97706" stroke-width="1.5"/>
      <rect x="0" y="238" width="302" height="30" rx="8" fill="#3a2400" stroke="none"/>
      <text x="14" y="259" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fde047">✦ NEW entity — must call save() / persist()</text>
      <g transform="translate(12,272)" font-family="'JetBrains Mono',monospace" font-size="9.5">
        <text y="14" fill="#f8fafc">Employee e = <tspan fill="#ec4899">new</tspan> Employee();</text>
        <text y="30" fill="#f8fafc">e.setName(<tspan fill="#86efac">"Mohit"</tspan>);</text>
        <text y="50" fill="#94a3b8">// e is NOT managed — must persist explicitly:</text>
        <text y="66" fill="#fde047">entityManager.persist(e); <tspan fill="#64748b">// or repo.save(e)</tspan></text>
        <text y="84" fill="#fbbf24">// Now it's managed → INSERT on commit</text>
      </g>

      <!-- State 3: Detached entity -->
      <rect x="0" y="400" width="302" height="180" rx="8" fill="#1a0a0a" stroke="#f43f5e" stroke-width="1.5"/>
      <rect x="0" y="400" width="302" height="30" rx="8" fill="#3a0a0a" stroke="none"/>
      <text x="14" y="421" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fca5a5">⚠ DETACHED entity — requires merge() or save()</text>
      <g transform="translate(12,434)" font-family="'JetBrains Mono',monospace" font-size="9.5">
        <text y="14" fill="#94a3b8">// Entity was managed, then EM closed</text>
        <text y="30" fill="#94a3b8">// (e.g. outside @Transactional scope)</text>
        <text y="50" fill="#f8fafc">employee.setName(<tspan fill="#86efac">"Mohit"</tspan>); <tspan fill="#f43f5e">// NOT tracked!</tspan></text>
        <text y="70" fill="#94a3b8">// To re-attach and save:</text>
        <text y="86" fill="#fca5a5">Employee mgd = em.merge(employee);</text>
        <text y="106" fill="#7dd3fc">// or with Spring Data:</text>
        <text y="122" fill="#fca5a5">repo.save(employee); <tspan fill="#64748b">// calls merge internally</tspan></text>
        <text y="142" fill="#94a3b8">// Now the managed copy is tracked ✓</text>
      </g>
    </g>
  </g>

  <!-- ===== CARD 3: Transaction flow full ===== -->
  <g transform="translate(860,108)" filter="url(#s4)">
    <rect width="300" height="614" rx="12" fill="#130e22" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
    <g transform="translate(18,18)">
      <rect x="0" y="0" width="150" height="22" rx="4" fill="#581c87" fill-opacity="0.35" stroke="#a855f7" stroke-width="1"/>
      <text x="75" y="15" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#c084fc" text-anchor="middle">ROLLBACK CASE</text>
      <text x="0" y="44" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#f8fafc">What if an Exception Throws?</text>
      <text x="0" y="62" font-family="system-ui,sans-serif" font-size="10.5" fill="#d8b4fe">Changes are rolled back — DB stays consistent</text>

      <!-- Rollback code -->
      <rect x="0" y="76" width="262" height="128" rx="8" fill="#0d0817" stroke="#7e22ce" stroke-width="1"/>
      <path d="M0 8 Q0 0 8 0 L254 0 Q262 0 262 8 L262 22 L0 22Z" fill="#1e0f38" transform="translate(0,76)"/>
      <circle cx="16" cy="87" r="4" fill="#ef4444" opacity="0.8"/>
      <circle cx="30" cy="87" r="4" fill="#eab308" opacity="0.8"/>
      <circle cx="44" cy="87" r="4" fill="#22c55e" opacity="0.8"/>
      <g transform="translate(12,100)" font-family="'JetBrains Mono',monospace" font-size="9.5">
        <text y="14" fill="#c084fc">@Transactional</text>
        <text y="30" fill="#f8fafc"><tspan fill="#ec4899">public void</tspan> update() {</text>
        <text y="46" fill="#f8fafc">  Employee e = repo.findById(<tspan fill="#86efac">1L</tspan>).get();</text>
        <text y="62" fill="#f8fafc">  e.setName(<tspan fill="#86efac">"Mohit"</tspan>);</text>
        <text y="78" fill="#f43f5e">  <tspan fill="#ec4899">throw new</tspan> RuntimeException();</text>
        <text y="96" fill="#f8fafc">}</text>
      </g>

      <!-- Rollback steps -->
      <text x="0" y="222" font-family="system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#d8b4fe">Spring handles it:</text>
      <g transform="translate(0,232)" font-family="system-ui,sans-serif" font-size="10.2">
        <rect x="0" y="0" width="262" height="28" rx="5" fill="#0f1824" stroke="#38bdf8"/>
        <text x="131" y="18" fill="#bae6fd" text-anchor="middle">1. Transaction started</text>
        <line x1="131" y1="32" x2="131" y2="50" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#a4b)"/>

        <rect x="0" y="54" width="262" height="28" rx="5" fill="#0f1824" stroke="#38bdf8"/>
        <text x="131" y="72" fill="#bae6fd" text-anchor="middle">2. Entity changed in memory</text>
        <line x1="131" y1="86" x2="131" y2="104" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#a4b)"/>

        <rect x="0" y="108" width="262" height="28" rx="5" fill="#1a0a0a" stroke="#f43f5e"/>
        <text x="131" y="126" fill="#fca5a5" text-anchor="middle">3. RuntimeException thrown</text>
        <line x1="131" y1="140" x2="131" y2="158" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#a4o)"/>

        <rect x="0" y="162" width="262" height="28" rx="5" fill="#1a0a0a" stroke="#f43f5e"/>
        <text x="131" y="180" fill="#fca5a5" text-anchor="middle">4. Spring rolls back transaction</text>
        <line x1="131" y1="194" x2="131" y2="212" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#a4o)"/>

        <rect x="0" y="216" width="262" height="28" rx="5" fill="#052e16" stroke="#22c55e"/>
        <text x="131" y="234" fill="#86efac" text-anchor="middle">5. DB unchanged → name = "Rahul" ✓</text>
      </g>

      <!-- Important note -->
      <rect x="0" y="490" width="262" height="54" rx="8" fill="#1e0d38" stroke="#7e22ce" stroke-width="1.2"/>
      <text x="14" y="510" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#d8b4fe">Key distinction:</text>
      <text x="14" y="526" font-family="system-ui,sans-serif" font-size="9.5" fill="#e9d5ff">Spring's TX manager commits/rolls back.</text>
      <text x="14" y="542" font-family="system-ui,sans-serif" font-size="9.5" fill="#e9d5ff">Hibernate generates and executes the SQL.</text>

      <!-- @Transactional stack -->
      <text x="0" y="568" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#d8b4fe">Complete TX management stack:</text>
      <rect x="0" y="578" width="262" height="24" rx="4" fill="#0f1824" stroke="#38bdf8"/>
      <text x="131" y="594" font-family="system-ui,sans-serif" font-size="10" fill="#7dd3fc" text-anchor="middle">@Transactional → Spring TX Mgr → EM → Hibernate → JDBC</text>
    </g>
  </g>

  <!-- Bottom bar -->
  <g transform="translate(40,734)">
    <rect width="1120" height="16" rx="8" fill="#1e293b" fill-opacity="0.5"/>
    <text x="560" y="11" font-family="system-ui,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">
      Dirty checking = Hibernate stores original state on load, compares at flush time. If changed → UPDATE generated. No setName() goes undetected inside an active @Transactional.
    </text>
  </g>
</svg>
