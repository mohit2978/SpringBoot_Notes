<svg viewBox="0 0 950 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" font-size="12">
<rect width="950" height="460" fill="#1e1e1e" rx="8"/>
<text x="475" y="22" fill="#e0e0e0" text-decoration="underline" text-anchor="middle">Looks very simple, but what's happening inside?</text>
<text x="475" y="45" fill="#d4a017" font-weight="bold" text-decoration="underline" text-anchor="middle">JPA Architecture/Components involved:</text>

<rect x="20" y="90" width="120" height="30" fill="none" stroke="#e0e0e0"/>
<text x="80" y="110" fill="#e0e0e0" text-anchor="middle">Persistence Unit1</text>

<rect x="200" y="90" width="140" height="30" fill="none" stroke="#e0e0e0"/>
<text x="270" y="110" fill="#e0e0e0" text-anchor="middle">EntityManagerFactory1</text>

<rect x="410" y="60" width="110" height="26" fill="none" stroke="#e0e0e0"/>
<text x="465" y="78" fill="#e0e0e0" text-anchor="middle">EntityManager 1</text>
<rect x="410" y="120" width="110" height="26" fill="none" stroke="#e0e0e0"/>
<text x="465" y="138" fill="#e0e0e0" text-anchor="middle">EntityManager N</text>

<rect x="580" y="60" width="110" height="30" fill="none" stroke="#e0e0e0"/>
<text x="635" y="78" fill="#e0e0e0" text-anchor="middle">Persistence</text>
<text x="635" y="92" fill="#e0e0e0" text-anchor="middle">Context 1</text>
<rect x="580" y="120" width="110" height="30" fill="none" stroke="#e0e0e0"/>
<text x="635" y="138" fill="#e0e0e0" text-anchor="middle">Persistence</text>
<text x="635" y="152" fill="#e0e0e0" text-anchor="middle">Context N</text>

<rect x="740" y="45" width="70" height="20" fill="none" stroke="#e0e0e0"/><text x="775" y="59" fill="#e0e0e0" text-anchor="middle" font-size="11">Entity 1</text>
<rect x="740" y="70" width="70" height="20" fill="none" stroke="#e0e0e0"/><text x="775" y="84" fill="#e0e0e0" text-anchor="middle" font-size="11">Entity 2</text>
<rect x="740" y="105" width="70" height="20" fill="none" stroke="#e0e0e0"/><text x="775" y="119" fill="#e0e0e0" text-anchor="middle" font-size="11">Entity N</text>

<text x="230" y="70" fill="#9cdca8" font-size="11">1:1</text>
<text x="380" y="70" fill="#9cdca8" font-size="11">1:Many</text>
<text x="545" y="70" fill="#9cdca8" font-size="11">1:1</text>
<text x="705" y="70" fill="#9cdca8" font-size="11">1:Many</text>

<g stroke="#e0e0e0" fill="none" marker-end="url(#a3)">
<line x1="140" y1="105" x2="198" y2="105"/>
<line x1="340" y1="100" x2="408" y2="73"/>
<line x1="340" y1="110" x2="408" y2="133"/>
<line x1="520" y1="73" x2="578" y2="73"/>
<line x1="520" y1="133" x2="578" y2="133"/>
<line x1="690" y1="73" x2="738" y2="70"/>
<line x1="690" y1="133" x2="738" y2="115"/>
<line x1="775" y1="130" x2="775" y2="165"/>
<line x1="775" y1="215" x2="775" y2="245"/>
</g>
<defs><marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e0e0e0"/></marker></defs>

<rect x="730" y="165" width="90" height="24" fill="none" stroke="#e0e0e0"/><text x="775" y="181" fill="#e0e0e0" text-anchor="middle">Dialect</text>
<text x="795" y="200" fill="#9cdca8" font-size="11">JQL</text>
<rect x="720" y="245" width="110" height="24" fill="none" stroke="#e0e0e0"/><text x="775" y="261" fill="#e0e0e0" text-anchor="middle">JDBC/Driver</text>
<text x="795" y="230" fill="#9cdca8" font-size="11">SQL</text>
<ellipse cx="775" cy="310" rx="35" ry="18" fill="none" stroke="#e0e0e0"/><text x="775" y="315" fill="#e0e0e0" text-anchor="middle" font-size="11">DB1</text>
<line x1="775" y1="269" x2="775" y2="292" stroke="#e0e0e0" marker-end="url(#a3)"/>

<text x="20" y="345" fill="#e0e0e0">First is the Persistence Unit!! Here we provide configuration!!</text>
<text x="20" y="365" fill="#e0e0e0">In spring boot persistence unit is Application.properties!!</text>
<text x="20" y="385" fill="#e0e0e0">Using that Persistence Unit an object of Entity managerFactory is created which creates Entity manager !!</text>
<text x="20" y="405" fill="#e0e0e0">One persistence unit has One Entitymanager Factory!! If we have Multiple Db then do not use</text>
<text x="20" y="423" fill="#e0e0e0">application.properties! Use Configuration Annotation class and provide properties of both DB!!</text>
<text x="20" y="443" fill="#e0e0e0">EntityManager in hibernate is Session, In JPA we call it Entity Manager!! If you see Jpa it internally has EntityManager</text>
</svg>
