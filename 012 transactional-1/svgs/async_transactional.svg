<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-async" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <filter id="shadow-async" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="920" height="440" rx="16" fill="url(#bg-async)"/>

  <!-- Title -->
  <g transform="translate(40, 35)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">
      @Transactional with @Async Execution
    </text>
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">
      Spring transactions are bound to ThreadLocal — Transactions DO NOT propagate to new async threads
    </text>
  </g>

  <!-- Left Side: Main Thread -->
  <g transform="translate(40, 85)" filter="url(#shadow-async)">
    <rect width="390" height="230" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="16" y="14" width="358" height="30" rx="6" fill="#1d4ed8"/>
    <text x="195" y="34" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
      🧵 Thread-1 (HTTP / Main Request Thread)
    </text>

    <!-- Code in Main Thread -->
    <g transform="translate(20, 60)">
      <text x="0" y="14" font-family="'Consolas', monospace" font-size="11" fill="#fef08a">@Transactional</text>
      <text x="0" y="32" font-family="'Consolas', monospace" font-size="11" fill="#e2e8f0">public void registerUser(User user) {</text>
      <text x="14" y="52" font-family="'Consolas', monospace" font-size="11" fill="#93c5fd">  userRepository.save(user);</text>
      <text x="210" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#34d399">← Main Tx (TX-1)</text>
      <text x="14" y="74" font-family="'Consolas', monospace" font-size="11" fill="#ec4899">  userService.sendEmailAsync(user);</text>
      <text x="0" y="94" font-family="'Consolas', monospace" font-size="11" fill="#e2e8f0">}</text>

      <rect x="0" y="110" width="350" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="126" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#60a5fa">ThreadLocal Context: [ TX-1 Active ]</text>
      <text x="12" y="142" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">Commits or rolls back only operations on Thread-1</text>
    </g>
  </g>

  <!-- Flow Connector -->
  <path d="M 430 190 L 485 190" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-blue)" fill="none"/>
  <text x="460" y="175" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">spawns</text>

  <!-- Right Side: Async Worker Thread -->
  <g transform="translate(490, 85)" filter="url(#shadow-async)">
    <rect width="390" height="230" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="16" y="14" width="358" height="30" rx="6" fill="#6d28d9"/>
    <text x="195" y="34" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
      🧵 Thread-2 (TaskExecutor Worker Thread)
    </text>

    <!-- Code in Async Worker Thread -->
    <g transform="translate(20, 60)">
      <text x="0" y="14" font-family="'Consolas', monospace" font-size="11" fill="#fef08a">@Async</text>
      <text x="50" y="14" font-family="'Consolas', monospace" font-size="11" fill="#a7f3d0">@Transactional</text>
      <text x="0" y="32" font-family="'Consolas', monospace" font-size="11" fill="#e2e8f0">public CompletableFuture&lt;Void&gt; sendEmailAsync() {</text>
      <text x="14" y="52" font-family="'Consolas', monospace" font-size="11" fill="#93c5fd">  emailRepository.save(...);</text>
      <text x="190" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#c084fc">← Separate Tx (TX-2)</text>
      <text x="14" y="74" font-family="'Consolas', monospace" font-size="11" fill="#e2e8f0">  return CompletableFuture.completedFuture(null);</text>
      <text x="0" y="94" font-family="'Consolas', monospace" font-size="11" fill="#e2e8f0">}</text>

      <rect x="0" y="110" width="350" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="126" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#c084fc">ThreadLocal Context: [ TX-2 Separate ]</text>
      <text x="12" y="142" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">If omitted, this thread runs with NO transaction!</text>
    </g>
  </g>

  <!-- Key Takeaway Box -->
  <g transform="translate(40, 335)" filter="url(#shadow-async)">
    <rect width="840" height="75" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f59e0b">
      💡 Key Takeaway for Developers &amp; Interviews:
    </text>
    <text x="20" y="46" font-family="system-ui, sans-serif" font-size="11.5" fill="#e2e8f0">
      • <tspan font-weight="600">No Auto-Propagation:</tspan> Calling an async method starts a new thread with an empty ThreadLocal context.
    </text>
    <text x="20" y="63" font-family="system-ui, sans-serif" font-size="11.5" fill="#94a3b8">
      • Must explicitly declare <tspan font-family="'Consolas', monospace" fill="#a7f3d0">@Transactional</tspan> on the async method if you need DB transaction guarantees inside it.
    </text>
  </g>
</svg>
