<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#131d2e"/>
    </linearGradient>

    <linearGradient id="caller-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="proxy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="target-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="db-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>

    <filter id="p-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="920" height="480" rx="16" fill="url(#bg-p)"/>

  <!-- Header -->
  <g transform="translate(40, 35)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">
      Spring @Transactional Proxy Mechanism
    </text>
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">
      AOP Proxy intercepts method invocation to manage transaction lifecycle (Begin, Commit, Rollback)
    </text>
  </g>

  <!-- Main Pipeline Diagram -->
  <g transform="translate(40, 85)">
    <!-- 1. Caller / Controller -->
    <g transform="translate(0, 40)" filter="url(#p-shadow)">
      <rect width="160" height="150" rx="12" fill="url(#caller-grad)" stroke="#475569" stroke-width="1.5"/>
      <text x="80" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">Client / Controller</text>
      <line x1="16" y1="46" x2="144" y2="46" stroke="#475569" stroke-width="1"/>
      <text x="80" y="75" font-family="'Consolas', monospace" font-size="11" fill="#93c5fd" text-anchor="middle">service.createEmp()</text>
      <text x="80" y="105" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Calls public method</text>
      <rect x="24" y="118" width="112" height="20" rx="4" fill="#0f172a"/>
      <text x="80" y="132" font-family="system-ui, sans-serif" font-size="9.5" fill="#38bdf8" text-anchor="middle">Entry Point</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 160 115 L 210 115" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

    <!-- 2. Spring AOP Proxy Wrapper -->
    <g transform="translate(220, 0)" filter="url(#p-shadow)">
      <rect width="250" height="230" rx="14" fill="url(#proxy-grad)" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,3"/>
      <rect x="16" y="14" width="218" height="26" rx="6" fill="#1e1b4b"/>
      <text x="125" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" text-anchor="middle">Spring AOP Proxy Wrapper</text>
      
      <!-- Before step -->
      <rect x="16" y="52" width="218" height="42" rx="6" fill="#1e1b4b" stroke="#4338ca"/>
      <text x="24" y="68" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#818cf8">1. BEFORE INVOKING:</text>
      <text x="24" y="84" font-family="'Consolas', monospace" font-size="10" fill="#e0e7ff">txManager.getTransaction()</text>

      <!-- Target call placeholder -->
      <text x="125" y="115" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#c7d2fe" text-anchor="middle">▼ invokes real target method ▼</text>

      <!-- After step -->
      <rect x="16" y="130" width="218" height="88" rx="6" fill="#1e1b4b" stroke="#4338ca"/>
      <text x="24" y="148" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#818cf8">2. AFTER COMPLETION:</text>
      <text x="24" y="166" font-family="system-ui, sans-serif" font-size="10" fill="#34d399">✔ Success → COMMIT</text>
      <text x="24" y="184" font-family="system-ui, sans-serif" font-size="10" fill="#f87171">✖ RuntimeException → ROLLBACK</text>
      <text x="24" y="202" font-family="system-ui, sans-serif" font-size="10" fill="#fbbf24">⚠ Checked Exception → COMMIT*</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 470 115 L 520 115" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

    <!-- 3. Target Bean (Actual Service) -->
    <g transform="translate(530, 20)" filter="url(#p-shadow)">
      <rect width="200" height="190" rx="12" fill="url(#target-grad)" stroke="#10b981" stroke-width="1.5"/>
      <text x="100" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#d1fae5" text-anchor="middle">Actual Service Bean</text>
      <line x1="14" y1="40" x2="186" y2="40" stroke="#047857" stroke-width="1"/>
      
      <rect x="14" y="52" width="172" height="122" rx="6" fill="#022c22"/>
      <text x="22" y="70" font-family="'Consolas', monospace" font-size="10" fill="#6ee7b7">@Service</text>
      <text x="22" y="86" font-family="'Consolas', monospace" font-size="10" fill="#6ee7b7">class EmployeeService {</text>
      <text x="32" y="104" font-family="'Consolas', monospace" font-size="10" fill="#fef08a">  @Transactional</text>
      <text x="32" y="120" font-family="'Consolas', monospace" font-size="10" fill="#e2e8f0">  void create() {</text>
      <text x="42" y="136" font-family="'Consolas', monospace" font-size="10" fill="#93c5fd">    repo.save(e);</text>
      <text x="32" y="152" font-family="'Consolas', monospace" font-size="10" fill="#e2e8f0">  }</text>
      <text x="22" y="166" font-family="'Consolas', monospace" font-size="10" fill="#6ee7b7">}</text>
    </g>

    <!-- Arrow 3 -> Database -->
    <path d="M 730 115 L 770 115" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)" fill="none"/>

    <!-- 4. Database -->
    <g transform="translate(780, 45)" filter="url(#p-shadow)">
      <rect width="100" height="140" rx="10" fill="url(#db-grad)" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="50" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffe4e6" text-anchor="middle">Database</text>
      <line x1="12" y1="44" x2="88" y2="44" stroke="#9d174d" stroke-width="1"/>
      <text x="50" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#fbcfe8" text-anchor="middle">BEGIN</text>
      <text x="50" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#fbcfe8" text-anchor="middle">INSERT / SQL</text>
      <text x="50" y="115" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">COMMIT</text>
    </g>
  </g>

  <!-- Gotcha Callout: Self Invocation Pitfall -->
  <g transform="translate(40, 350)" filter="url(#p-shadow)">
    <rect width="840" height="100" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <rect x="16" y="14" width="170" height="24" rx="4" fill="#4338ca"/>
    <text x="101" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">⚠️ SELF-INVOCATION PITFALL</text>
    
    <text x="16" y="56" font-family="system-ui, sans-serif" font-size="11.5" fill="#e0e7ff">
      Calling a <tspan font-family="'Consolas', monospace" fill="#fbbf24">@Transactional</tspan> method directly from within the same class (e.g. <tspan font-family="'Consolas', monospace" fill="#f87171">this.methodB()</tspan>) bypasses the proxy wrapper!
    </text>
    <text x="16" y="78" font-family="system-ui, sans-serif" font-size="11.5" fill="#94a3b8">
      Since the proxy is bypassed, <tspan fill="#f87171" font-weight="600">NO transaction is created</tspan> and rollback rules will NOT take effect.
    </text>
  </g>
</svg>
