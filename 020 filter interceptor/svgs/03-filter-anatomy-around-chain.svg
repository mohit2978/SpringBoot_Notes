  <text x="500.0" y="460.2" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="normal" xml:space="preserve">Don&#x27;t call chain.doFilter() → the request STOPS here (e.g. send 401). You must write the response yourself.</text>
  <text x="500.0" y="520.0" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="15" fill="#868e96" text-anchor="middle" font-weight="normal" xml:space="preserve">Lifecycle:  init() once at startup  ·  doFilter() for every request  ·  destroy() once at shutdown</text>
