  <text x="50.0" y="117.0" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal" xml:space="preserve">public void doFilter(req, res, chain) {</text>
  <text x="50.0" y="143.0" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#868e96" text-anchor="start" font-weight="normal" xml:space="preserve">  // BEFORE: runs on the way in</text>
  <text x="50.0" y="169.0" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal" xml:space="preserve">  log / auth check / set headers</text>
  <text x="50.0" y="195.0" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal" xml:space="preserve"></text>
  <text x="50.0" y="221.0" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#6741d9" text-anchor="start" font-weight="bold" xml:space="preserve">  chain.doFilter(req, res);</text>
  <text x="50.0" y="247.0" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#868e96" text-anchor="start" font-weight="normal" xml:space="preserve">  // → next filter → servlet</text>
  <text x="50.0" y="273.0" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#868e96" text-anchor="start" font-weight="normal" xml:space="preserve">  //   → controller → back here</text>
  <text x="50.0" y="299.0" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal" xml:space="preserve"></text>
  <text x="50.0" y="325.0" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#868e96" text-anchor="start" font-weight="normal" xml:space="preserve">  // AFTER: runs on the way out</text>
  <text x="50.0" y="351.0" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal" xml:space="preserve">  log time taken / add headers</text>
  <text x="50.0" y="377.0" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal" xml:space="preserve">}</text>
  <rect x="540" y="95" width="420" height="60" rx="10" fill="#ffd8a8"/>
