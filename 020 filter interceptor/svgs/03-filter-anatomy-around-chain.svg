  <path d="M550.5,315.0 Q749.0,315.9 949.7,315.6 Q960.9,314.8 959.8,325.9 Q960.7,344.0 959.3,364.3 Q960.8,375.6 949.3,375.7 Q751.4,375.5 549.7,375.1 Q539.3,374.0 540.9,365.3 Q540.1,346.3 539.9,325.7 Q540.7,314.4 552.5,314.6" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
