  <rect x="540" y="200" width="420" height="70" rx="10" fill="#d0bfff"/>
  <path d="M550.2,199.3 Q749.3,199.5 949.7,199.2 Q960.7,201.0 959.9,210.0 Q958.8,233.8 959.7,259.5 Q960.7,269.3 949.0,270.9 Q750.1,268.9 550.1,269.1 Q540.1,271.0 540.7,260.4 Q539.3,234.6 539.3,210.5 Q540.1,200.6 552.7,199.4" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
