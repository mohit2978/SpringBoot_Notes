<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500.0" y="44.0" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', cursive" font-size="26" fill="#1e1e1e" text-anchor="middle" font-weight="bold" xml:space="preserve">A filter = code AROUND chain.doFilter()</text>
  <rect x="30" y="85" width="460" height="320" rx="10" fill="#e9ecef"/>
  <path d="M39.6,84.3 Q260.5,83.7 480.1,84.7 Q489.1,85.0 489.1,94.9 Q488.7,243.8 489.8,395.7 Q489.2,404.4 480.3,405.9 Q260.2,404.7 41.0,404.1 Q30.7,404.6 29.3,394.2 Q29.4,245.9 29.4,95.2 Q30.3,84.7 43.1,84.1" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
