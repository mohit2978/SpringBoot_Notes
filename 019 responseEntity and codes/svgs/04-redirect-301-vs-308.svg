<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f87171"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="680" rx="16" fill="url(#bgGrad4)"/>

  <!-- Title Banner -->
  <rect x="35" y="20" width="930" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow4)"/>
  <text x="55" y="54" fill="#38bdf8" font-family="Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold">3xx Redirection Architecture: 301 vs 308 &amp; Caching with 304</text>
  <text x="730" y="54" fill="#fbbf24" font-family="Segoe UI, Roboto, sans-serif" font-size="13">HTTP Method Preservation</text>

  <!-- Scenario Setup Box -->
  <rect x="35" y="88" width="930" height="55" rx="8" fill="#111827" stroke="#475569" stroke-width="1"/>
  <text x="55" y="112" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold">Migration Scenario:</text>
  <text x="195" y="112" fill="#94a3b8" font-family="Segoe UI, Roboto, sans-serif" font-size="12">You deprecate legacy endpoint <tspan fill="#fca5a5" font-family="Consolas, monospace">POST /api/v1/orders</tspan> and redirect clients to <tspan fill="#a7f3d0" font-family="Consolas, monospace">/api/v2/orders</tspan>.</text>
  <text x="55" y="132" fill="#cbd5e1" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">What happens to the HTTP method (POST) and payload during the redirection?</text>

  <!-- LEFT: 301 Moved Permanently -->
  <rect x="35" y="155" width="455" height="340" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow4)"/>
  <rect x="50" y="168" width="425" height="32" rx="6" fill="url(#warnGrad)"/>
  <text x="62" y="189" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="bold">301 Moved Permanently (Legacy Standard)</text>

  <rect x="50" y="210" width="425" height="95" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="62" y="230" fill="#94a3b8" font-family="Consolas, monospace" font-size="11.5">Client sends: <tspan fill="#38bdf8" font-weight="bold">POST</tspan> /api/v1/orders { &quot;id&quot;: 101 }</text>
  <text x="62" y="252" fill="#fbbf24" font-family="Consolas, monospace" font-size="11.5">Server returns: <tspan fill="#f59e0b" font-weight="bold">301 Moved Permanently</tspan></text>
  <text x="62" y="270" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">Header &#x27A4; Location: /api/v2/orders</text>
  <text x="62" y="292" fill="#f87171" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">&#x26A0; Browser rewrites to: GET /api/v2/orders (Drops Body!)</text>

  <rect x="50" y="315" width="425" height="165" rx="8" fill="#451a03" stroke="#b45309" stroke-width="1"/>
  <text x="62" y="338" fill="#fde68a" font-family="Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="bold">Why 301 Causes Breaking Bugs in APIs:</text>
  <text x="62" y="362" fill="#fef3c7" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; Historical browser behavior: 301 allows changing</text>
  <text x="62" y="380" fill="#fef3c7" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">the request method from <tspan font-weight="bold" fill="#fca5a5">POST to GET</tspan>.</text>
  <text x="62" y="402" fill="#fef3c7" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; When method is rewritten to GET, the <tspan font-weight="bold">request payload</tspan></text>
  <text x="62" y="420" fill="#fef3c7" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">is lost, causing target endpoint to fail!</text>
  <text x="62" y="445" fill="#fca5a5" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="bold">&#x27A4; Postman Tip: Turn off &quot;Automatically follow redirects&quot;</text>
  <text x="62" y="463" fill="#fca5a5" font-family="Segoe UI, Roboto, sans-serif" font-size="11">in Settings to inspect 301 response headers and Location URI.</text>

  <!-- RIGHT: 308 Permanent Redirect -->
  <rect x="510" y="155" width="455" height="340" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow4)"/>
  <rect x="525" y="168" width="425" height="32" rx="6" fill="url(#successGrad)"/>
  <text x="537" y="189" fill="#ffffff" font-family="Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="bold">308 Permanent Redirect (Modern RFC 7538)</text>

  <rect x="525" y="210" width="425" height="95" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="537" y="230" fill="#94a3b8" font-family="Consolas, monospace" font-size="11.5">Client sends: <tspan fill="#38bdf8" font-weight="bold">POST</tspan> /api/v1/orders { &quot;id&quot;: 101 }</text>
  <text x="537" y="252" fill="#34d399" font-family="Consolas, monospace" font-size="11.5">Server returns: <tspan fill="#34d399" font-weight="bold">308 Permanent Redirect</tspan></text>
  <text x="537" y="270" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">Header &#x27A4; Location: /api/v2/orders</text>
  <text x="537" y="292" fill="#34d399" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">&#x2714; Client MUST re-send: POST /api/v2/orders with BODY intact!</text>

  <rect x="525" y="315" width="425" height="165" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="537" y="338" fill="#a7f3d0" font-family="Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="bold">Why 308 is the Preferred Standard for REST APIs:</text>
  <text x="537" y="362" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; <tspan font-weight="bold" fill="#34d399">Strict Method Preservation:</tspan> The specification explicitly</text>
  <text x="537" y="380" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">forbids clients from changing the HTTP method.</text>
  <text x="537" y="402" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; POST remains POST, PUT remains PUT, DELETE stays DELETE.</text>
  <text x="537" y="420" fill="#ecfdf5" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5">&#x2022; Full request payload is guaranteed delivered to the new URI.</text>
  <text x="537" y="445" fill="#a7f3d0" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="bold">&#x2714; Industry Rule: For modern REST APIs &amp; microservice migrations,</text>
  <text x="537" y="463" fill="#a7f3d0" font-family="Segoe UI, Roboto, sans-serif" font-size="11">always choose 308 over 301 when redirecting POST/PUT calls.</text>

  <!-- BOTTOM PANEL: 304 Not Modified & Caching Deep Dive -->
  <rect x="35" y="510" width="930" height="150" rx="10" fill="#111827" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow4)"/>
  <rect x="50" y="522" width="260" height="24" rx="4" fill="#1e3a8a"/>
  <text x="60" y="539" fill="#93c5fd" font-family="Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">304 Not Modified: Caching Protocol &amp; The PATCH Trap</text>

  <!-- Caching Flow Left -->
  <text x="55" y="568" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12"><tspan fill="#60a5fa" font-weight="bold">1. How 304 Works for GET:</tspan> Client calls GET &#x27A4; Server returns <tspan font-family="Consolas, monospace" fill="#fed7aa">Last-Modified: 10:00 AM</tspan> &#x27A4; Client caches response.</text>
  <text x="55" y="588" fill="#e2e8f0" font-family="Segoe UI, Roboto, sans-serif" font-size="12">Next call sends <tspan font-family="Consolas, monospace" fill="#fed7aa">If-Modified-Since: 10:00 AM</tspan> &#x27A4; Server checks DB &#x27A4; Not updated &#x27A4; Returns <tspan fill="#6ee7b7" font-weight="bold">304 Not Modified</tspan> with EMPTY body (saves network!).</text>

  <!-- PATCH Warning Right -->
  <rect x="50" y="605" width="900" height="42" rx="6" fill="#4c0519" stroke="#e11d48" stroke-width="1"/>
  <text x="62" y="622" fill="#fda4af" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="bold">&#x26A0; CRITICAL GOTCHA: Never return 304 on a PATCH / PUT request!</text>
  <text x="62" y="638" fill="#ffe4e6" font-family="Segoe UI, Roboto, sans-serif" font-size="11">If a client sends <tspan font-family="Consolas, monospace" fill="#fed7aa">PATCH /user { name: &quot;John&quot; }</tspan> and name is already &quot;John&quot; in DB, do NOT return 304! Return <tspan fill="#34d399" font-weight="bold">200 OK</tspan> or <tspan fill="#34d399" font-weight="bold">204 No Content</tspan>.</text>
</svg>
