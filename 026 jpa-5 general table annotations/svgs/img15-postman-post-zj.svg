<text x="30" y="165" fill="#d4d4d4">{</text>
<text x="50" y="185" fill="#d4d4d4">"id": <tspan fill="#4ec9b0">2</tspan>,</text>
<text x="50" y="205" fill="#d4d4d4">"name": "zj",</text>
