<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, monospace" font-size="13">
<rect width="700" height="260" fill="#1e1e1e" rx="8"/>
<rect x="20" y="20" width="660" height="30" fill="#2a2a2a" rx="4"/>
<text x="30" y="40" fill="#d4a017" font-weight="bold">POST</text><text x="90" y="40" fill="#e0e0e0">localhost:8080/api/user</text>
<text x="30" y="75" fill="#e0e0e0" font-family="Segoe UI, Arial">Body (raw JSON):</text>
<text x="30" y="100" fill="#d4d4d4">{ "name": "zj", "phone": "1111" }</text>
