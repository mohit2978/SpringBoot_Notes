<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="'Courier New', monospace">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#aaa"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#88aaff"/>
    </marker>
    <clipPath id="stepClip"><rect x="440" y="80" width="238" height="248"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="860" height="420" fill="#16213e" rx="12"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#e0e0e0">Servlet Architecture</text>

  <!-- ── LEFT SIDE: Input Request ── -->
  <text x="8" y="204" font-size="12" fill="#aaa">Input</text>
  <text x="8" y="219" font-size="12" fill="#aaa">Request</text>
  <line x1="78" y1="208" x2="148" y2="208" stroke="#aaa" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Servlet Container outer box -->
  <rect x="148" y="80" width="225" height="255" fill="none" stroke="#6699ff" stroke-width="2" rx="6"/>
  <text x="260" y="100" text-anchor="middle" font-size="11" fill="#6699ff" font-weight="bold">Servlet Container</text>

  <!-- Tomcat inner box -->
  <rect x="162" y="118" width="197" height="130" fill="#1e1e3a" stroke="#555" stroke-width="1.5" rx="4"/>
  <text x="260" y="178" text-anchor="middle" font-size="15" fill="#e0e0e0" font-weight="bold">Tomcat</text>
  <text x="260" y="197" text-anchor="middle" font-size="9.5" fill="#888">(our application is</text>
  <text x="260" y="211" text-anchor="middle" font-size="9.5" fill="#888">deployed here)</text>

  <!-- Response Arrow -->
  <text x="8" y="345" font-size="12" fill="#aaa">Response</text>
  <line x1="148" y1="340" x2="78" y2="340" stroke="#aaa" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ── MIDDLE: Steps box ── -->
  <rect x="393" y="80" width="225" height="255" fill="#0d1b2a" stroke="#444" stroke-width="1" rx="6"/>

  <!-- Step 1 -->
  <text x="407" y="108" font-size="11" fill="#ccc" font-weight="bold">1. Uses</text>
  <text x="463" y="108" font-size="11" fill="#6699ff" font-weight="bold">Web.xml</text>
  <text x="521" y="108" font-size="11" fill="#ccc">to</text>
  <text x="407" y="124" font-size="11" fill="#ccc">determine which Servlet</text>
  <text x="407" y="140" font-size="11" fill="#ccc">to invoke</text>

  <!-- Step 2 -->
  <text x="407" y="200" font-size="11" fill="#ccc" font-weight="bold">2. Invokes Particular</text>
  <text x="407" y="216" font-size="11" fill="#ccc">Servlet</text>

  <!-- Step 3 -->
  <text x="407" y="300" font-size="11" fill="#ccc" font-weight="bold">3. Response</text>

  <!-- ── RIGHT SIDE: Web.xml box ── -->
  <rect x="638" y="75" width="205" height="95" fill="#0f2a0f" stroke="#66bb66" stroke-width="1.5" rx="5"/>
  <text x="740" y="99" text-anchor="middle" font-size="12" fill="#66bb66" font-weight="bold">Web.xml</text>
  <text x="740" y="120" text-anchor="middle" font-size="11" fill="#99cc99">Servlet</text>
  <text x="740" y="137" text-anchor="middle" font-size="11" fill="#99cc99">mapping</text>

  <!-- Servlet box -->
  <rect x="638" y="243" width="205" height="58" fill="#1a1a2e" stroke="#cc99ff" stroke-width="1.5" rx="5"/>
  <text x="740" y="278" text-anchor="middle" font-size="13" fill="#cc99ff" font-weight="bold">Servlet</text>

  <!-- ── ARROWS ── -->
  <!-- Tomcat → steps (step1) -->
  <line x1="373" y1="175" x2="393" y2="120" stroke="#88aaff" stroke-width="1.5" marker-end="url(#arrB)"/>
  <!-- steps → Web.xml -->
  <line x1="618" y1="118" x2="638" y2="118" stroke="#88aaff" stroke-width="1.5" marker-end="url(#arrB)"/>
  <!-- steps → Servlet (step2) -->
  <line x1="618" y1="208" x2="638" y2="262" stroke="#88aaff" stroke-width="1.5" marker-end="url(#arrB)"/>
  <!-- Servlet → steps (response back) -->
  <line x1="638" y1="282" x2="618" y2="300" stroke="#88aaff" stroke-width="1.5" marker-end="url(#arrB)"/>
  <!-- steps → Tomcat (response back) -->
  <line x1="393" y1="302" x2="373" y2="265" stroke="#88aaff" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- ── BOTTOM NOTES ── -->
  <text x="430" y="365" text-anchor="middle" font-size="12" fill="#ffee66" font-weight="bold">One Servlet can have only 1 Get, Post, Put, Delete request only.</text>
  <text x="430" y="385" text-anchor="middle" font-size="11" fill="#aaa">Servlet Container manages Servlets. E.g. Tomcat = Servlet Container.</text>
  <text x="430" y="402" text-anchor="middle" font-size="11" fill="#aaa">Server is basically software that helps you give your program to the world!</text>
</svg>
