<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 440" width="100%" height="100%" font-family="Arial, sans-serif">
  <defs>
    <!-- Standard Arrowhead marker (orient="auto" points in the line's travel direction) -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1060" height="440" fill="#141414" rx="8"/>

  <!-- ── 1. LEFT-MOST: Request & Response Arrows ── -->
  <!-- Request: Points RIGHT into Tomcat -->
  <text x="50" y="93" font-size="15" font-weight="bold" fill="#ffffff">Request</text>
  <line x1="15" y1="102" x2="150" y2="102" stroke="#ffffff" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Response: Points LEFT out of Tomcat -->
  <text x="45" y="348" font-size="15" font-weight="bold" fill="#ffffff">Response</text>
  <line x1="150" y1="358" x2="15" y2="358" stroke="#ffffff" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ── 2. SERVLET CONTAINER / TOMCAT ── -->
  <text x="245" y="55" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Servlet Container</text>
  <rect x="150" y="68" width="190" height="305" fill="#1e1e1e" stroke="#cccccc" stroke-width="1.5" rx="3"/>
  <text x="245" y="195" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Tomcat</text>
  <text x="245" y="325" text-anchor="middle" font-size="11.5" fill="#cccccc">(our application is deployed here)</text>

  <!-- ── 3. ARROWS: Tomcat <-> DispatcherServlet ── -->
  <!-- Request into DispatcherServlet (Points RIGHT) -->
  <line x1="340" y1="195" x2="400" y2="195" stroke="#ffffff" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- Response back to Tomcat (Points LEFT) -->
  <line x1="400" y1="358" x2="340" y2="358" stroke="#ffffff" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ── 4. DISPATCHERSERVLET BOX ── -->
  <rect x="400" y="68" width="170" height="305" fill="#1e1e1e" stroke="#cccccc" stroke-width="1.5" rx="3"/>
  <text x="485" y="225" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">DispatcherServlet</text>

  <!-- ── 5. RIGHT FLOWS (Steps 1 to 4) ── -->

  <!-- STEP 1: Choose the controller (Points RIGHT to Uses HandlerMapping) -->
  <text x="675" y="93" text-anchor="middle" font-size="13.5" fill="#ffffff">1.  Choose the controller</text>
  <line x1="570" y1="102" x2="780" y2="102" stroke="#ffffff" stroke-width="1.6" marker-end="url(#arrow)"/>
  
  <!-- Box 1: Uses HandlerMapping -->
  <rect x="780" y="78" width="250" height="48" fill="#1e1e1e" stroke="#cccccc" stroke-width="1.5" rx="3"/>
  <text x="905" y="107" text-anchor="middle" font-size="13.5" fill="#ffffff">Uses HandlerMapping</text>

  <!-- STEP 2: Create an Instance (Points RIGHT to IoC) -->
  <text x="675" y="190" text-anchor="middle" font-size="13.5" fill="#ffffff">2.  Create an Instance</text>
  <line x1="570" y1="198" x2="780" y2="198" stroke="#ffffff" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Box 2: IoC -->
  <rect x="780" y="158" width="250" height="80" fill="#1e1e1e" stroke="#cccccc" stroke-width="1.5" rx="3"/>
  <text x="905" y="183" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">IoC</text>
  <text x="905" y="204" text-anchor="middle" font-size="11" fill="#cccccc">(Initiate an instance of Controller</text>
  <text x="905" y="222" text-anchor="middle" font-size="11" fill="#cccccc">along with its dependencies)</text>

  <!-- STEP 3 & 4 Box: Respective API get invoked -->
  <rect x="780" y="268" width="250" height="105" fill="#1e1e1e" stroke="#cccccc" stroke-width="1.5" rx="3"/>
  <text x="905" y="325" text-anchor="middle" font-size="13.5" fill="#ffffff">Respective API get invoked</text>

  <!-- STEP 3: Invokes Controller method (Points RIGHT to Respective API get invoked) -->
  <text x="675" y="287" text-anchor="middle" font-size="13.5" fill="#ffffff">3.  Invokes Controller method</text>
  <line x1="570" y1="296" x2="780" y2="296" stroke="#ffffff" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- STEP 4: Response (Points LEFT from Respective API box back to DispatcherServlet) -->
  <line x1="780" y1="350" x2="570" y2="350" stroke="#ffffff" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="675" y="375" text-anchor="middle" font-size="13.5" fill="#ffffff">4.  Response</text>
</svg>
