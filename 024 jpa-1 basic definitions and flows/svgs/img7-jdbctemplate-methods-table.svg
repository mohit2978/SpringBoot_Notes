<svg viewBox="0 0 1020 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">
<rect width="1020" height="700" fill="#1e1e1e" rx="8"/>
<text x="510" y="26" fill="#e0e0e0" font-size="16" text-anchor="middle">JdbcTemplate frequently used methods</text>

<g stroke="#777" fill="none">
<rect x="30" y="42" width="960" height="616"/>
<line x1="30" y1="68" x2="990" y2="68"/>
<line x1="30" y1="160" x2="990" y2="160"/>
<line x1="30" y1="278" x2="990" y2="278"/>
<line x1="30" y1="400" x2="990" y2="400"/>
<line x1="30" y1="484" x2="990" y2="484"/>
<line x1="30" y1="570" x2="990" y2="570"/>
<line x1="330" y1="42" x2="330" y2="658"/>
<line x1="395" y1="42" x2="395" y2="658"/>
</g>
<rect x="30" y="42" width="960" height="26" fill="#e8e8e8"/>
<text x="180" y="60" fill="#111" font-weight="bold" text-anchor="middle">Method Name</text>
<text x="362" y="60" fill="#111" font-weight="bold" text-anchor="middle">Use For</text>
<text x="690" y="60" fill="#111" font-weight="bold" text-anchor="middle">Sample</text>

<g fill="#e0e0e0">
<text x="180" y="98" text-anchor="middle">update(String sql, Object... args)</text>
<text x="362" y="90" text-anchor="middle">Insert</text><text x="362" y="106" text-anchor="middle">Update</text><text x="362" y="122" text-anchor="middle">Delete</text>
<text x="410" y="90">String insertQuery = "INSERT INTO users (user_name, age) VALUES (?, ?)";</text>
<text x="410" y="106">int rowsAffected = jdbcTemplate.update(insertQuery , "X", 27);</text>
<text x="410" y="132">String updateQuery= "UPDATE users SET age = ? WHERE user_id = ?";</text>
<text x="410" y="148">int rowsAffected = jdbcTemplate.update(updateQuery, 29, 1);</text>

<text x="180" y="218" text-anchor="middle">update(String sql, PreparedStatementSetter pss)</text>
<text x="362" y="210" text-anchor="middle">Insert</text><text x="362" y="226" text-anchor="middle">Update</text><text x="362" y="242" text-anchor="middle">Delete</text>
<text x="410" y="186">String insertQuery= "INSERT INTO users (user_name, age) VALUES (?, ?)";</text>
<text x="410" y="202">jdbcTemplate.update(insertQuery, (PreparedStatement ps) -&gt; {</text>
<text x="560" y="218">ps.setString(1, "X");</text>
<text x="560" y="234">ps.setInt(2, 25); });</text>
<text x="400" y="258">String updateQuery= "UPDATE users SET age = ? WHERE user_id = ?";</text>
<text x="410" y="272">jdbcTemplate.update(updateQuery, (PreparedStatement ps) -&gt; { ps.setString(1, 29); ps.setInt(2, 1); });</text>

<text x="180" y="344" text-anchor="middle">query(String sql, RowMapper&lt;T&gt; rowMapper)</text>
<text x="362" y="330" text-anchor="middle">Get</text><text x="362" y="346" text-anchor="middle">multiple</text><text x="362" y="362" text-anchor="middle">Rows</text>
<text x="420" y="300">List&lt;User&gt; users = jdbcTemplate.query("SELECT * FROM users",  (rs, rowNum) -&gt; {</text>
<text x="560" y="316">User user = new User();</text>
<text x="560" y="332">user.setUserId(rs.getInt("user_id"));</text>
<text x="560" y="348">user.setUserName(rs.getString("user_name"));</text>
<text x="560" y="364">user.setAge(rs.getInt("age"));</text>
<text x="560" y="380">return user;  });</text>

<text x="180" y="440" text-anchor="middle">queryForList(String sql, Class&lt;T&gt; elementType)</text>
<text x="362" y="416" text-anchor="middle">Get</text><text x="362" y="432" text-anchor="middle">Single</text><text x="362" y="448" text-anchor="middle">Column of</text>
<text x="362" y="464" text-anchor="middle">Multiple Rows</text>
<text x="430" y="424">List&lt;String&gt; userNames =</text>
<text x="480" y="440">jdbcTemplate.queryForList("SELECT user_name FROM users", String.class);</text>

<text x="180" y="520" text-anchor="middle">queryForObject(String sql, Object[] args, Class&lt;T&gt;</text>
<text x="180" y="536" text-anchor="middle">requiredType)</text>
<text x="362" y="512" text-anchor="middle">Get</text><text x="362" y="528" text-anchor="middle">single</text><text x="362" y="544" text-anchor="middle">Row</text>
<text x="420" y="512">User user =</text>
<text x="450" y="528">jdbcTemplate.queryForObject("SELECT * FROM users WHERE user_id = ?", new Object[]{1},</text>
<text x="400" y="544">User.class);</text>

<text x="180" y="614" text-anchor="middle">queryForObject(String sql, Class&lt;T&gt; requiredType)</text>
<text x="362" y="598" text-anchor="middle">Get</text><text x="362" y="614" text-anchor="middle">Single</text><text x="362" y="630" text-anchor="middle">Value</text>
<text x="415" y="606">int userCount =</text>
<text x="445" y="622">jdbcTemplate.queryForObject("SELECT COUNT(*) FROM users", Integer.class);</text>
</g>

<text x="150" y="690" fill="#d4c017" font-size="14" font-style="italic">Variable Arguments ↑</text>
<text x="700" y="690" fill="#9cdca8" font-size="14" font-style="italic">↳ if Queries are Complex use this</text>
</svg>
